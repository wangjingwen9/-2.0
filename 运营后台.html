// ===== 设备编号配置 =====
function deviceInventoryRows(productId) {
  return (State.deviceInventory || []).filter(r => r.productId === productId);
}
function normalizeDeviceStatus(status) {
  if (status === "unavailable") return "available";
  if (status === "invalid") return "invalid";
  return status || "available";
}
function deviceStatusTag(status) {
  const map = {
    available: ["空闲", "tag-success"],
    allocated: ["已分配", "tag-primary"],
    provisioned: ["已开通", "tag-muted"],
    repair: ["维修", "tag-warning"],
    invalid: ["失效", "tag-danger"],
  };
  const cfg = map[normalizeDeviceStatus(status)] || map.available;
  return `<span class="tag ${cfg[1]}">${cfg[0]}</span>`;
}
function deviceNoSelectOptions(current = "") {
  const currentValue = String(current || "").trim();
  const rows = (State.deviceInventory || [])
    .filter(r => String(r.deviceNo || "").trim())
    .slice()
    .sort((a, b) => {
      const rank = s => s === "available" ? 0 : s === "repair" ? 1 : 2;
      return rank(a.status) - rank(b.status) || String(a.deviceNo || "").localeCompare(String(b.deviceNo || ""));
    });
  const seen = new Set();
  const opts = ['<option value="">请选择设备编号</option>'];
  rows.forEach(r => {
    const no = String(r.deviceNo || "").trim();
    if (!no || seen.has(no)) return;
    seen.add(no);
    const product = State.product.find(p => p.id === r.productId);
    const statusMap = { available: "空闲", allocated: "已分配", provisioned: "已开通", repair: "维修", invalid: "失效" };
    const statusText = statusMap[normalizeDeviceStatus(r.status)] || "空闲";
    const label = `${no}｜${statusText}${product ? "｜" + product.name : ""}`;
    opts.push(`<option value="${escapeHtml(no)}" ${no === currentValue ? "selected" : ""}>${escapeHtml(label)}</option>`);
  });
  if (currentValue && !seen.has(currentValue)) {
    opts.push(`<option value="${escapeHtml(currentValue)}" selected>${escapeHtml(currentValue)}｜当前值</option>`);
  }
  return opts.join("");
}
function finiteProductStock(product) {
  if (!product || product.productType === "cloudDisk" || Number(product.stock) < 0) return null;
  return Math.max(0, Number(product.stock) || 0);
}
function syncProductDevicePlaceholders(product) {
  const stock = finiteProductStock(product);
  if (stock === null) {
    State.deviceInventory = (State.deviceInventory || []).filter(r => r.productId !== product.id);
    return;
  }
  const source = product.inventorySource || "manual";
  const saved = deviceInventoryRows(product.id).slice().sort((a, b) => Number(a.sort || 0) - Number(b.sort || 0));
  const invalidDeviceRows = saved.filter(r => r.source === "device" && normalizeDeviceStatus(r.status) === "invalid");
  if (source !== "device" && saved.some(r => r.source === "device" && normalizeDeviceStatus(r.status) !== "invalid")) {
    State.deviceInventory = (State.deviceInventory || []).map(r => r.productId === product.id && r.source === "device"
      ? { ...r, status: "invalid", invalidReason: "库存来源已改为" + inventorySourceLabel(source), updatedBy: product.updatedBy || getCurrentOperator(), updatedAt: nowStr() }
      : r);
    return;
  }
  if (source === "device") {
    const activeRows = saved.filter(r => normalizeDeviceStatus(r.status) !== "invalid" && String(r.deviceNo || "").trim());
    const rows = activeRows;
    const invalidRows = saved.filter(r => normalizeDeviceStatus(r.status) === "invalid");
    State.deviceInventory = (State.deviceInventory || []).filter(r => r.productId !== product.id).concat(rows.map((r, i) => ({ ...r, source: "device", sort: i + 1 })), invalidRows);
    return;
  }
  const rows = [];
  for (let i = 0; i < stock; i++) {
    const old = saved[i] || {};
    rows.push({
      id: old.id || uid("dev_"),
      productId: product.id,
      sort: i + 1,
      deviceNo: source === "api" ? (old.deviceNo || `API-${product.code || "DEV"}-${String(i + 1).padStart(4, "0")}`) : (old.deviceNo || ""),
      status: normalizeDeviceStatus(old.status),
        source,
        remark: source === "api" ? (old.remark || "接口同步") : (old.remark || ""),
        updatedBy: old.updatedBy || product.updatedBy || product.createdBy || getCurrentOperator(),
        updatedAt: old.updatedAt || nowStr(),
      });
  }
  State.deviceInventory = (State.deviceInventory || []).filter(r => r.productId !== product.id).concat(rows, invalidDeviceRows);
}
function deviceInventoryListProducts() {
  return (State.product || []).filter(p => finiteProductStock(p) !== null);
}
function normalizeDeviceInventoryListData() {
  const list = deviceInventoryListProducts();
  const first = list[0];
  if (!first) return;
  first.inventorySource = "device";
  first.stock = 0;
  first.updatedAt = first.updatedAt || nowStr();
  list.slice(1, 3).forEach((product, idx) => {
    if (!product || localStorage.getItem(`scn.deviceInventory.invalidSampleDeleted.${product.id}`) === "1") return;
    product.inventorySource = "manual";
    product.stock = 0;
    product.updatedAt = product.updatedAt || nowStr();
    const hasInvalid = deviceInventoryRows(product.id).some(r => r.source === "device" && normalizeDeviceStatus(r.status) === "invalid");
    if (!hasInvalid) {
      State.deviceInventory = (State.deviceInventory || []).filter(r => r.productId !== product.id).concat([{
        id: uid("dev_"),
        productId: product.id,
        sort: 1,
        deviceNo: `DEV-INVALID-${String(idx + 1).padStart(4, "0")}`,
        status: "invalid",
        source: "device",
        remark: "库存来源已变更，设备编号数据失效",
        invalidReason: "库存来源已改为手动维护",
        updatedBy: product.updatedBy || product.createdBy || getCurrentOperator(),
        updatedAt: nowStr(),
      }]);
    }
  });
}

    const stock = finiteProductStock(product);
    const rows = deviceInventoryRows(product.id);
    const activeRows = rows.filter(r => normalizeDeviceStatus(r.status) !== "invalid");
    const invalidRows = rows.filter(r => normalizeDeviceStatus(r.status) === "invalid");
    const deviceManaged = (product.inventorySource || "manual") === "device";
    const total = deviceManaged ? activeRows.length : stock;
    const filled = activeRows.filter(r => String(r.deviceNo || "").trim()).length;
    const statusRows = activeRows.map(r => ({ ...r, status: normalizeDeviceStatus(r.status) }));
    return {
      stock,
      rows,
      activeRows,
      invalidRows,
      total,
      filled,
      available: statusRows.filter(r => r.status === "available").length,
      allocated: statusRows.filter(r => r.status === "allocated").length,
      provisioned: statusRows.filter(r => r.status === "provisioned").length,
      repair: statusRows.filter(r => r.status === "repair").length,
      latest: rows.slice().sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")))[0]?.updatedAt || "—",
    };
  }
  function productProviderInfo(product) {
    const computes = resolveProductComputes(product);
    const compute = computes[0];
    const sys = State.systemDisk.find(x => x.id === product.systemDiskId);
    const bw = State.bandwidth.find(x => x.id === product.bandwidthId);
    const dataDisks = (product.dataDiskIds || []).map(id => State.dataDisk.find(d => d.id === id)).filter(Boolean);
    const cloudDisks = (product.cloudDiskIds || []).map(id => State.cloudDisk.find(d => d.id === id)).filter(Boolean);
    const providerId = compute?.providerId || cloudDisks[0]?.providerId || sys?.providerId || bw?.providerId || dataDisks[0]?.providerId || product.providerId;
    const provider = State.provider.find(p => p.id === providerId);
    return { name: provider?.name || "—", region: provider?.region || "—" };
  }
  function renderRows() {
    const kw = ($("#deviceSearchInput").value || "").trim().toLowerCase();
    activeStatus = $("#deviceStatusFilter").value;
    State.filters.deviceInventoryStatus = activeStatus;
    let rows = deviceInventoryListProducts().slice(0, 3);
    if (kw) rows = rows.filter(p => [p.name, p.code].join(" ").toLowerCase().includes(kw));
    if (activeStatus) {
      rows = rows.filter(p => {
        const s = productDeviceSummary(p);
        const invalidOnly = s.invalidRows.length > 0 && !s.activeRows.length;
        return activeStatus === "invalid" ? invalidOnly : !invalidOnly;
      });
    }
    $("#deviceRowCount").textContent = `共 ${rows.length} 个`;
    if (!rows.length) {
      $("#deviceInventoryBody").innerHTML = `<tr><td colspan="10"><div class="empty">暂无需要维护设备编号的销售品</div></td></tr>`;
      return;
    }
    $("#deviceInventoryBody").innerHTML = rows.map(p => {
      const s = productDeviceSummary(p);
      const complete = s.total === s.filled && s.activeRows.length === s.total;
      const invalidOnly = s.invalidRows.length > 0 && !s.activeRows.length;
      const configStatus = invalidOnly ? deviceStatusTag("invalid") : '<span class="tag tag-success">有效</span>';
      const updater = p.updatedBy || p.createdBy || "运营管理员";
      const specText = renderProductSpecText(p);
      const provider = productProviderInfo(p);
      return `<tr data-id="${p.id}">
        <td><strong>${escapeHtml(p.name)}</strong></td>
        <td style="font-size:12px;color:#475569;line-height:1.55;white-space:normal;" title="${escapeHtml(specText)}">${escapeHtml(specText)}</td>
        <td><strong>${s.stock}</strong> 件</td>
        <td><span class="device-soft-count">${s.available}</span></td>
        <td>${configStatus}</td>
        <td>${escapeHtml(provider.name)}</td>
        <td>${escapeHtml(provider.region)}</td>
        <td>${escapeHtml(maskCreator(updater))}</td>
        <td style="color:#64748b;font-size:12px;">${escapeHtml(s.latest)}</td>
        <td><div class="actions">${invalidOnly ? `<button class="link-btn" data-act="detail">详情</button><span class="divider"></span><button class="link-btn link-danger" data-act="delete">删除</button>` : `<button class="link-btn" data-act="maintain">维护编号</button><span class="divider"></span><button class="link-btn" data-act="detail">详情</button>`}</div></td>
      </tr>`;
    }).join("");
    if (window.lucide) window.lucide.createIcons();
  }
  $("#deviceSearchInput").addEventListener("input", renderRows);
  $("#deviceStatusFilter").addEventListener("change", renderRows);
  $("#deviceQuery").addEventListener("click", renderRows);
  $("#deviceReset").addEventListener("click", () => {
    $("#deviceSearchInput").value = "";
    $("#deviceStatusFilter").value = "";
    activeStatus = "";
    State.filters.deviceInventoryStatus = "";
    renderRows();
  });
  $("#deviceRefresh").addEventListener("click", renderRows);
  $("#deviceInventoryBody").addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const product = State.product.find(p => p.id === e.target.closest("tr").dataset.id);
    if (!product) return;
    if (btn.dataset.act === "delete") {
      State.deviceInventory = (State.deviceInventory || []).filter(r => !(r.productId === product.id && r.source === "device" && normalizeDeviceStatus(r.status) === "invalid"));
      localStorage.setItem(`scn.deviceInventory.invalidSampleDeleted.${product.id}`, "1");
      persist("deviceInventory");
      toast("失效设备编号数据已删除", "success");
      renderRows();
      return;
    }
    openDeviceInventoryForm(product, renderRows, btn.dataset.act === "detail");
  });
  renderRows();
}

function openDeviceInventoryForm(product, onDone, readonly = false) {
  let stock = finiteProductStock(product);
  if (stock === null) { toast("云硬盘类销售品无需维护设备编号", "warn"); return; }
  const isApiSource = (product.inventorySource || "manual") === "api";
  const saved = deviceInventoryRows(product.id).slice().sort((a, b) => Number(a.sort || 0) - Number(b.sort || 0));
  const hasDeviceSourceRows = saved.some(r => r.source === "device" && normalizeDeviceStatus(r.status) !== "invalid");
  const deviceManaged = (product.inventorySource || "manual") === "device" || hasDeviceSourceRows;
  const disabledAttr = (isApiSource || readonly) ? "disabled" : "";
  let rows = [];
  function syncRowsToStock() {
    if (readonly && !deviceManaged && saved.some(r => r.source === "device" && normalizeDeviceStatus(r.status) === "invalid")) {
      rows = saved.filter(r => r.source === "device" && normalizeDeviceStatus(r.status) === "invalid").map((r, i) => ({ ...r, sort: i + 1, status: "invalid" }));
      stock = rows.length;
      return;
    }
    if (deviceManaged) {
      rows = (rows.length ? rows : saved.filter(r => normalizeDeviceStatus(r.status) !== "invalid")).map((r, i) => ({
        ...r,
        productId: product.id,
        sort: i + 1,
        source: "device",
        status: normalizeDeviceStatus(r.status),
        updatedAt: r.updatedAt || nowStr(),
      }));
      stock = rows.length;
      return;
    }
    const next = [];
    for (let i = 0; i < stock; i++) {
      const old = rows[i] || saved[i] || {};
      next.push({
        id: old.id || uid("dev_"),
        productId: product.id,
        sort: i + 1,
        deviceNo: old.deviceNo || (isApiSource ? `API-DEV-${String(i + 1).padStart(4, "0")}` : ""),
        status: normalizeDeviceStatus(old.status),
        enterpriseName: old.enterpriseName || "",
        source: isApiSource ? "api" : "manual",
        remark: old.remark || (isApiSource ? "接口同步" : ""),
        updatedAt: old.updatedAt || nowStr(),
      });
    }
    rows = next;
  }
  syncRowsToStock();
  const form = el(`<div class="commerce-form device-modal" data-form-title="设备编号配置">
    <div class="device-modal-hero">
      <div>
        <div class="device-modal-title"><i data-lucide="${isApiSource ? "cloud" : "barcode"}"></i><span>${escapeHtml(product.name)}</span></div>
        <div class="device-modal-code">${escapeHtml(product.code || "—")}</div>
        ${isApiSource ? `<div class="device-modal-tip">库存来源为接口同步，本页展示同步回来的设备编号与状态，不支持手动修改。</div>` : ""}
      </div>
      <div class="device-modal-source">${inventorySourceTag(product.inventorySource || "manual")}</div>
    </div>
    <div class="device-stats">
      <div class="device-stat neutral"><span>库存总数</span><strong id="deviceStatStock">0</strong></div>
      <div class="device-stat success"><span>空闲</span><strong id="deviceStatAvailable">0</strong></div>
      <div class="device-stat info"><span>已分配</span><strong id="deviceStatAllocated">0</strong></div>
      <div class="device-stat done"><span>已开通</span><strong id="deviceStatProvisioned">0</strong></div>
      <div class="device-stat warn"><span>维修</span><strong id="deviceStatRepair">0</strong></div>
    </div>
    ${deviceManaged && !readonly ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <span style="color:#64748b;font-size:12px;">设备编号获取最多支持维护 100 条编号</span>
      <button class="btn btn-primary" type="button" id="deviceAddRow">新增编号</button>
    </div>` : ""}
    <div class="device-edit-table">
      <table class="table" style="min-width:920px;">
        <thead><tr><th style="width:64px;">序号</th><th>设备编号 <span style="color:#ef4444;">*</span></th><th style="width:140px;">状态</th><th style="width:180px;">企业名称</th><th>备注</th>${deviceManaged && !readonly ? '<th style="width:72px;">操作</th>' : ""}</tr></thead>
        <tbody id="deviceRowsBody"></tbody>
      </table>
    </div>
  </div>`);
  function deviceRowHtml(r, i) {
    return `<tr data-device-row="${i}">
      <td><span class="device-row-index">${i + 1}</span></td>
      <td><input class="input" data-idx="${i}" data-field="deviceNo" value="${escapeHtml(r.deviceNo || (isApiSource ? `API-DEV-${String(i + 1).padStart(4, "0")}` : ""))}" placeholder="如 DEV-${String(i + 1).padStart(4, "0")}" ${disabledAttr} /></td>
      <td><select class="select" data-idx="${i}" data-field="status" ${disabledAttr}>${[["available", "空闲"], ["allocated", "已分配"], ["provisioned", "已开通"], ["repair", "维修"], ...(normalizeDeviceStatus(r.status) === "invalid" ? [["invalid", "失效"]] : [])].map(opt => `<option value="${opt[0]}" ${normalizeDeviceStatus(r.status) === opt[0] ? "selected" : ""}>${opt[1]}</option>`).join("")}</select></td>
      <td><input class="input" data-idx="${i}" data-field="enterpriseName" value="${escapeHtml(r.enterpriseName || "")}" placeholder="请输入企业名称" ${disabledAttr} /></td>
      <td><input class="input" data-idx="${i}" data-field="remark" value="${escapeHtml(r.remark || (isApiSource ? "接口同步" : ""))}" placeholder="设备说明 / 维修原因" ${disabledAttr} /></td>
      ${deviceManaged && !readonly ? `<td><button class="device-row-delete" type="button" data-remove-row="${i}">删除</button></td>` : ""}
    </tr>`;
  }
  function createDeviceRowElement(r, i) {
    const tbody = document.createElement("tbody");
    tbody.innerHTML = deviceRowHtml(r, i);
    return tbody.firstElementChild;
  }
  function bindDeviceRow(tr) {
    tr.querySelectorAll("[data-idx]").forEach(ctrl => {
      ctrl.addEventListener("input", e => {
        const idx = Number(e.target.dataset.idx);
        rows[idx][e.target.dataset.field] = e.target.value;
        updateProgress();
      });
      ctrl.addEventListener("change", e => {
        const idx = Number(e.target.dataset.idx);
        rows[idx][e.target.dataset.field] = e.target.value;
        updateProgress();
      });
    });
    const removeBtn = tr.querySelector("[data-remove-row]");
    if (removeBtn) {
      removeBtn.addEventListener("click", e => {
        rows.splice(Number(e.currentTarget.dataset.removeRow), 1);
        stock = rows.length;
        paintRows();
      });
    }
  }
  function paintRows() {
    const body = form.querySelector("#deviceRowsBody");
    body.innerHTML = rows.length ? rows.map(deviceRowHtml).join("") : `<tr><td colspan="${deviceManaged && !readonly ? 6 : 5}"><div class="empty">暂无设备编号</div></td></tr>`;
    body.querySelectorAll("[data-device-row]").forEach(bindDeviceRow);
    updateProgress();
  }
  function updateProgress() {
    const statusRows = rows.map(r => normalizeDeviceStatus(r.status));
    const available = statusRows.filter(s => s === "available").length;
    const allocated = statusRows.filter(s => s === "allocated").length;
    const provisioned = statusRows.filter(s => s === "provisioned").length;
    const repair = statusRows.filter(s => s === "repair").length;
    form.querySelector("#deviceStatStock").textContent = stock;
    form.querySelector("#deviceStatAvailable").textContent = available;
    form.querySelector("#deviceStatAllocated").textContent = allocated;
    form.querySelector("#deviceStatProvisioned").textContent = provisioned;
    form.querySelector("#deviceStatRepair").textContent = repair;
  }
  paintRows();
  const addBtn = form.querySelector("#deviceAddRow");
  if (addBtn) {
    addBtn.addEventListener("click", () => {
      if (rows.length >= 100) {
        toast("最多可维护 100 条设备编号", "warn");
        return;
      }
      const row = { id: uid("dev_"), productId: product.id, sort: rows.length + 1, deviceNo: "", status: "available", enterpriseName: "", source: "device", remark: "", updatedAt: nowStr() };
      rows.push(row);
      stock = rows.length;
      const body = form.querySelector("#deviceRowsBody");
      if (rows.length === 1) body.innerHTML = "";
      const tr = createDeviceRowElement(row, rows.length - 1);
      body.appendChild(tr);
      bindDeviceRow(tr);
      updateProgress();
    });
  }
  Modal.open({
    title: readonly || isApiSource ? "设备编号详情" : "维护设备编号",
    body: form,
    confirmText: readonly || isApiSource ? "关闭" : "保存配置",
    wide: true,
    onConfirm: () => {
      if (isApiSource || readonly) return true;
      syncRowsToStock();
      const empty = rows.findIndex(r => !String(r.deviceNo || "").trim());
      if (empty >= 0) { toast(`请维护第 ${empty + 1} 条设备编号`, "error"); return false; }
      const dupSet = new Set();
      const dup = rows.find(r => {
        const no = String(r.deviceNo || "").trim();
        if (dupSet.has(no)) return true;
        dupSet.add(no);
        return false;
      });
      if (dup) { toast("设备编号不能重复", "error"); return false; }
      if (!deviceManaged) product.stock = stock;
      product.updatedBy = getCurrentOperator();
      product.updatedAt = nowStr();
      const others = (State.deviceInventory || []).filter(r => r.productId !== product.id);
      State.deviceInventory = others.concat(rows.map((r, i) => ({ ...r, status: normalizeDeviceStatus(r.status), sort: i + 1, deviceNo: String(r.deviceNo || "").trim(), enterpriseName: String(r.enterpriseName || "").trim(), updatedBy: getCurrentOperator(), updatedAt: nowStr() })));
      persist("product");
      persist("deviceInventory");
      toast("设备编号配置已保存", "success");
      if (typeof onDone === "function") onDone();
    }
  });
  if (isApiSource) $("#modalCancel").style.display = "none";
  if (window.lucide) window.lucide.createIcons();
}

      <div class="ops-metric"><div><div class="ops-metric-label">已通过</div><div class="ops-metric-value">${approved}</div><div class="ops-metric-foot">审核单累计通过</div></div><div class="ops-metric-icon ok"><i data-lucide="check-circle-2"></i></div></div>

        </div>

          <tbody id="auditRequestBody"></tbody>
        </table>

  </div>`;

    activeType = "";

    $("#auditStatusFilter").value = "";

  $("#auditRequestBody").addEventListener("click", e => {

    if (!btn) return;
    const req = State.productStockRequest.find(r => r.id === e.target.closest("tr").dataset.id);

    if (btn.dataset.act === "detail") {
      Drawer.open({ title: "申请单详情", body: el(`<div class="ops-detail"><div class="kv"><div class="k">申请单ID</div><div class="v">${escapeHtml(req.id)}</div><div class="k">申请标题</div><div class="v">${escapeHtml(req.title || "—")}</div><div class="k">申请类型</div><div class="v">${escapeHtml(req.type || "—")}</div><div class="k">审核状态</div><div class="v">${stockRequestStatusTag(req.status)}</div><div class="k">申请人</div><div class="v">${escapeHtml(req.applicant || "—")}</div><div class="k">申请时间</div><div class="v">${escapeHtml(req.createdAt || "—")}</div><div class="k">调整内容</div><div class="v">${escapeHtml(auditRequestDetail(req))}</div></div></div>`) });
      return;
    }
    if (req.status !== "pending") return;
    if (btn.dataset.act === "approve") {
      if (!applyProductAudit(req)) return;
      req.status = "approved";
      req.reviewer = "运营管理员";
      req.reviewRemark = "审核通过";
      req.updatedAt = nowStr();
      persist("productStockRequest");
      setView("productAudit");
      toast("已通过审核", "success");
    }
    if (btn.dataset.act === "reject") {
      req.status = "rejected";
      req.reviewer = "运营管理员";
      req.reviewRemark = "审核驳回";
      req.updatedAt = nowStr();
      persist("productStockRequest");
      setView("productAudit");
      toast("已驳回审核", "success");
    }
  });
  renderRequestRows();
  if (window.lucide) window.lucide.createIcons();
}

function openProductAuditForm(done) {
  const form = el(`<div class="form commerce-form" data-form-title="新建审核"></div>`);
  const titleInput = el(`<input class="input" name="title" placeholder="如：全国统一商城申请独占入门套餐库存" />`);

  const applicantInput = el(`<input class="input" name="applicant" value="门户运营" />`);
  const productBox = el(`<div class="full" style="grid-column:1/-1;"></div>`);

  };

  $("#searchInput").addEventListener("input", renderRows);
  $("#filterStatus").addEventListener("change", renderRows);
  $("#productQuery").addEventListener("click", renderRows);
  $("#productReset").addEventListener("click", () => {
    $("#searchInput").value = "";
    $("#filterStatus").value = "";
    renderRows();
  });
  $("#productRefresh").addEventListener("click", renderRows);
  $("#btnProductExport").addEventListener("click", () => toast("已生成销售品导出任务", "success"));
  document.querySelectorAll("[data-product-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeProductTab = btn.dataset.productTab || "compute";
      State.filters.productResourceTab = activeProductTab;
      selected.clear();
      document.querySelectorAll("[data-product-tab]").forEach(b => b.classList.toggle("active", b.dataset.productTab === activeProductTab));
      renderRows();
    });
  });
  $("#btnCreate").addEventListener("click", () => openProductForm(null, activeProductTab));
  $("#btnBatch")?.addEventListener("click", () => openBatchCreate());
  $("#selAll").addEventListener("change", (e) => {
    const rows = State.product.slice().filter(productInActiveTab);
    const kw = $("#searchInput").value.toLowerCase();
    const st = $("#filterStatus").value;
    const filtered = rows.filter(r => (!kw || (r.name + " " + r.code).toLowerCase().includes(kw)) && (!st || r.status === st));
    if (e.target.checked) filtered.forEach(r => selected.add(r.id));
    else filtered.forEach(r => selected.delete(r.id));
    renderRows();
  });
  $("#btnClearSel").addEventListener("click", () => { selected.clear(); renderRows(); });
  $("#batchBar").addEventListener("click", (e) => {
    const toggleBtn = e.target.closest("#batchBindToggle");
    const menu = $("#batchBindMenu");
    if (toggleBtn) {
      if (!selected.size) { toast("请先勾选销售品", "error"); return; }
      menu.style.display = menu.style.display === "none" ? "block" : "none";
      return;
    }
    const menuItem = e.target.closest(".batch-menu-item[data-bact]");
    const btn = e.target.closest("button[data-bact]");
    if (!menuItem && !btn) return;
    if (!selected.size) { toast("请先勾选销售品", "error"); return; }
    if (menu) menu.style.display = "none";
    const act = (menuItem || btn).dataset.bact;
    if (act === "activate" || act === "deactivate") {
      const status = act === "activate" ? "active" : "inactive";
      State.product.forEach(p => { if (selected.has(p.id)) { p.status = status; p.updatedAt = nowStr(); } });
      persist("product");
      renderRows();
      toast(act === "activate" ? "已批量上架" : "已批量下架", "success");
      return;
    }
    openBatchBindModal(act, Array.from(selected), () => { renderRows(); });
  });
  // 点击外部关闭批量绑定菜单
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".batch-bind-wrap")) {
      const menu = $("#batchBindMenu"); if (menu) menu.style.display = "none";
    }
  });

  $("#tableBody").addEventListener("click", (e) => {
    const cb = e.target.closest("input.rowSel");
    if (cb) {
      const id = cb.dataset.id;
      if (cb.checked) selected.add(id); else selected.delete(id);
      updateBatchBar();
      const allIds = State.product.map(r => r.id);
      const selAll = $("#selAll");
      if (selAll) { selAll.checked = allIds.every(id => selected.has(id)); selAll.indeterminate = !selAll.checked && allIds.some(id => selected.has(id)); }
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = e.target.closest("tr").dataset.id;
    const item = State.product.find(x => x.id === id);
    if (!item) return;
    if (btn.dataset.act === "view") openProductDetail(item);
    if (btn.dataset.act === "mark") openProductPushMarkForm(item, renderRows);
    if (btn.dataset.act === "edit" && item.status === "inactive") openProductForm(item);
    if (btn.dataset.act === "del" && item.status === "inactive") {
      if (!confirm("确认删除？")) return;
      State.product = State.product.filter(x => x.id !== id);
      persist("product");
      renderRows();
      toast("已删除", "success");
    }
  });
  renderRows();
}

function openProductPushMarkForm(item, onDone) {
  const form = el(`<div class="form commerce-form" data-form-title="销售品标注">
    ${fieldHtml("销售品名称", `<div class="input" style="display:flex;align-items:center;background:#f8fafc;color:#334155;">${escapeHtml(item.name || "—")}</div>`)}
    ${fieldHtml("销售品编码", `<div class="input" style="display:flex;align-items:center;background:#f8fafc;color:#64748b;font-family:ui-monospace,Menlo,monospace;">${escapeHtml(item.code || "—")}</div>`)}
    ${fieldHtml("销售品标注", `<input class="input" name="pushMark" value="${escapeHtml(item.pushMark || "")}" placeholder="如：推送CRM、外部系统A、重点同步" />`, { full: true })}
    <div class="full" style="grid-column:1/-1;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.7;">
      标注用于推送给其他系统时识别销售品，不参与销售品规格、价格、库存等基础数据创建。
    </div>
  </div>`);
  Modal.open({
    title: "销售品标注",
    body: form,
    confirmText: "保存标注",
    onConfirm: () => {
      item.pushMark = form.querySelector("[name=pushMark]").value.trim();
      item.updatedBy = getCurrentOperator();
      item.updatedAt = nowStr();
      persist("product");
      toast(item.pushMark ? "销售品标注已保存" : "销售品标注已清空", "success");
      if (typeof onDone === "function") onDone();
    }
  });
}

// ===== 销售品表单 =====
function cloudDiskSpecCardDetail(d) {
  const provider = State.provider.find(p => p.id === d.providerId);
  const providerName = provider ? provider.name : getProviderName(d.providerId);
  const region = provider ? provider.region : (d.region || "未设置地域");
  const specText = `${d.fileSystemType ? String(d.fileSystemType).replace(/^efs$/i, "Efs") : "Efs"}｜${String(d.encryptType) === "1" ? "加密" : "不加密"}`;
  const modes = Array.isArray(d.chargeModes) ? d.chargeModes : [];
  const priceParts = (cityOrEco) => {
    const monthly = Number(d[cityOrEco === "city" ? "monthlyCity" : "monthlyEco"]) || 0;
    const onDemand = Number(d[cityOrEco === "city" ? "onDemandCity" : "onDemandEco"]) || 0;
    const parts = [];
    if (modes.includes("monthly")) parts.push(`包月 ¥${monthly.toFixed(2)} ${specPriceUnit("cloudDisk", "monthly")}`);
    if (modes.includes("onDemand")) parts.push(`按量 ¥${onDemand.toFixed(4)} ${specPriceUnit("cloudDisk", "onDemand")}`);
    return parts.length ? parts : ["未配置"];
  };
  const priceTitle = (cityOrEco) => priceParts(cityOrEco).join(" / ");
  const priceHtml = (cityOrEco) => priceParts(cityOrEco).map(part => `<span>${escapeHtml(part)}</span>`).join("");
  const field = (label, value, cls = "") => `<div class="compute-field ${cls}"><div class="compute-label">${label}</div><div class="compute-value ${value === "未配置" ? "muted" : ""}" title="${escapeHtml(String(value))}">${escapeHtml(String(value))}</div></div>`;
  return {
    providerName,
    region,
    fields: `
      ${field("规格", specText, "full")}
      <div class="compute-field"><div class="compute-label">生态结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("eco"))}">${priceHtml("eco")}</div></div>
      <div class="compute-field"><div class="compute-label">地市结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("city"))}">${priceHtml("city")}</div></div>
    `
  };
}

function openProductForm(item, resourceTab = "compute") {
  const isEdit = !!item;
  const data = item ? JSON.parse(JSON.stringify(item)) : {
    id: uid("p_"), code: genSpecCode("product"), name: "", templateId: null,
    productType: resourceTab === "storage" ? "cloudDisk" : "computeOnly",
    computeId: null, computeIds: [], systemDiskId: null, dataDiskIds: [], bandwidthId: null,
    basePrice: 0, currency: "CNY", status: "active",
    stock: 100, inventorySource: "manual", sellOnDemand: 0, sellMonthly: 0,
    orderForm: "付费", estimatedProvisionDuration: "",
    portalSiteIds: ["mall_main"],
    description: "", tags: [], pushMark: "",
    effectiveAt: new Date().toISOString().slice(0, 10), expireAt: "",
    updatedAt: nowStr(),
  };
  data.productType = isEdit ? (data.productType || "computeOnly") : (resourceTab === "storage" ? "cloudDisk" : "computeOnly");

  const form = el(`<div class="form commerce-form" data-form-title="${isEdit ? "编辑销售品" : "新建销售品"}"></div>`);
  form.appendChild(fieldWrap("销售品名称", el(`<input class="input" name="name" value="${escapeHtml(data.name)}" />`), { required: true }));

  // 绑定产品名称
  const productOptionText = (tpl) => {
    const desc = (tpl.description || "暂无产品描述").replace(/\s+/g, " ").trim();
    return `${tpl.name} ｜ ${tpl.orderForm || "付费"} ｜ ${desc}`;
  };
  const templateOpts = State.productTemplate.map(t => `<option value="${t.id}" ${data.templateId === t.id ? "selected" : ""}>${escapeHtml(productOptionText(t))}</option>`).join("");
  const templateSelect = el(`<select class="select" name="templateId"><option value="">-- 不绑定 --</option>${templateOpts}</select>`);
  form.appendChild(fieldWrap("绑定产品名称", templateSelect));
  const templatePreview = el(`<div class="full" style="grid-column:1/-1;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;color:#64748b;font-size:12px;line-height:1.7;">请选择绑定产品名称以带出产品信息</div>`);
  form.appendChild(templatePreview);
  function refreshTemplatePreview(fillFields = false) {
    const tpl = State.productTemplate.find(t => t.id === templateSelect.value);
    if (!tpl) {
      templatePreview.style.display = "none";
      return;
    }
    templatePreview.style.display = "";
    templatePreview.innerHTML = `<strong style="color:#334155;">${escapeHtml(tpl.name)}</strong><span style="margin-left:8px;" class="tag tag-primary">${escapeHtml(tpl.orderForm || "付费")}</span><div style="margin-top:4px;">${escapeHtml(tpl.description || "暂无产品描述")}</div>`;
    if (fillFields) {
      form.querySelector("[name=name]").value = tpl.name;
      const descEl = form.querySelector("[name=description]");
      if (descEl) descEl.value = tpl.description || "";
    }
  }
  templateSelect.addEventListener("change", () => refreshTemplatePreview(true));
  refreshTemplatePreview(false);

  // 上架类型由当前页签决定：智算资源=单独上架云服务器，存储资源=单独上架云硬盘
  const typeSelect = { value: data.productType, addEventListener: () => {} };

  // 规格选择区域分隔标题（根据产品类型动态更新文字）
  const specHeader = el(`<div class="full" style="grid-column:1/-1;padding:${data.productType === "cloudDisk" ? "6px 0 8px" : "12px 0"};border-top:1px solid #eee;margin-top:${data.productType === "cloudDisk" ? "2px" : "8px"};"><div style="font-weight:600;margin-bottom:2px;" id="specSectionTitle">组合规格</div></div>`);
  form.appendChild(specHeader);

  // ---- 创建各规格选择器（根据产品类型动态显示/隐藏） ----
  const specWrappers = {};

  // 云服务器
  {
    const computeBox = el(`<div class="commerce-spec-picker"></div>`);
    const toolbar = el(`<div class="commerce-spec-picker-head">
      <div class="search"><i data-lucide="search"></i><input class="input compute-search" placeholder="搜索规格名称 / GPU型号 / 服务商" /></div>
      <span class="tag tag-primary compute-count">共 ${State.compute.length} 个</span>
    </div>`);
    const listBox = el(`<div class="commerce-spec-grid"></div>`);
    computeBox.appendChild(toolbar);
    computeBox.appendChild(listBox);
    function paintComputeOptions() {
      const kw = (toolbar.querySelector(".compute-search").value || "").trim().toLowerCase();
      let rows = State.compute.slice();
      if (kw) {
        rows = rows.filter(c => [c.name, c.code, c.gpuModel, c.computeForm, getProviderName(c.providerId)].join(" ").toLowerCase().includes(kw));
      }
      const selectedSet = new Set(data.computeIds || []);
      toolbar.querySelector(".compute-count").textContent = `已选 ${selectedSet.size} / 共 ${rows.length} 个`;
      listBox.innerHTML = rows.length ? rows.map(c => {
        const selected = selectedSet.has(c.id);
        const provider = State.provider.find(p => p.id === c.providerId);
        const providerName = provider ? provider.name : "未绑定服务商";
        const region = provider ? provider.region : (c.poolRegion || "未设置地域");
        const specText = `CPU：${Number(c.vcpu) || 0}核｜ 内存：${Number(c.memoryGB) || 0}GB`;
        const gpuText = c.gpuCount > 0 ? `${escapeHtml(c.gpuModel || "GPU")} * ${c.gpuCount}（${c.gpuMemoryGB || 0}GB）` : "无 GPU";
        const priceParts = (cityOrEco) => {
          const monthly = Number(c[cityOrEco === "city" ? "monthlyCity" : "monthlyEco"]) || 0;
          const onDemand = Number(c[cityOrEco === "city" ? "onDemandCity" : "onDemandEco"]) || 0;
          const modes = Array.isArray(c.chargeModes) ? c.chargeModes : [];
          const parts = [];
          if (modes.includes("monthly")) parts.push(`包月 ¥${monthly.toFixed(2)} ${specPriceUnit("compute", "monthly")}`);
          if (modes.includes("onDemand")) parts.push(`按量 ¥${onDemand.toFixed(2)} ${specPriceUnit("compute", "onDemand")}`);
          return parts.length ? parts : ["未配置"];
        };
        const priceTitle = (cityOrEco) => priceParts(cityOrEco).join(" / ");
        const priceHtml = (cityOrEco) => priceParts(cityOrEco).map(part => `<span>${escapeHtml(part)}</span>`).join("");
        const field = (label, value, cls = "") => `<div class="compute-field ${cls}"><div class="compute-label">${label}</div><div class="compute-value ${value === "未配置" || value === "无 GPU" ? "muted" : ""}" title="${escapeHtml(String(value))}">${escapeHtml(String(value))}</div></div>`;
        return `<div class="commerce-spec-card commerce-compute-card ${selected ? "selected" : ""}" data-id="${c.id}" data-kind="compute">
          <div class="spec-icon"><i data-lucide="cpu"></i></div>
          <div class="spec-main">
            <div class="spec-title" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
            <div class="spec-code" title="${escapeHtml(`${providerName} * ${region}`)}">${escapeHtml(`${providerName} * ${region}`)}</div>
            <div class="compute-field-grid">
              ${field("规格", specText)}
              ${field("GPU", gpuText)}
              ${field("处理器", c.cpuModel || "未配置", "full")}
              <div class="compute-field"><div class="compute-label">生态结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("eco"))}">${priceHtml("eco")}</div></div>
              <div class="compute-field"><div class="compute-label">地市结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("city"))}">${priceHtml("city")}</div></div>
            </div>
          </div>
          <div class="spec-check"><i data-lucide="check-circle-2"></i></div>
        </div>`;
      }).join("") : `<div class="commerce-spec-empty">未找到匹配的云服务器规格</div>`;
      if (window.lucide) window.lucide.createIcons();
    }
    toolbar.querySelector(".compute-search").addEventListener("input", paintComputeOptions);
    listBox.addEventListener("click", e => {
      const card = e.target.closest("[data-id]");
      if (!card) return;
      const set = new Set(data.computeIds || []);
      if (set.has(card.dataset.id)) set.delete(card.dataset.id);
      else set.add(card.dataset.id);
      data.computeIds = Array.from(set);
      data.computeId = data.computeIds[0] || null;
      paintComputeOptions();
      refreshSalePrice();
    });
    paintComputeOptions();
    specWrappers.compute = fieldWrap("云服务器规格", computeBox, { full: true });
    form.appendChild(specWrappers.compute);
  }

  // 系统盘
  {
    const sysBox = el(`<div class="bundle-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));"></div>`);
    State.systemDisk.forEach(s => {
      const meta = `${s.capacityGB}GB · ${escapeHtml(s.diskType)} · ${escapeHtml(s.os || "")}${s.osVersion ? " " + escapeHtml(s.osVersion) : ""}`;
      const card = el(`<div class="bundle-card ${data.systemDiskId === s.id ? "selected" : ""}" data-id="${s.id}" data-kind="systemDisk">
        <i data-lucide="hard-drive"></i><div style="flex:1;min-width:0;"><strong>${escapeHtml(s.name)}</strong><div class="meta">${meta}</div></div></div>`);
      card.addEventListener("click", () => {
        sysBox.querySelectorAll(".bundle-card").forEach(d => d.classList.remove("selected"));
        card.classList.add("selected");
        data.systemDiskId = s.id;
        refreshSalePrice();
      });
      sysBox.appendChild(card);
    });
    specWrappers.systemDisk = fieldWrap("系统盘规格", sysBox, { full: true });
    form.appendChild(specWrappers.systemDisk);
  }

  // 数据盘多选
  {
    const dataBox = el(`<div class="bundle-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));"></div>`);
    State.dataDisk.forEach(d => {
      const selected = (data.dataDiskIds || []).includes(d.id);
      const meta = `${d.capacityGB}GB · ${escapeHtml(d.diskType)} · IOPS ${d.iops || 0}`;
      const card = el(`<div class="bundle-card ${selected ? "selected" : ""}" data-id="${d.id}" data-kind="dataDisk">
        <i data-lucide="database"></i><div style="flex:1;min-width:0;"><strong>${escapeHtml(d.name)}</strong><div class="meta">${meta}</div></div></div>`);
      card.addEventListener("click", () => {
        card.classList.toggle("selected");
        const ids = new Set(data.dataDiskIds || []);
        if (ids.has(d.id)) ids.delete(d.id); else ids.add(d.id);
        data.dataDiskIds = Array.from(ids);
        refreshSalePrice();
      });
      dataBox.appendChild(card);
    });
    specWrappers.dataDisk = fieldWrap("数据盘规格（可多选）", dataBox, { full: true });
    form.appendChild(specWrappers.dataDisk);
  }

  // 云硬盘多选
  {
    const cloudDiskBox = el(`<div class="commerce-spec-grid"></div>`);
    State.cloudDisk.forEach(d => {
      const selected = (data.cloudDiskIds || []).includes(d.id);
      const detail = cloudDiskSpecCardDetail(d);
      const card = el(`<div class="commerce-spec-card commerce-compute-card ${selected ? "selected" : ""}" data-id="${d.id}" data-kind="cloudDisk">
        <div class="spec-icon"><i data-lucide="hard-drive"></i></div>
        <div class="spec-main">
          <div class="spec-title" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</div>
          <div class="spec-code" title="${escapeHtml(`${detail.providerName} * ${detail.region}`)}">${escapeHtml(`${detail.providerName} * ${detail.region}`)}</div>
          <div class="compute-field-grid">${detail.fields}</div>
        </div>
        <div class="spec-check"><i data-lucide="check-circle-2"></i></div>
      </div>`);
      card.addEventListener("click", () => {
        card.classList.toggle("selected");
        const ids = new Set(data.cloudDiskIds || []);
        if (ids.has(d.id)) ids.delete(d.id); else ids.add(d.id);
        data.cloudDiskIds = Array.from(ids);
        refreshSalePrice();
      });
      cloudDiskBox.appendChild(card);
    });
    specWrappers.cloudDisk = fieldWrap("", cloudDiskBox, { full: true });
    form.appendChild(specWrappers.cloudDisk);
  }

  // 带宽
  {
    const bwBox = el(`<div class="bundle-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));"></div>`);
    State.bandwidth.forEach(b => {
      const meta = `${b.peakMbps}Mbps · ${escapeHtml(b.networkType || "")}${b.tierEnabled ? " · 阶梯定价" : ""}`;
      const card = el(`<div class="bundle-card ${data.bandwidthId === b.id ? "selected" : ""}" data-id="${b.id}" data-kind="bandwidth">
        <i data-lucide="activity"></i><div style="flex:1;min-width:0;"><strong>${escapeHtml(b.name)}</strong><div class="meta">${meta}</div></div></div>`);
      card.addEventListener("click", () => {
        bwBox.querySelectorAll(".bundle-card").forEach(d => d.classList.remove("selected"));
        card.classList.add("selected");
        data.bandwidthId = b.id;
        refreshSalePrice();
      });
      bwBox.appendChild(card);
    });
    specWrappers.bandwidth = fieldWrap("带宽规格", bwBox, { full: true });
    form.appendChild(specWrappers.bandwidth);
  }

  // 根据产品类型切换显示/隐藏规格选择器
  const typeSpecMap = {
    combo: ["compute", "systemDisk", "dataDisk", "cloudDisk", "bandwidth"],
    computeOnly: ["compute"],
    cloudDisk: ["cloudDisk"],
    storage: ["cloudDisk"],
  };
  const typeTitleMap = { combo: "组合规格（含具体实例规格信息）", computeOnly: "云服务器规格", cloudDisk: "存储规格", storage: "存储规格" };
  function refreshSpecSection() {
    data.productType = typeSelect.value;
    const visible = typeSpecMap[data.productType] || typeSpecMap.combo;
    Object.keys(specWrappers).forEach(key => {
      specWrappers[key].style.display = visible.includes(key) ? "flex" : "none";
    });
    // 更新区域标题
    const titleEl = specHeader.querySelector("#specSectionTitle");
    if (titleEl) titleEl.textContent = typeTitleMap[data.productType] || typeTitleMap.combo;
    // 切换类型时清空不属于当前类型的规格选择
    if (!visible.includes("compute")) { data.computeId = null; data.computeIds = []; }
    if (!visible.includes("systemDisk")) data.systemDiskId = null;
    if (!visible.includes("dataDisk")) data.dataDiskIds = [];
    if (!visible.includes("cloudDisk")) data.cloudDiskIds = [];
    if (!visible.includes("bandwidth")) data.bandwidthId = null;
    if (window.lucide) window.lucide.createIcons();
  }
  // 类型变更时：先切换显示，再刷新价格和摘要（这两个函数在下方定义，需在 change 回调中调用以避免 TDZ）
  typeSelect.addEventListener("change", () => {
    refreshSpecSection();
    refreshSalePrice();
    refreshStockField();
  });
  refreshSpecSection();

  // 销售配置：库存、销售价、门户站点（根据规格 chargeModes 联动显示销售价输入）
  form.appendChild(el(`<div class="full" style="grid-column:1/-1;padding:12px 0;border-top:1px solid #eee;margin-top:8px;"><div style="font-weight:600;margin-bottom:10px;">销售配置</div></div>`));
  const inventorySourceSelect = el(["cloudDisk", "storage"].includes(data.productType)
    ? `<select class="select" name="inventorySource"><option value="manual" selected>手动维护</option></select>`
    : `<select class="select" name="inventorySource"><option value="manual" ${(data.inventorySource || "manual") === "manual" ? "selected" : ""}>手动维护</option><option value="device" ${(data.inventorySource || "manual") === "device" ? "selected" : ""}>设备编号获取</option><option value="api" ${(data.inventorySource || "manual") === "api" ? "selected" : ""}>接口同步</option></select>`);
  form.appendChild(fieldWrap("库存来源", inventorySourceSelect, { required: true, hint: ["cloudDisk", "storage"].includes(data.productType) ? "存储资源仅支持手动维护库存" : "不支持混合维护；设备编号获取在设备编号配置中新增编号，接口同步由资源池接口返回" }));
  const stockField = fieldWrap("初始库存", el(`<div name="stockWrap" style="display:flex;align-items:center;gap:8px;"></div>`), { required: true });
  form.appendChild(stockField);
  const stockWrap = stockField.querySelector("[name=stockWrap]");
  function refreshStockField() {
    const source = inventorySourceSelect.value || "manual";
    if (source === "api") {
      stockWrap.innerHTML = `<span class="tag tag-primary" style="font-size:13px;padding:4px 12px;">由接口同步</span><span style="color:#94a3b8;font-size:12px;">保存后在设备编号配置中查看同步结果</span>`;
    } else if (source === "device") {
      stockWrap.innerHTML = `<span class="tag tag-success" style="font-size:13px;padding:4px 12px;">设备编号获取</span><span style="color:#94a3b8;font-size:12px;">上架库存默认为 0，保存后在设备编号配置中维护编号</span>`;
    } else {
      stockWrap.innerHTML = `<input class="input" type="number" name="stock" value="${Number(data.stock) >= 0 ? data.stock : 100}" min="0" />`;
    }
  }
  refreshStockField();
  inventorySourceSelect.addEventListener("change", refreshStockField);
  form.appendChild(fieldWrap("预计开通时长", el(`<input class="input" name="estimatedProvisionDuration" value="${escapeHtml(data.estimatedProvisionDuration || "")}" placeholder="如：30分钟、2小时、1个工作日" />`), { hint: "前台展示给客户的预计交付时间" }));
  const priceBox = el(`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;"></div>`);
  const productPriceKind = () => ["cloudDisk", "storage"].includes(data.productType) ? "storage" : "compute";
  form.appendChild(fieldWrap("销售价", priceBox, { full: true, required: true, hint: "按所选规格的计费模式联动显示销售价单位" }));
  const salePriceRow = (label, name, value, unit) => `<div style="display:grid;grid-template-columns:64px minmax(0,1fr) 86px;align-items:center;gap:8px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;min-width:0;">
    <span class="tag tag-muted" style="justify-content:center;height:22px;">${label}</span>
    <div style="position:relative;">
      <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#64748b;font-weight:700;">¥</span>
      <input class="input" type="number" step="0.01" name="${name}" value="${Number(value || 0).toFixed(2)}" placeholder="0.00" style="width:100%;padding-left:28px;" />
    </div>
    <span style="color:#64748b;font-size:12px;white-space:nowrap;">${unit}</span>
  </div>`;
  function refreshSalePrice() {
    const modes = getProductChargeModes(data);
    priceBox.innerHTML = "";
    if (modes.length === 0) {
      priceBox.appendChild(el(`<div class="hint" style="color:var(--danger);">已选规格的计费模式无交集，请重新选择</div>`));
      return;
    }
    if (modes.includes("onDemand")) {
      priceBox.appendChild(el(salePriceRow("按量", "sellOnDemand", data.sellOnDemand, specPriceUnit(productPriceKind(), "onDemand"))));
    }
    if (modes.includes("monthly")) {
      priceBox.appendChild(el(salePriceRow("包周期", "sellMonthly", data.sellMonthly, specPriceUnit(productPriceKind(), "monthly"))));
    }
  }
  refreshSalePrice();

  const portalPicker = renderPortalPicker(data.portalSiteIds);
  form.appendChild(fieldWrap("推送门户站点", portalPicker, { full: true, required: true, hint: "支持按省 / 市 / 区县筛选门户站点，至少选择 1 个商城子门户" }));

  Modal.open({
    title: (isEdit ? "编辑" : "新建") + "销售品",
    body: form,
    confirmText: isEdit ? "保存" : "创建",
    wide: true,
    onConfirm: () => {
      const payload = {...data};
      payload.productType = data.productType || "computeOnly";
      payload.computeIds = data.computeIds || [];
      payload.computeId = payload.computeIds[0] || null;
      payload.name = form.querySelector("[name=name]").value.trim();
      payload.templateId = form.querySelector("[name=templateId]").value || null;
      const selectedTemplate = State.productTemplate.find(t => t.id === payload.templateId);
      payload.orderForm = selectedTemplate ? (selectedTemplate.orderForm || "付费") : (data.orderForm || "付费");
      payload.inventorySource = form.querySelector("[name=inventorySource]")?.value || "manual";
      payload.stock = payload.inventorySource === "api" ? Math.max(0, Number(data.stock) || 100) : payload.inventorySource === "device" ? 0 : Math.max(0, Number(form.querySelector("[name=stock]")?.value) || 0);
      const sellOnDemandInput = form.querySelector("[name=sellOnDemand]");
      const sellMonthlyInput = form.querySelector("[name=sellMonthly]");
      payload.sellOnDemand = sellOnDemandInput ? Number(sellOnDemandInput.value) || 0 : (data.sellOnDemand || 0);
      payload.sellMonthly = sellMonthlyInput ? Number(sellMonthlyInput.value) || 0 : (data.sellMonthly || 0);
      payload.basePrice = payload.sellMonthly || payload.sellOnDemand;
      payload.portalSiteIds = Array.from(form.querySelectorAll("[name=portalSite]:checked")).map(i => i.value);
      if (!isEdit) payload.status = "active";
      payload.estimatedProvisionDuration = form.querySelector("[name=estimatedProvisionDuration]").value.trim();
      payload.effectiveAt = data.effectiveAt || new Date().toISOString().slice(0, 10);
      payload.expireAt = data.expireAt || "";
      payload.description = data.description || "";

      // 继承模板
      if (payload.templateId) {
        const t = State.productTemplate.find(x => x.id === payload.templateId);
        if (t) {
          if (!payload.description) payload.description = t.description;
          payload.tags = [...(t.tags || [])];
        }
      }

      if (!payload.name) { toast("请输入销售品名称", "error"); return false; }
      if ((!payload.computeIds || payload.computeIds.length === 0) && !payload.systemDiskId && !payload.bandwidthId && (!payload.dataDiskIds || payload.dataDiskIds.length === 0) && (!payload.cloudDiskIds || payload.cloudDiskIds.length === 0)) {
        toast("请至少选择一项规格组合", "error"); return false;
      }
      if (!payload.portalSiteIds.length) { toast("请至少选择一个推送门户站点", "error"); return false; }
      const modes = getProductChargeModes(payload);
      if (modes.length === 0) { toast("已选规格的计费模式无交集，请调整", "error"); return false; }
      if (modes.includes("onDemand") && !(payload.sellOnDemand > 0)) { toast("请填写按量销售价", "error"); return false; }
      if (modes.includes("monthly") && !(payload.sellMonthly > 0)) { toast("请填写包周期销售价", "error"); return false; }
      payload.name = buildProductRuleName(payload);
      payload.updatedAt = nowStr();
      if (isEdit) {
        Object.assign(item, payload);
        syncProductDevicePlaceholders(item);
      } else {
        State.product.unshift(payload);
        syncProductDevicePlaceholders(payload);
      }
      persist("product");
      persist("deviceInventory");
      setView("product");
      toast(isEdit ? "已保存" : "已创建", "success");
    }
  });
  if (window.lucide) window.lucide.createIcons();
}

  publishBox.appendChild(el(`
    <div class="panel-header" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom-color:#dbeafe;">
      <i data-lucide="send"></i>

  sharedConfigBox.appendChild(el(`
    <div class="panel-header" style="display:flex;align-items:center;gap:8px;padding:8px 12px;">

  const sysOptsHtml = `<option value="">不绑定</option>` + State.systemDisk.map(s => `<option value="${s.id}">${escapeHtml(s.name)}（${s.capacityGB}GB · ${escapeHtml(s.os || "")}）</option>`).join("");
  const bwOptsHtml = `<option value="">不绑定</option>` + State.bandwidth.map(b => `<option value="${b.id}">${escapeHtml(b.name)}（${b.peakMbps}Mbps）</option>`).join("");
  const sysCtl = el(`<select class="select shared-sys">${sysOptsHtml}</select>`);

  const dataField = el(`<div style="display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;padding:6px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;"></div>`);
  State.dataDisk.forEach(d => {
    const lab = el(`<label class="checkbox" style="padding:4px 10px;border:1px solid #eee;background:#fff;border-radius:4px;font-size:12px;display:inline-flex;align-items:center;gap:6px;">
      <input type="checkbox" value="${d.id}" />
      <span>${escapeHtml(d.name)} · ${d.capacityGB}GB · ${escapeHtml(d.diskType || "")}</span>
    </label>`);
    lab.querySelector("input").addEventListener("change", (e) => {
      const set = new Set(shared.dataDiskIds);
      if (e.target.checked) set.add(d.id); else set.delete(d.id);
      shared.dataDiskIds = Array.from(set);
      paintRows();
    });
    dataField.appendChild(lab);
  });
  sharedConfigBody.appendChild(fieldWrap("数据盘（可多选）", dataField, { full: true }));

  // 云硬盘（可多选）
  const cloudDiskField = el(`<div style="display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;padding:6px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;"></div>`);
  State.cloudDisk.forEach(d => {
    const lab = el(`<label class="checkbox" style="padding:4px 10px;border:1px solid #eee;background:#fff;border-radius:4px;font-size:12px;display:inline-flex;align-items:center;gap:6px;">
      <input type="checkbox" value="${d.id}" />
      <span>${escapeHtml(d.name)} · ${d.capacityGB}GB · ${escapeHtml(d.diskType || "")}</span>
    </label>`);
    lab.querySelector("input").addEventListener("change", (e) => {
      const set = new Set(shared.cloudDiskIds);
      if (e.target.checked) set.add(d.id); else set.delete(d.id);
      shared.cloudDiskIds = Array.from(set);
      paintRows();
    });
    cloudDiskField.appendChild(lab);
  });
  sharedConfigBody.appendChild(fieldWrap("云硬盘（可多选）", cloudDiskField, { full: true }));

  const portalPicker = renderPortalPicker(shared.portalSiteIds);
  publishBody.appendChild(fieldWrap("门户站点", portalPicker, { full: true, required: true, hint: "支持按省 / 市 / 区县筛选；所有销售品共用本次选择" }));

  sysCtl.addEventListener("change", () => { shared.systemDiskId = sysCtl.value; paintRows(); });
  bwCtl.addEventListener("change", () => { shared.bandwidthId = bwCtl.value; paintRows(); });

  // ===== 销售品明细 =====
  const rowsBox = el('<div class="panel" style="margin-top:10px;"></div>');
  rowsBox.appendChild(el(`
    <div class="panel-header" style="display:flex;align-items:center;gap:8px;padding:8px 12px;">
      <i data-lucide="list"></i>
      <div class="panel-title" style="flex:1;" id="batchRowsTitle">销售品明细（按云服务器规格逐条维护库存与标准售价）</div>
      <span class="tag tag-muted rows-count">0 条</span>
    </div>`));
  const rowsBody = el('<div class="rows-body"></div>');
  rowsBox.appendChild(rowsBody);

  const rowState = new Map();
  const selectedCompute = new Set();
  const batchType = () => batchTypeCtl.value || "computeOnly";
  const batchInventorySource = () => batchType() === "cloudDisk" ? "manual" : (batchInventorySourceCtl.value || "manual");
  const batchPool = () => batchType() === "cloudDisk" ? State.cloudDisk : State.compute;
  const batchSpec = (id) => batchPool().find(x => x.id === id);
  const batchIcon = () => batchType() === "cloudDisk" ? "hard-drive" : "cpu";
  const batchTitle = () => batchType() === "cloudDisk" ? "云硬盘规格池" : "云服务器规格池";
  const batchRowsTitle = () => batchType() === "cloudDisk" ? "销售品明细（按云硬盘规格逐条维护标准售价）" : "销售品明细（按云服务器规格逐条维护库存与标准售价）";

  function chargeModesForRow(row) {
    const specs = [];
    const c = batchSpec(row.specId || row.computeId); if (c) specs.push(c);
    if (batchType() === "combo") {
      if (shared.systemDiskId) { const s = State.systemDisk.find(x => x.id === shared.systemDiskId); if (s) specs.push(s); }
      (shared.dataDiskIds || []).forEach(id => { const d = State.dataDisk.find(x => x.id === id); if (d) specs.push(d); });
      if (shared.bandwidthId) { const b = State.bandwidth.find(x => x.id === shared.bandwidthId); if (b) specs.push(b); }
      (shared.cloudDiskIds || []).forEach(id => { const cd = State.cloudDisk.find(x => x.id === id); if (cd) specs.push(cd); });
    }
    if (!specs.length) return ["onDemand", "monthly"];
    return ["onDemand", "monthly"].filter(m => specs.every(s => Array.isArray(s.chargeModes) && s.chargeModes.includes(m)));
  }

  function defaultRow(c) {
    return { specId: c.id, computeId: c.id, productName: "", name: "", stock: 100, estimatedProvisionDuration: "", sellOnDemand: 0, sellMonthly: 0 };
  }

  function computeMeta(c) {
    if (batchType() === "cloudDisk") return `${c.capacityGB || 0}GB · ${escapeHtml(c.diskType || "")} · ${escapeHtml(getProviderName(c.providerId))}`;
    const gpu = c.gpuCount > 0 ? ` · ${escapeHtml(c.gpuModel || "GPU")}×${c.gpuCount}` : "";
    return `${c.vcpu}vCPU / ${c.memoryGB}GB${gpu}`;
  }
  function batchComputeCardFields(c) {
    const provider = State.provider.find(p => p.id === c.providerId);
    const providerName = provider ? provider.name : getProviderName(c.providerId);
    const region = provider ? provider.region : (c.poolRegion || "未设置地域");
    const specText = `CPU：${Number(c.vcpu) || 0}核｜ 内存：${Number(c.memoryGB) || 0}GB`;
    const gpuText = c.gpuCount > 0 ? `${escapeHtml(c.gpuModel || "GPU")} * ${c.gpuCount}（${c.gpuMemoryGB || 0}GB）` : "无 GPU";
    const modes = Array.isArray(c.chargeModes) ? c.chargeModes : [];
    const priceParts = (cityOrEco) => {
      const monthly = Number(c[cityOrEco === "city" ? "monthlyCity" : "monthlyEco"]) || 0;
      const onDemand = Number(c[cityOrEco === "city" ? "onDemandCity" : "onDemandEco"]) || 0;
      const parts = [];
      if (modes.includes("monthly")) parts.push(`包月 ¥${monthly.toFixed(2)} ${specPriceUnit("compute", "monthly")}`);
      if (modes.includes("onDemand")) parts.push(`按量 ¥${onDemand.toFixed(2)} ${specPriceUnit("compute", "onDemand")}`);
      return parts.length ? parts : ["未配置"];
    };
    const priceTitle = (cityOrEco) => priceParts(cityOrEco).join(" / ");
    const priceHtml = (cityOrEco) => priceParts(cityOrEco).map(part => `<span>${escapeHtml(part)}</span>`).join("");
    const field = (label, value, cls = "") => `<div class="compute-field ${cls}"><div class="compute-label">${label}</div><div class="compute-value ${value === "未配置" || value === "无 GPU" ? "muted" : ""}" title="${escapeHtml(String(value))}">${escapeHtml(String(value))}</div></div>`;
    return {
      providerLine: `${providerName} * ${region}`,
      fields: `
        ${field("规格", specText)}
        ${field("GPU", gpuText)}
        ${field("处理器", c.cpuModel || "未配置", "full")}
        <div class="compute-field"><div class="compute-label">生态结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("eco"))}">${priceHtml("eco")}</div></div>
        <div class="compute-field"><div class="compute-label">地市结算价</div><div class="compute-value price" title="${escapeHtml(priceTitle("city"))}">${priceHtml("city")}</div></div>
      `
    };
  }
  function batchCloudDiskCardFields(c) {
    const detail = cloudDiskSpecCardDetail(c);
    return {
      providerLine: c.code || `${detail.providerName} * ${detail.region}`,
      fields: detail.fields
    };
  }

  function refreshCount() {
    computePool.querySelector(".cp-count").textContent = `已选 ${selectedCompute.size}`;
    rowsBox.querySelector(".rows-count").textContent = `${selectedCompute.size} 条`;
  }

  function paintCpList() {
    const kw = (cpSearchBar.querySelector(".cp-search").value || "").trim().toLowerCase();
    cpList.innerHTML = "";
    const visible = batchPool().filter(c => {
      if (!kw) return true;
      const provider = State.provider.find(p => p.id === c.providerId);
      const hay = [c.name, c.code, c.poolName, c.poolRegion, c.computeForm, c.gpuModel, c.diskType, c.capacityGB, provider?.region, getProviderName(c.providerId), c.vcpu + "vcpu", c.memoryGB + "gb"].join(" ").toLowerCase();
      return hay.includes(kw);
    });
    if (!visible.length) { cpList.appendChild(el('<div class="empty" style="grid-column:1/-1;">无匹配规格</div>')); return; }
    visible.forEach(c => {
      const gpu = c.gpuCount > 0 ? `${escapeHtml(c.gpuModel)} × ${c.gpuCount} · ${c.gpuMemoryGB}GB显存` : "无 GPU";
      const computeDetail = batchType() === "cloudDisk" ? batchCloudDiskCardFields(c) : batchComputeCardFields(c);
      const card = el(`<label class="commerce-spec-card cp-card commerce-compute-card ${selectedCompute.has(c.id) ? "selected" : ""}" data-id="${c.id}">
        <input type="checkbox" class="cp-check" value="${c.id}" ${selectedCompute.has(c.id) ? "checked" : ""} style="position:absolute;opacity:0;pointer-events:none;" />
        <div class="spec-icon"><i data-lucide="${batchIcon()}"></i></div>
        <div class="spec-main">
          <div class="spec-title" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
          <div class="spec-code" title="${escapeHtml(computeDetail ? computeDetail.providerLine : (c.code || ""))}">${escapeHtml(computeDetail ? computeDetail.providerLine : (c.code || ""))}</div>
          <div class="compute-field-grid">${computeDetail.fields}</div>
        </div>
        <div class="spec-check"><i data-lucide="check-circle-2"></i></div>
      </label>`);
      card.querySelector(".cp-check").addEventListener("change", (e) => {
        const id = e.target.value;
        if (e.target.checked) {
          selectedCompute.add(id);
          if (!rowState.has(id)) rowState.set(id, defaultRow(c));
          card.classList.add("selected");
        } else {
          selectedCompute.delete(id);
          rowState.delete(id);
          card.classList.remove("selected");
        }
        refreshCount();
        paintRows();
      });
      cpList.appendChild(card);
    });
    if (window.lucide) window.lucide.createIcons();
  }

  cpSearchBar.querySelector(".cp-search").addEventListener("input", paintCpList);
  computePool.querySelector(".cp-all").addEventListener("click", () => {
    cpList.querySelectorAll(".cp-check").forEach(cb => {
      if (!cb.checked) {
        cb.checked = true;
        const id = cb.value;
        selectedCompute.add(id);
        const c = batchSpec(id);
        if (c && !rowState.has(id)) rowState.set(id, defaultRow(c));
      }
    });
    paintCpList(); refreshCount(); paintRows();
  });
  computePool.querySelector(".cp-clear").addEventListener("click", () => {
    selectedCompute.clear(); rowState.clear();
    paintCpList(); refreshCount(); paintRows();
  });
  function refreshBatchType() {
    selectedCompute.clear();
    rowState.clear();
    sharedConfigBox.style.display = batchType() === "combo" ? "" : "none";
    batchInventorySourceCtl.disabled = batchType() === "cloudDisk";
    if (batchType() === "cloudDisk") batchInventorySourceCtl.value = "manual";
    computePool.querySelector("#batchSpecPoolTitle").textContent = batchTitle();
    rowsBox.querySelector("#batchRowsTitle").textContent = batchRowsTitle();
    paintCpList();
    refreshCount();
    paintRows();
  }
  batchTypeCtl.addEventListener("change", refreshBatchType);
  batchInventorySourceCtl.addEventListener("change", paintRows);

  function paintRows() {
    rowsBody.innerHTML = "";
    if (!selectedCompute.size) {
      rowsBody.appendChild(el('<div class="empty" style="padding:24px;text-align:center;color:var(--text-3);">勾选上方云服务器规格后，将在此自动生成对应的销售品明细行</div>'));
      if (window.lucide) window.lucide.createIcons();
      return;
    }
    const sourceMode = batchInventorySource();
    const isApiSource = sourceMode === "api";
    const isDeviceSource = sourceMode === "device";
    const table = el(`<table class="table batch-rows-table" style="min-width:1010px;">
      <thead><tr>
        <th style="width:285px;">云服务器规格</th>
        <th style="width:170px;">产品名称</th>
        <th style="width:210px;">销售品名称<span style="color:var(--danger);">*</span></th>
        <th style="width:82px;">${isApiSource ? "同步库存" : isDeviceSource ? "上架库存" : "库存"}<span style="color:var(--danger);">*</span></th>
        <th style="width:62px;">时长</th>
        <th style="width:230px;">标准售价</th>
      </tr></thead>
      <tbody></tbody>
    </table>`);
    const tbody = table.querySelector("tbody");
    Array.from(rowState.entries()).forEach(([cid, row]) => {
      const c = batchSpec(cid); if (!c) return;
      const modes = chargeModesForRow(row);
      const onDemandOk = modes.includes("onDemand");
      const monthlyOk = modes.includes("monthly");
      const tr = el(`<tr>
        <td>
          <div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
          <div class="meta" style="color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(computeMeta(c) + ' · ' + getProviderName(c.providerId) + ' · ' + (c.poolName || c.poolRegion || ''))}">${computeMeta(c)} · ${escapeHtml(getProviderName(c.providerId))}</div>
        </td>
        <td>
          <input class="input row-product-name" placeholder="默认取绑定产品" value="${escapeHtml(row.productName || "")}" />
        </td>
        <td>
          <input class="input row-name" placeholder="留空则使用规格名" value="${escapeHtml(row.name || "")}" />
        </td>
        <td>
          <input class="input row-stock" type="number" min="0" step="1" value="${isDeviceSource ? 0 : (row.stock ?? 0)}" ${(isApiSource || isDeviceSource) ? "disabled" : ""} title="${isApiSource ? "接口同步库存，本处仅展示模拟同步值" : isDeviceSource ? "设备编号获取，上架库存默认为 0" : "手动维护库存"}" />
          ${isApiSource ? `<div style="margin-top:4px;color:#94a3b8;font-size:11px;">接口同步</div>` : ""}
          ${isDeviceSource ? `<div style="margin-top:4px;color:#94a3b8;font-size:11px;">编号获取</div>` : ""}
        </td>
        <td>
          <input class="input row-duration" placeholder="30分钟" value="${escapeHtml(row.estimatedProvisionDuration || "")}" />
        </td>
        <td class="cell-price"></td>
      </tr>`);
      const cellPrice = tr.querySelector(".cell-price");
      const priceWrap = el('<div style="display:flex;flex-direction:column;gap:6px;"></div>');
      if (onDemandOk) {
        const odInput = el(`<div style="display:grid;grid-template-columns:42px 1fr 48px;gap:6px;align-items:center;"><span class="tag tag-muted" style="justify-content:center;">按量</span><input class="input row-od" type="number" min="0" step="0.01" value="${row.sellOnDemand || 0}" /><span style="color:#94a3b8;font-size:11px;">元/小时</span></div>`);
        odInput.querySelector("input").addEventListener("input", e => { row.sellOnDemand = Number(e.target.value) || 0; });
        priceWrap.appendChild(odInput);
      } else {
        row.sellOnDemand = 0;
      }
      if (monthlyOk) {
        const moInput = el(`<div style="display:grid;grid-template-columns:42px 1fr 48px;gap:6px;align-items:center;"><span class="tag tag-muted" style="justify-content:center;">包月</span><input class="input row-mo" type="number" min="0" step="0.01" value="${row.sellMonthly || 0}" /><span style="color:#94a3b8;font-size:11px;">元/月</span></div>`);
        moInput.querySelector("input").addEventListener("input", e => { row.sellMonthly = Number(e.target.value) || 0; });
        priceWrap.appendChild(moInput);
      } else {
        row.sellMonthly = 0;
      }
      if (!onDemandOk && !monthlyOk) priceWrap.appendChild(el('<span class="tag tag-muted">不支持</span>'));
      cellPrice.appendChild(priceWrap);
      tr.querySelector(".row-product-name").addEventListener("input", e => { row.productName = e.target.value; });
      tr.querySelector(".row-name").addEventListener("input", e => { row.name = e.target.value; });
      tr.querySelector(".row-stock").addEventListener("input", e => { row.stock = Number(e.target.value) || 0; });
      tr.querySelector(".row-duration").addEventListener("input", e => { row.estimatedProvisionDuration = e.target.value; });
      tbody.appendChild(tr);
    });
    const tableWrap = el('<div class="table-wrap" style="max-height:340px;overflow:auto;"></div>');
    tableWrap.appendChild(table);
    rowsBody.appendChild(tableWrap);
    if (window.lucide) window.lucide.createIcons();
  }

  paintCpList();
  paintRows();
  const body = el('<div class="commerce-batch-form" data-form-title="批量创建销售品"></div>');
  body.appendChild(headForm);
  body.appendChild(computePool);
  body.appendChild(rowsBox);
  body.appendChild(sharedConfigBox);
  body.appendChild(publishBox);
  refreshBatchType();

  Modal.open({
    title: "批量创建销售品",
    body,
    confirmText: "批量创建",
    wide: true,
    onConfirm: () => {
      if (!selectedCompute.size) { toast("请至少勾选一条云服务器规格", "error"); return false; }
      shared.portalSiteIds = portalPicker.getSelected();
      if (!shared.portalSiteIds.length) { toast("请至少选择一个推送门户站点", "error"); return false; }
      const templateId = null;
      const tpl = null;
      const source = batchInventorySource();

      const payloads = [];
      for (const [cid, row] of rowState.entries()) {
        const c = batchSpec(cid); if (!c) continue;
        const modes = chargeModesForRow(row);
        if (!modes.length) { toast(`「${c.name}」已选规格的计费模式无交集`, "error"); return false; }
        if (modes.includes("onDemand") && !(row.sellOnDemand > 0)) { toast(`「${c.name}」需填写按量销售价`, "error"); return false; }
        if (modes.includes("monthly") && !(row.sellMonthly > 0)) { toast(`「${c.name}」需填写包周期销售价`, "error"); return false; }
        if (source === "manual" && !(row.stock > 0)) { toast(`「${c.name}」需填写库存`, "error"); return false; }
        const finalProductName = (row.productName && row.productName.trim()) || c.name;
        const payload = {
          id: uid("p_"),
          code: genSpecCode("product"),
          name: c.name,
          templateId,
          productName: finalProductName,
          tags: tpl ? [...(tpl.tags || [])] : [],
          description: tpl ? (tpl.description || "") : "",
          productType: batchType(),
          computeId: (batchType() === "combo" || batchType() === "computeOnly") ? cid : null,
          computeIds: (batchType() === "combo" || batchType() === "computeOnly") ? [cid] : [],
          systemDiskId: batchType() === "combo" ? (shared.systemDiskId || null) : null,
          dataDiskIds: batchType() === "combo" ? shared.dataDiskIds.slice() : [],
          bandwidthId: batchType() === "combo" ? (shared.bandwidthId || null) : null,
          cloudDiskIds: batchType() === "cloudDisk" ? [cid] : (batchType() === "combo" ? shared.cloudDiskIds.slice() : []),
          stock: source === "api" ? Math.max(0, Number(row.stock) || 100) : source === "device" ? 0 : row.stock,
          inventorySource: source,
          orderForm: tpl ? (tpl.orderForm || "付费") : "付费",
          estimatedProvisionDuration: row.estimatedProvisionDuration || "",
          sellOnDemand: row.sellOnDemand,
          sellMonthly: row.sellMonthly,
          basePrice: row.sellMonthly || row.sellOnDemand,
          currency: "CNY",
          portalSiteIds: shared.portalSiteIds.slice(),
          status: "active",
          effectiveAt: new Date().toISOString().slice(0, 10),
          expireAt: "",
          updatedAt: nowStr(),
        };
        if (payload.productType === "cloudDisk") payload.inventorySource = "manual";
        payload.name = buildProductRuleName(payload);
        payloads.push(payload);
      }
      payloads.forEach(p => State.product.unshift(p));
      payloads.forEach(syncProductDevicePlaceholders);
      persist("product");
      persist("deviceInventory");
      setView("product");
      toast(`已批量创建 ${payloads.length} 条销售品，并同步生成设备编号维护行`, "success");
    }
  });
  if (window.lucide) window.lucide.createIcons();
}

// ===== 销售品批量绑定 =====
function openBatchBindModal(action, ids, onDone) {
  const map = {
    bindCompute: { title: "批量绑定云服务器", kind: "compute", multi: false, field: "computeId", label: "云服务器规格", icon: "cpu", desc: c => `${c.vcpu}vCPU / ${c.memoryGB}GB · ${c.computeForm || ""}` },
    bindSystem:  { title: "批量绑定系统盘", kind: "systemDisk", multi: false, field: "systemDiskId", label: "系统盘规格", icon: "hard-drive", desc: c => `${c.capacityGB}GB · ${c.os}` },
    bindData:    { title: "批量绑定数据盘", kind: "dataDisk", multi: true,  field: "dataDiskIds", label: "数据盘规格（可多选）", icon: "database", desc: c => `${c.capacityGB}GB · ${c.diskType}` },
    bindBw:      { title: "批量绑定带宽", kind: "bandwidth", multi: false, field: "bandwidthId", label: "带宽规格", icon: "activity", desc: c => `${c.peakMbps}Mbps · ${c.networkType}` },
    bindCloudDisk: { title: "批量绑定云硬盘", kind: "cloudDisk", multi: true, field: "cloudDiskIds", label: "云硬盘规格（可多选）", icon: "hard-drive", desc: c => `${c.capacityGB}GB · ${c.diskType}` },
  };
  const cfg = map[action];
  if (!cfg) return;
  const pool = State[cfg.kind].filter(x => x.listed !== false);
  const form = el(`<div class="form commerce-form" data-form-title="${cfg.title}"></div>`);
  form.appendChild(el(`<div class="hint" style="grid-column:1/-1;margin-bottom:6px;">将为已勾选的 <strong>${ids.length}</strong> 个销售品统一绑定下方${cfg.label}。仅展示已上架的规格。</div>`));
  const listBox = el(`<div class="bundle-grid" style="grid-column:1/-1;grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));"></div>`);
  const chosen = new Set();
  if (pool.length === 0) {
    listBox.appendChild(el(`<div class="empty">暂无可绑定的规格，请先在规格管理中上架。</div>`));
  }
  pool.forEach(c => {
    const card = el(`<div class="bundle-card" data-id="${c.id}"><i data-lucide="${cfg.icon}"></i><div><strong>${escapeHtml(c.name)}</strong><div class="meta">${escapeHtml(cfg.desc(c))}</div></div></div>`);
    card.addEventListener("click", () => {
      if (cfg.multi) {
        if (chosen.has(c.id)) { chosen.delete(c.id); card.classList.remove("selected"); }
        else { chosen.add(c.id); card.classList.add("selected"); }
      } else {
        chosen.clear();
        listBox.querySelectorAll(".bundle-card").forEach(d => d.classList.remove("selected"));
        chosen.add(c.id);
        card.classList.add("selected");
      }
    });
    listBox.appendChild(card);
  });
  form.appendChild(listBox);

  Modal.open({
    title: cfg.title,
    body: form,
    confirmText: `应用到 ${ids.length} 个销售品`,
    wide: true,
    onConfirm: () => {
      if (!chosen.size) { toast("请选择要绑定的规格", "error"); return false; }
      const val = cfg.multi ? Array.from(chosen) : Array.from(chosen)[0];
      State.product.forEach(p => {
        if (!ids.includes(p.id)) return;
        p[cfg.field] = val;
        p.updatedAt = nowStr();
      });
      persist("product");
      toast(`已为 ${ids.length} 个销售品完成绑定`, "success");
      if (typeof onDone === "function") onDone();
    }
  });
  if (window.lucide) window.lucide.createIcons();
}

// ===== IDC工单 · 列表 =====
function ticketStatusTag(s, type) {
  const map = {
    purchase: { pending: ["待开通", "tag-warning"], provisioning: ["开通中", "tag-primary"], done: ["开通成功", "tag-success"], failed: ["开通失败", "tag-danger"] },
    renew:    { pending: ["待续订", "tag-primary"], provisioning: ["续订中", "tag-primary"], done: ["续订成功", "tag-success"], failed: ["续订失败", "tag-danger"] },
    cancel:   { pending: ["待退订", "tag-danger"], provisioning: ["退订中", "tag-primary"], done: ["退订成功", "tag-success"], failed: ["退订失败", "tag-danger"] },
  };
  const tm = map[type] || map.purchase;
  const [t, c] = tm[s] || ["未知", "tag-muted"];
  return `<span class="tag ${c}">${t}</span>`;
}
function ticketTypeLabel(t) {
  const map = { idc:"IDC 工单", purchase:"新购", renew:"续订", cancel:"退订" };
  return map[t] || escapeHtml(t || "");
}
function ticketProviderType(ticket) {
  const raw = ticket?.providerType || ticket?.resourceProviderType || ticket?.serviceProviderType || "";
  if (raw === "eco" || raw === "生态") return "eco";
  if (raw === "owned" || raw === "自有") return "owned";
  return String(ticket?.productName || "").includes("生态") ? "eco" : "owned";
}
function ticketProviderTypeLabel(ticket) {
  return ticketProviderType(ticket) === "eco" ? "生态" : "自有";
}
function ticketProviderTypeTag(ticket) {
  return ticketProviderType(ticket) === "eco"
    ? '<span class="tag tag-warning">生态</span>'
    : '<span class="tag tag-primary">自有</span>';
}
