<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>算网调度 · 运营后台</title>
  <style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --panel-2: #fafbfd;
  --border: #e6e8ef;
  --border-strong: #d4d7e0;
  --text: #1f2330;
  --text-2: #5b6275;
  --text-3: #8a8f9e;
  --primary: #2f54eb;
  --primary-soft: #ecf0ff;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --radius: 8px;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

.sidebar {
  background: #11162a;
  color: #cfd3e0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  border-right: 1px solid #0c1022;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 6px;
  background: linear-gradient(135deg, #2f54eb, #6f86ff);
  color: #fff; display: grid; place-items: center;
  font-weight: 700;
}
.brand-title { font-size: 14px; color: #fff; font-weight: 600; }
.brand-sub { font-size: 11px; color: #8b91a8; margin-top: 2px; }

.nav {
  flex: 1 1 auto;
  min-height: 0;
  padding: 8px 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.nav::-webkit-scrollbar { width: 6px; }
.nav::-webkit-scrollbar-track { background: transparent; }
.nav::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.16);
  border-radius: 999px;
}
.nav::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
.nav-section {
  font-size: 11px; color: #6c7290;
  padding: 14px 18px 6px;
  letter-spacing: 0.04em;
}
.nav-group { margin-bottom: 2px; }
.nav-group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 18px;
  font-size: 11px; color: #6c7290;
  cursor: pointer; user-select: none;
  letter-spacing: 0.04em; text-transform: none;
}
.nav-group-header:hover { color: #aab0c4; }
.nav-group-header .chev {
  width: 12px; height: 12px;
  transition: transform 0.18s ease;
  flex-shrink: 0;
}
.nav-group.collapsed .chev { transform: rotate(-90deg); }
.nav-group-items {
  overflow: hidden;
  max-height: 600px;
  transition: max-height 0.2s ease;
}
.nav-group.collapsed .nav-group-items { max-height: 0; }
.nav-group-header .grp-label { flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px;
  color: #cfd3e0; text-decoration: none;
  font-size: 13px; cursor: pointer;
  border-left: 2px solid transparent;
}
.nav-item i { width: 16px; height: 16px; }
.nav-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
.nav-item.active {
  background: rgba(47, 84, 235, 0.16);
  color: #fff;
  border-left-color: var(--primary);
}

.sidebar-footer {
  padding: 12px 18px; border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: #8b91a8;
  flex-shrink: 0;
}
.env-tag { display: inline-flex; align-items: center; gap: 4px; }
.env-tag i { width: 12px; height: 12px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  height: 52px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
}
.crumb { font-size: 14px; font-weight: 600; color: var(--text); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.user { display: flex; align-items: center; gap: 8px; margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--border); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary);
  display: grid; place-items: center; font-weight: 600; font-size: 12px;
}
.user-name { font-size: 12px; font-weight: 600; }
.user-role { font-size: 11px; color: var(--text-3); }

.content { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }

.btn {
  height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-strong);
  background: #fff; color: var(--text); font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn i, .btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: #2545d4; color: #fff; }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-danger { color: var(--danger); border-color: #f2c5c5; }
.btn-danger:hover { background: #fff5f5; color: var(--danger); border-color: var(--danger); }
.btn-sm { height: 26px; padding: 0 8px; font-size: 12px; }

.icon-btn {
  width: 30px; height: 30px; border-radius: 6px; border: 1px solid transparent;
  background: transparent; cursor: pointer; color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: #f0f2f7; color: var(--text); }
.icon-btn i, .icon-btn svg { width: 16px; height: 16px; }

.page-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 14px;
}
.page-title { font-size: 18px; font-weight: 600; }
.page-desc { font-size: 12px; color: var(--text-3); margin-top: 4px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px;
}
.stat-label { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.stat-label i { width: 14px; height: 14px; }
.stat-value { font-size: 22px; font-weight: 600; margin-top: 6px; }
.stat-foot { font-size: 11px; color: var(--text-3); margin-top: 4px; }

/* 运营数据概览 */
.ops-overview {
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  padding: 6px 2px 2px;
}
.ops-overview::before {
  content: "";
  position: absolute;
  inset: -50px -24px 0 -24px;
  z-index: 0;
  background:
    radial-gradient(440px circle at 6% -6%, rgba(99, 102, 241, .14), transparent 60%),
    radial-gradient(480px circle at 98% 0%, rgba(14, 165, 233, .11), transparent 55%),
    radial-gradient(400px circle at 50% 112%, rgba(217, 70, 239, .07), transparent 60%);
  pointer-events: none;
}
.ops-overview > * { position: relative; z-index: 1; }
.ops-overview-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.ops-overview-title {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(120deg, #2f54eb, #7c3aed 38%, #2563eb 68%, #0ea5e9);
  background-size: 220% 220%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  display: inline-block;
  letter-spacing: .5px;
  animation: opsGradShift 9s ease infinite;
}
.ops-overview-desc {
  margin-top: 10px;
  color: #64748b;
  font-size: 13px;
  padding-left: 4px;
  position: relative;
}
.ops-filter-panel {
  background: linear-gradient(135deg, rgba(255,255,255,.96) 0%, rgba(248,250,252,.94) 100%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid #dbe4f0;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 12px 28px rgba(15, 23, 42, .07), inset 0 1px 0 rgba(255, 255, 255, .8);
}
.ops-filter-grid {
  display: grid;
  grid-template-columns: 282px 148px 150px;
  gap: 12px;
  align-items: end;
}
.ops-filter-field {
  position: relative;
}
.ops-filter-field label {
  display: block;
  margin-bottom: 7px;
  color: #475569;
  font-size: 12px;
  font-weight: 800;
}
.ops-filter-field .input,
.ops-filter-field .select {
  width: 100%;
  min-width: 0;
  height: 36px;
  border-color: #dbe4f0;
  border-radius: 10px;
  background-color: #fff;
  box-shadow: inset 0 1px 2px rgba(15,23,42,.04);
}
.ops-month-range {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr);
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 8px;
  border: 1px solid #dbe4f0;
  border-radius: 10px;
  background: #fff;
  box-shadow: inset 0 1px 2px rgba(15,23,42,.04);
}
.ops-month-range .input {
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.ops-month-range span {
  color: #94a3b8;
  text-align: center;
  font-weight: 800;
}
.ops-filter-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.ops-filter-note {
  margin-top: 12px;
  padding: 8px 10px;
  border-radius: 10px;
  background: #f8fafc;
  color: #64748b;
  font-size: 12px;
}
@keyframes opsGradShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.ops-kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}
.ops-kpi-grid.six {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}
.ops-kpi-grid.seven {
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.ops-kpi-card {
  position: relative;
  overflow: hidden;
  min-height: 134px;
  padding: 17px 18px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
  box-shadow: 0 12px 30px rgba(79, 70, 229, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25);
  cursor: pointer;
  transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s ease;
  --glow: rgba(79, 70, 229, .5);
}
.ops-kpi-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .22) 50%, transparent 70%);
  transform: translateX(-130%);
  transition: transform .8s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
.ops-kpi-card:hover::before { transform: translateX(130%); }
.ops-kpi-card:nth-child(2) { background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%); box-shadow: 0 12px 30px rgba(13, 148, 136, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25); --glow: rgba(13, 148, 136, .5); }
.ops-kpi-card:nth-child(3) { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); box-shadow: 0 12px 30px rgba(37, 99, 235, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25); --glow: rgba(37, 99, 235, .5); }
.ops-kpi-card:nth-child(4) { background: linear-gradient(135deg, #9333ea 0%, #a855f7 100%); box-shadow: 0 12px 30px rgba(147, 51, 234, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25); --glow: rgba(147, 51, 234, .5); }
.ops-kpi-card:nth-child(5) { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); box-shadow: 0 12px 30px rgba(217, 119, 6, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25); --glow: rgba(217, 119, 6, .5); }
.ops-kpi-card:nth-child(6) { background: linear-gradient(135deg, #db2777 0%, #ec4899 100%); box-shadow: 0 12px 30px rgba(219, 39, 119, .38), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25); --glow: rgba(219, 39, 119, .5); }
.ops-kpi-card.warn { background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%) !important; box-shadow: 0 12px 30px rgba(220, 38, 38, .4), 0 4px 10px rgba(15, 23, 42, .12), inset 0 1px 0 rgba(255, 255, 255, .25) !important; --glow: rgba(220, 38, 38, .55); }
.ops-kpi-card:hover {
  transform: translateY(-8px) scale(1.025);
  box-shadow: 0 26px 52px var(--glow), 0 10px 22px rgba(15, 23, 42, .18);
}
.ops-kpi-card::after {
  content: "";
  position: absolute;
  right: -26px;
  top: -36px;
  width: 108px;
  height: 108px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .14);
  transition: background .24s ease;
}
.ops-kpi-card:hover::after { background: rgba(255, 255, 255, .3); }
.ops-kpi-label {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  color: rgba(255, 255, 255, .88);
  font-size: 12px;
  font-weight: 800;
}
.ops-kpi-label i { width: 15px; height: 15px; color: rgba(255, 255, 255, .92); }
.ops-kpi-value {
  position: relative;
  z-index: 1;
  margin-top: 12px;
  color: #ffffff;
  font-size: 22px;
  font-weight: 800;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ops-kpi-sub {
  position: relative;
  z-index: 1;
  margin-top: 5px;
  color: rgba(255, 255, 255, .72);
  font-size: 12px;
}
.ops-board-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.ops-board {
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: box-shadow .22s ease, border-color .22s ease;
}
.ops-board-head {
  min-height: 48px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #e8edf4;
  background: linear-gradient(110deg, #fbfcfe 0%, #f4f7fc 55%, #eef2fb 100%);
}
.ops-board-title {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #334155;
  font-size: 14px;
  font-weight: 800;
}
.ops-board-title i {
  width: 15px;
  height: 15px;
  color: #5b6cb8;
  padding: 7px;
  background: #e8edfb;
  border-radius: 10px;
  border: 1px solid #dde4f5;
}
.ops-board-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
.ops-compute-scale {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.ops-compute-card {
  padding: 14px;
  border: 1px solid #e8edf5;
  border-radius: 12px;
  background: linear-gradient(180deg, #ffffff, #f8fafc);
}
.ops-compute-card span {
  display: block;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}
.ops-compute-card strong {
  display: block;
  margin-top: 8px;
  color: #0f172a;
  font-size: 21px;
  line-height: 1.2;
}
.ops-util-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.ops-util-card {
  padding: 12px;
  border: 1px solid #e8edf5;
  border-radius: 12px;
  background: #fbfcfe;
}
.ops-util-card.warn {
  border-color: #fecaca;
  background: #fff5f5;
}
.ops-util-card span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}
.ops-util-card strong {
  display: block;
  margin-top: 8px;
  color: #0f172a;
  font-size: 20px;
}
.ops-util-card.warn strong,
.ops-util-card.warn em { color: #dc2626; }
.ops-util-card em {
  font-style: normal;
  color: #94a3b8;
  font-size: 11px;
}
.ops-util-bar {
  height: 7px;
  margin-top: 9px;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
}
.ops-util-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #60a5fa, #2563eb);
}
.ops-util-card.warn .ops-util-bar i { background: linear-gradient(90deg, #fca5a5, #ef4444); }
.ops-hbar-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ops-hbar-row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) 86px;
  gap: 10px;
  align-items: center;
  font-size: 12px;
}
.ops-hbar-row b {
  color: #334155;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ops-hbar-track {
  height: 12px;
  border-radius: 999px;
  background: #eef2f7;
  overflow: hidden;
}
.ops-hbar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #818cf8, #4f46e5);
}
.ops-hbar-row em {
  color: #64748b;
  font-style: normal;
  text-align: right;
}
.ops-cloud-combo {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 16px;
}
.ops-cloud-combo.wide {
  grid-template-columns: 360px minmax(0, 1fr);
  align-items: stretch;
}
.ops-cloud-wide {
  border-color: #dbe7ff;
  box-shadow: 0 10px 26px rgba(79, 70, 229, .08);
}
.ops-cloud-tabs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.ops-cloud-combo.wide .ops-cloud-tabs {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.ops-cloud-tab {
  text-align: left;
  min-height: 106px;
  padding: 14px 15px;
  border: 1px solid #e8edf5;
  border-radius: 12px;
  background: linear-gradient(180deg, #fff, #fbfcff);
  cursor: pointer;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}
.ops-cloud-tab.active {
  border-color: #c7d2fe;
  background: linear-gradient(180deg, #eef2ff, #f8faff);
  box-shadow: 0 8px 18px rgba(79,70,229,.12);
}
.ops-cloud-tab span {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #334155;
  font-size: 13px;
  font-weight: 800;
}
.ops-cloud-tab strong {
  display: block;
  margin-top: 8px;
  color: #0f172a;
  font-size: 22px;
}
.ops-cloud-tab em {
  display: block;
  margin-top: 4px;
  color: #94a3b8;
  font-style: normal;
  font-size: 12px;
}
.ops-cloud-detail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  padding: 0 2px;
}
.ops-cloud-detail-head strong {
  color: #0f172a;
  font-size: 14px;
}
.ops-cloud-detail-head span {
  color: #94a3b8;
  font-size: 12px;
}
.ops-cloud-detail {
  padding: 12px;
  border: 1px solid #e8edf5;
  border-radius: 14px;
  background: #fbfcfe;
}
.ops-cloud-detail .ops-hbar-row {
  grid-template-columns: 150px minmax(0, 1fr) 180px;
  padding: 8px 0;
  border-bottom: 1px solid #eef2f7;
}
.ops-cloud-detail .ops-hbar-row:last-child { border-bottom: 0; }
.ops-city-combo {
  height: 300px;
  overflow: hidden;
  border: 1px solid #e8edf5;
  border-radius: 12px;
  background: #fff;
}
.ops-city-combo-list {
  height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.ops-city-combo-head,
.ops-city-combo-row {
  display: grid;
  grid-template-columns: 40px 100px 1fr 1fr 1fr;
  gap: 10px;
  align-items: center;
}
.ops-city-combo-head {
  position: sticky;
  top: 0;
  z-index: 1;
  min-height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid #e8edf5;
  background: #f8fafc;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}
.ops-city-combo-row {
  min-height: 46px;
  padding: 0 12px;
  border-bottom: 1px solid #f1f5f9;
  background: #fff;
  transition: background .16s ease;
}
.ops-city-combo-row:hover {
  background: #f8faff;
}
.ops-city-combo-row.featured {
  background: #fbfdff;
}
.ops-city-combo-rank {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: #eef2ff;
  color: #4338ca;
  font-weight: 800;
  font-size: 11px;
}
.ops-city-combo-name {
  color: #0f172a;
  font-weight: 800;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ops-city-bars {
  display: grid;
  grid-template-columns: 1fr;
}
.ops-city-bar {
  display: none;
}
.ops-city-bar.order {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  align-items: center;
}
.ops-city-bar.order > span,
.ops-city-bar.order b { display: none; }
.ops-city-bar-track {
  height: 9px;
  border-radius: 999px;
  background: #eef2f7;
  overflow: hidden;
}
.ops-city-bar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
}
.ops-city-bar b {
  color: #475569;
  font-weight: 700;
  text-align: right;
  font-family: ui-monospace, Menlo, Consolas, monospace;
}
.ops-city-bar.order span { background: #4f46e5; }
.ops-city-bar.settle span { background: #0ea5e9; }
.ops-city-bar.bill span { background: #10b981; }
.ops-city-money {
  color: #334155;
  font-size: 12px;
  font-weight: 800;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  white-space: nowrap;
  text-align: right;
}
.ops-city-money.order { color: #4338ca; }
.ops-city-money.settle { color: #0369a1; }
.ops-city-money.bill { color: #047857; }
.ops-city-combo-total {
  text-align: right;
  color: #0f172a;
  font-weight: 800;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px;
}
.ops-city-combo-total span {
  display: none;
}
.ops-donut-wrap {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
}
.ops-donut {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: conic-gradient(var(--segments));
  position: relative;
  margin: 0 auto;
}
.ops-donut::after {
  content: "";
  position: absolute;
  inset: 48px;
  border-radius: 50%;
  background: #fff;
  box-shadow: inset 0 0 0 1px #e8edf5;
}
.ops-donut-center {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  text-align: center;
  color: #0f172a;
  font-weight: 800;
}
.ops-donut-center small {
  display: block;
  margin-top: 4px;
  color: #94a3b8;
  font-size: 11px;
}
.ops-donut-legend {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.ops-donut-legend div {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 8px;
  align-items: center;
  color: #64748b;
  font-size: 12px;
}
.ops-donut-legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.ops-live-list {
  height: 300px;
  overflow: hidden;
  border: 1px solid #e8edf5;
  border-radius: 12px;
  background: #fff;
}
.ops-board .ops-city-combo,
.ops-board .ops-live-list {
  flex: none;
}
.ops-live-inner {
  animation: opsLiveScroll 22s linear infinite;
}
.ops-live-list:hover .ops-live-inner { animation-play-state: paused; }
.ops-live-row {
  display: grid;
  grid-template-columns: 1.1fr 70px 86px 100px 92px 1fr;
  gap: 10px;
  align-items: center;
  min-height: 46px;
  padding: 0 12px;
  border-bottom: 1px solid #f1f5f9;
  color: #475569;
  font-size: 12px;
}
.ops-live-row.head {
  position: sticky;
  top: 0;
  z-index: 1;
  min-height: 38px;
  background: #f8fafc;
  color: #64748b;
  font-weight: 800;
}
.ops-live-row strong { color: #0f172a; }
.ops-live-row .scene {
  width: max-content;
  padding: 2px 7px;
  border-radius: 999px;
  background: #eef2ff;
  color: #4338ca;
  font-weight: 700;
}
@keyframes opsLiveScroll {
  0%, 12% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}
.ops-mini-tabs {
  display: inline-flex;
  padding: 3px;
  border-radius: 7px;
  background: #f1f5f9;
}
.ops-mini-tabs button {
  height: 26px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background .18s ease, color .18s ease, box-shadow .18s ease;
}
.ops-mini-tabs button.active {
  background: #fff;
  color: #2f54eb;
  box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
}
.ops-mini-tabs button:not(.active):hover {
  color: #334155;
  background: rgba(255, 255, 255, .5);
}
.ops-line-chart {
  width: 100%;
  height: auto;
  display: block;
}
.ops-resource-trend-wrap {
  position: relative;
}
.ops-resource-band {
  cursor: crosshair;
}
.ops-resource-tooltip {
  position: absolute;
  z-index: 22;
  width: 228px;
  padding: 10px 12px;
  border: 1px solid #dbe3ef;
  border-radius: 10px;
  background: rgba(255,255,255,.98);
  box-shadow: 0 14px 34px rgba(15,23,42,.16);
  pointer-events: none;
  transform: translate(-50%, -100%);
  margin-top: -12px;
  color: #334155;
  font-size: 12px;
  backdrop-filter: blur(6px);
}
.ops-resource-tooltip strong {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
  color: #0f172a;
  font-size: 13px;
}
.ops-resource-tooltip .row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
  border-top: 1px solid #f1f5f9;
}
.ops-resource-tooltip .row:first-of-type {
  border-top: 0;
}
.ops-resource-tooltip em {
  font-style: normal;
  color: #64748b;
}
.ops-resource-tooltip b {
  color: #0f172a;
  font-weight: 800;
}
.ops-chart-legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  color: #64748b;
  font-size: 12px;
}
.ops-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  display: inline-block;
  margin-right: 5px;
}
.ops-trend-wrap { position: relative; }
.ops-trend-tooltip {
  position: absolute;
  z-index: 20;
  min-width: 200px;
  max-width: 280px;
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: rgba(255, 255, 255, .98);
  box-shadow: 0 10px 30px rgba(15, 23, 42, .16);
  pointer-events: none;
  font-size: 12px;
  color: #334155;
  backdrop-filter: blur(6px);
  transform: translate(-50%, -100%);
  margin-top: -14px;
}
.ops-trend-tooltip tt {
  display: block;
  color: #0f172a;
  font-weight: 800;
  font-size: 13px;
  margin-bottom: 8px;
}
.ops-trend-tooltip tl { display: flex; gap: 6px; align-items: center; }
.ops-trend-tooltip tl i { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.ops-trend-tooltip tl b { margin-left: auto; color: #0f172a; font-weight: 700; }
.ops-trend-tooltip th {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid #f1f5f9;
  color: #64748b;
  font-size: 11px;
  font-weight: 800;
}
.ops-trend-tooltip tr {
  display: flex;
  justify-content: space-between;
  padding: 2px 0;
}
.ops-trend-tooltip tr td:first-child { color: #64748b; }
.ops-trend-tooltip tr td:last-child { color: #0f172a; font-weight: 600; }
.ops-trend-band { cursor: crosshair; }

.ops-bar-chart {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 218px;
}
.ops-bar-row {
  display: grid;
  grid-template-columns: 82px 1fr 52px;
  gap: 10px;
  align-items: center;
  color: #64748b;
  font-size: 12px;
}
.ops-bar-track {
  display: flex;
  height: 22px;
  overflow: hidden;
  border-radius: 7px;
  background: #eef2f7;
  gap: 2px;
}
.ops-bar-track span:nth-child(1) { flex: var(--new, 1); }
.ops-bar-track span:nth-child(2) { flex: var(--renew, 1); }
.ops-bar-track span:nth-child(3) { flex: var(--cancel, 1); }
.ops-bar-track span:nth-child(1) { background: #2f54eb; }
.ops-bar-track span:nth-child(2) { background: #16a34a; }
.ops-bar-track span:nth-child(3) { background: #f97316; }
.ops-bar-track span { transition: filter .18s ease; }
.ops-bar-track:hover span { filter: brightness(1.1); }
.ops-rate-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.ops-order-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.ops-order-metric {
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  background: linear-gradient(160deg, #e9f0ff 0%, #f4f8ff 100%);
}
.ops-order-metric span {
  display: block;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
}
.ops-order-metric strong {
  display: block;
  margin-top: 4px;
  color: #0f172a;
  font-size: 16px;
  line-height: 1.35;
}
.ops-order-shell,
.ops-bill-shell {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ops-order-summary {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 12px;
}
.ops-order-total {
  padding: 14px;
  border: 1px solid #dbeafe;
  border-radius: 8px;
  background: #eff6ff;
}
.ops-order-total span,
.ops-bill-total span,
.ops-bill-card span {
  display: block;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
}
.ops-order-total strong {
  display: block;
  margin-top: 8px;
  color: #1d4ed8;
  font-size: 24px;
}
.ops-order-total em {
  display: block;
  margin-top: 6px;
  color: #64748b;
  font-style: normal;
  font-size: 12px;
}
.ops-order-metric-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.ops-order-mini {
  padding: 12px;
  border: 1px solid #e8edf5;
  border-radius: 10px;
  background: #fbfcfe;
}
.ops-order-mini strong {
  display: block;
  margin-top: 6px;
  color: #1e1b4b;
  font-size: 18px;
}
.ops-order-mini small {
  display: block;
  margin-top: 3px;
  color: #94a3b8;
}
.ops-order-dist {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ops-bill-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.ops-bill-total,
.ops-bill-card {
  padding: 14px;
  border: 1px solid #e8edf5;
  border-radius: 10px;
  background: #fbfcfe;
}
.ops-bill-total {
  border-color: #dde4f5;
  background: #f5f7fc;
}
.ops-bill-total strong,
.ops-bill-card strong {
  display: block;
  margin-top: 7px;
  color: #1e1b4b;
  font-size: 20px;
  line-height: 1.35;
}
.ops-bill-total strong { color: #1d4ed8; }
.ops-bill-list {
  border: 1px solid #eef2f7;
  border-radius: 8px;
  overflow: hidden;
}
.ops-bill-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-top: 1px solid #f1f5f9;
  background: #fff;
}
.ops-bill-row:first-child { border-top: 0; }
.ops-bill-row strong {
  display: block;
  color: #0f172a;
}
.ops-bill-row span {
  display: block;
  margin-top: 3px;
  color: #94a3b8;
  font-size: 12px;
}
.ops-rate-pill {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  background: linear-gradient(160deg, #e9f0ff 0%, #f4f8ff 100%);
}
.ops-rate-pill span {
  display: block;
  color: #64748b;
  font-size: 12px;
}
.ops-rate-pill strong {
  display: block;
  margin-top: 4px;
  color: #0f172a;
  font-size: 18px;
}
.ops-top-table {
  margin-top: 12px;
  border: 1px solid #eef2f7;
  border-radius: 8px;
  overflow: hidden;
}
.ops-top-table .table-wrap { border-top: 0; }
.ops-rank-card {
  margin-top: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 10px rgba(47, 84, 235, .10), 0 1px 2px rgba(15, 23, 42, .05);
}
.ops-rank-head {
  min-height: 42px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #eef2f7;
}
.ops-rank-title {
  color: #0f172a;
  font-size: 13px;
  font-weight: 800;
}
.ops-rank-list {
  display: flex;
  flex-direction: column;
}
.ops-rank-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-top: 1px solid #f1f5f9;
  transition: background .15s ease;
}
.ops-rank-row:hover {
  background: #f8faff;
}
.ops-rank-row:first-child { border-top: 0; }
.ops-rank-index {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: #eff6ff;
  color: #1d4ed8;
  font-weight: 800;
  font-size: 12px;
}
.ops-rank-row:nth-child(-n+3) .ops-rank-index {
  background: linear-gradient(135deg, #fcd34d, #f59e0b);
  color: #7c2d12;
  box-shadow: 0 2px 8px rgba(245, 158, 11, .35);
}
.ops-rank-main strong {
  display: block;
  color: #0f172a;
  font-size: 13px;
}
.ops-rank-main span {
  display: block;
  margin-top: 3px;
  color: #94a3b8;
  font-size: 12px;
}
.ops-rank-amount {
  color: #0f172a;
  font-weight: 800;
  white-space: nowrap;
}
.ops-fund-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 12px;
  margin-top: 12px;
  align-items: stretch;
}
.ops-trend-filter {
  display: inline-flex;
  gap: 2px;
  background: #eef2f7;
  border-radius: 8px;
  padding: 2px;
}
.ops-trend-filter button {
  border: 0;
  background: transparent;
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  transition: all .15s;
}
.ops-trend-filter button.active {
  background: #fff;
  color: #2f54eb;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.ops-trend-filter button:hover:not(.active) {
  color: #334155;
}
.ops-site-scroll-row .rk {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: #eef2f7;
  color: #64748b;
  font-size: 11px; font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ops-site-scroll-row:nth-child(-n+4) .rk {
  background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
  color: #3730a3;
}
.ops-site-scroll {
  max-height: 240px;
  overflow-y: auto;
  border: 1px solid #e8edf5;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(15,23,42,.04);
}
.ops-site-scroll-head,
.ops-site-scroll-row {
  display: grid;
  grid-template-columns: 32px 1.2fr repeat(3, 1fr);
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 12px;
}
.ops-site-scroll-head {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f6f8fc;
  color: #64748b;
  font-weight: 700;
  border-bottom: 1px solid #e8edf5;
  font-size: 11px;
  text-transform: none;
  letter-spacing: 0;
}
.ops-site-scroll-row { border-top: 1px solid #f1f5f9; transition: background .12s; }
.ops-site-scroll-row:hover { background: #f0f4ff; }
.ops-site-scroll-row .site { color: #1e293b; font-weight: 700; }
.ops-site-scroll-row .num { color: #334155; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; }
.ops-site-scroll.wide .ops-site-scroll-head,
.ops-site-scroll.wide .ops-site-scroll-row { grid-template-columns: 32px 1.2fr repeat(5, 1fr); }
.ops-scroll-board { min-height: 0; }
.ops-scroll-board .ops-board-body { overflow: hidden; }
/* ===== 资金明细 · 贡献度排行榜 ===== */
.ops-fund-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 320px;
  overflow-y: auto;
  padding: 4px 2px;
  margin-top: 4px;
}
.ops-fund-list::-webkit-scrollbar { width: 6px; }
.ops-fund-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
.ops-fund-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
.ops-fund-card {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 11px;
  align-items: center;
  padding: 10px 13px;
  border: 1px solid #eaeef6;
  border-radius: 13px;
  background: #fff;
  position: relative;
  transition: transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s ease, border-color .16s ease;
}
.ops-fund-card::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
  border-radius: 999px; background: transparent; transition: background .16s ease;
}
.ops-fund-card:hover {
  transform: translateY(-2px);
  border-color: #c7d2fe;
  box-shadow: 0 10px 22px rgba(79,70,229,.1);
}
.ops-fund-card:hover::before { background: linear-gradient(180deg,#818cf8,#6366f1); }
.ops-fund-rank {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  font-weight: 800; font-size: 13px;
  background: #f1f5f9; color: #64748b;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.ops-fund-card:nth-child(1) .ops-fund-rank { background: linear-gradient(135deg,#fde68a,#f59e0b); color:#7c2d12; box-shadow:0 4px 11px rgba(245,158,11,.4); }
.ops-fund-card:nth-child(2) .ops-fund-rank { background: linear-gradient(135deg,#e2e8f0,#94a3b8); color:#334155; box-shadow:0 4px 11px rgba(148,163,184,.4); }
.ops-fund-card:nth-child(3) .ops-fund-rank { background: linear-gradient(135deg,#fcd9b6,#d97706); color:#7c2d12; box-shadow:0 4px 11px rgba(217,119,6,.38); }
.ops-fund-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ops-fund-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ops-fund-name { font-weight: 700; color: #0f172a; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ops-fund-order {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-feature-settings: "tnum";
  font-weight: 800; color: #1e293b; font-size: 13.5px; white-space: nowrap;
}
.ops-fund-bar { height: 7px; border-radius: 999px; background: #eef1f6; overflow: hidden; }
.ops-fund-bar span {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg,#818cf8,#6366f1,#4f46e5);
  position: relative; transition: width .55s cubic-bezier(.22,1,.36,1);
}
.ops-fund-bar span::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  animation: opsFundShimmer 2.4s ease-in-out infinite;
}
@keyframes opsFundShimmer { 0%{transform:translateX(-100%)} 65%,100%{transform:translateX(220%)} }

/* ===== 告警明细弹窗表格 ===== */
.risk-detail-table { max-height: 320px; overflow-y: auto; border: 1px solid #e8edf4; border-radius: 8px; margin-bottom: 16px; }
.risk-detail-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.risk-detail-table thead { position: sticky; top: 0; z-index: 1; background: #f8fafc; }
.risk-detail-table th { padding: 8px 10px; text-align: left; font-weight: 700; color: #475569; white-space: nowrap; border-bottom: 1px solid #e2e8f0; }
.risk-detail-table td { padding: 8px 10px; color: #334155; border-bottom: 1px solid #f1f5f9; }
.risk-detail-table td.risk-detail-desc { color: #64748b; }
.risk-detail-table tbody tr:hover { background: #f8fafc; }

/* ===== 告警处理弹窗 ===== */
.risk-handle-card {
  border: 1px solid #e8edf4;
  border-radius: 12px;
  background: linear-gradient(135deg, #fbfcfe 0%, #f5f8fc 100%);
  padding: 16px 18px;
  margin-bottom: 18px;
}
.risk-handle-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}
.risk-handle-title {
  font-size: 16px;
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 6px;
}
.risk-handle-desc {
  font-size: 13px;
  color: #64748b;
  line-height: 1.6;
  margin-bottom: 12px;
}
.risk-handle-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 12px;
  color: #94a3b8;
}
.risk-handle-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.risk-handle-meta i {
  width: 13px;
  height: 13px;
}
.ops-form .ops-form-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ops-form .ops-form-row.full,
.ops-form .ops-form-row:nth-child(n+2) {
  grid-column: 1 / -1;
}
.ops-form .ops-form-row label {
  margin-bottom: 0;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
}
@media (max-width: 1280px) {
  .ops-filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ops-filter-actions { justify-content: flex-start; }
  .ops-kpi-grid,
  .ops-kpi-grid.six,
  .ops-kpi-grid.seven { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ops-compute-scale,
  .ops-util-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ops-cloud-combo,
  .ops-cloud-combo.wide { grid-template-columns: 240px minmax(0, 1fr); }
  .ops-cloud-combo.wide .ops-cloud-tabs { grid-template-columns: 1fr; }
  .ops-workorder-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ops-invoice-grid,
  .ops-order-metrics,
  .ops-order-summary,
  .ops-bill-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ops-order-metric-list { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .ops-board-grid { grid-template-columns: 1fr; }
  .ops-kpi-grid,
  .ops-kpi-grid.six,
  .ops-kpi-grid.seven { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ops-product-dual { grid-template-columns: 1fr; }
  .ops-compute-scale,
  .ops-util-grid,
  .ops-cloud-combo,
  .ops-cloud-combo.wide,
  .ops-donut-wrap { grid-template-columns: 1fr; }
  .ops-cloud-combo.wide .ops-cloud-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ops-city-combo-head,
  .ops-city-combo-row { grid-template-columns: 30px 78px repeat(3, minmax(92px, 1fr)); }
  .ops-workorder-grid,
  .ops-invoice-grid,
  .ops-order-metrics,
  .ops-order-summary,
  .ops-bill-summary { grid-template-columns: 1fr; }
  .ops-risk-card { flex-wrap: wrap; }
}

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
/* ===== 运营数据概览 · 动态增强 ===== */
@keyframes opsCardIn { from { opacity: 0; transform: translateY(26px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes opsBoardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes opsRiskPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, .45); } 50% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); } }
@keyframes opsSparkGrow { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
.ops-kpi-card { animation: opsCardIn .55s cubic-bezier(.22,1,.36,1) backwards; }
.ops-kpi-grid .ops-kpi-card:nth-child(1) { animation-delay: .05s; }
.ops-kpi-grid .ops-kpi-card:nth-child(2) { animation-delay: .13s; }
.ops-kpi-grid .ops-kpi-card:nth-child(3) { animation-delay: .21s; }
.ops-kpi-grid .ops-kpi-card:nth-child(4) { animation-delay: .29s; }
.ops-kpi-grid .ops-kpi-card:nth-child(5) { animation-delay: .37s; }
.ops-kpi-grid .ops-kpi-card:nth-child(6) { animation-delay: .45s; }
.ops-board { animation: opsBoardIn .6s cubic-bezier(.22,1,.36,1) backwards; }
.ops-board-grid .ops-board:nth-child(1) { animation-delay: .5s; }
.ops-board-grid .ops-board:nth-child(2) { animation-delay: .6s; }
.ops-board-grid .ops-board:nth-child(3) { animation-delay: .7s; }
.ops-kpi-card.warn { animation: opsCardIn .55s cubic-bezier(.22,1,.36,1) backwards, opsRiskPulse 2s ease-in-out infinite .8s; }
.ops-kpi-spark { position: absolute; right: 10px; bottom: 8px; width: 64px; height: 26px; z-index: 1; opacity: .6; pointer-events: none; }
.ops-kpi-spark polyline { stroke-dasharray: 120; animation: opsSparkGrow 1.2s ease forwards .6s; }
.ops-kpi-value { transition: text-shadow .3s ease; }
.ops-kpi-value.counting { text-shadow: 0 0 18px rgba(255,255,255,.9); }
.ops-board.full { grid-column: 1 / -1; }
/* ===== 资金收支趋势 · 图表与明细左右分栏 ===== */
.ops-board.split-left { grid-column: 1 / 2; }
.ops-board.split-right { grid-column: 2 / 3; }
/* equal-height split: stretch grid items, flex the bodies */
.ops-board-grid:has(.split-left) { align-items: stretch; }
.ops-board.split-left, .ops-board.split-right { min-height: 0; }
.ops-board.split-left .ops-board-body { padding: 16px 12px 18px 16px; }
.ops-board.split-left #opsTrendContainer { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.ops-board.split-left .ops-trend-wrap { flex: 1; display: flex; }
.ops-board.split-left .ops-trend-wrap > svg {
  width: 100%; height: 100%; min-height: 280px;
  border: 0; background: none; padding: 0; border-radius: 0;
  aspect-ratio: auto;
}
.ops-board.split-left .ops-chart-legend { flex-shrink: 0; }
/* 单站点右栏资金摘要：2x2 网格适配窄栏 */
.ops-board.split-right .ops-site-finance {
  border: 0;
}
.ops-board.split-right .ops-site-single {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 2px;
}
.ops-board.split-right .ops-site-single-card {
  padding: 16px;
  border-radius: 12px;
}
.ops-board.split-right .ops-site-single-card strong {
  font-size: 18px;
}
/* 单个站点（full 模式）图表限宽，避免满宽过高 */
.ops-board.full.site-only #opsTrendContainer { width: 90%; margin: 0 auto; }
.ops-board.full.site-only .ops-trend-wrap { background: transparent; }
.ops-board.full.site-only .ops-chart-legend { justify-content: center; margin-top: 12px; }
.ops-board.full.site-only .ops-trend-wrap > svg { height: 280px; width: 100%; }
.ops-board.full.city-single .ops-trend-wrap > svg { height: 280px; width: 100%; }
.ops-section-title {
  display: flex; align-items: center; gap: 6px;
  color: #334155; font-size: 13px; font-weight: 800;
  margin-bottom: 10px;
}
.ops-section-title i { width: 14px; height: 14px; color: #5b6cb8; }
/* ===== 订单与账单综合看板 · 柔和丰富色系 ===== */
.ops-order-mini {
  border: 1px solid transparent;
  position: relative;
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.ops-order-mini::after {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 10px 0 0 10px;
}
.ops-order-mini:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,23,42,.06); }
.ops-order-metric-list .ops-order-mini:nth-child(1) { background: #f0fdf4; border-color: #bbf7d0; }
.ops-order-metric-list .ops-order-mini:nth-child(1)::after { background: linear-gradient(180deg,#34d399,#10b981); }
.ops-order-metric-list .ops-order-mini:nth-child(1) strong { color: #047857; }
.ops-order-metric-list .ops-order-mini:nth-child(2) { background: #eef2ff; border-color: #c7d2fe; }
.ops-order-metric-list .ops-order-mini:nth-child(2)::after { background: linear-gradient(180deg,#818cf8,#6366f1); }
.ops-order-metric-list .ops-order-mini:nth-child(2) strong { color: #4338ca; }
.ops-order-metric-list .ops-order-mini:nth-child(3) { background: #fff1f2; border-color: #fecdd3; }
.ops-order-metric-list .ops-order-mini:nth-child(3)::after { background: linear-gradient(180deg,#fb7185,#f43f5e); }
.ops-order-metric-list .ops-order-mini:nth-child(3) strong { color: #be123c; }

.ops-bill-total, .ops-bill-card { position: relative; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.ops-bill-total::after, .ops-bill-card::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 10px 0 0 10px;
}
.ops-bill-total:hover, .ops-bill-card:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,23,42,.06); }
.ops-bill-summary .ops-bill-total:nth-child(1) { background: #f0f9ff; border-color: #bae6fd; }
.ops-bill-summary .ops-bill-total:nth-child(1)::after { background: linear-gradient(180deg,#38bdf8,#0ea5e9); }
.ops-bill-summary .ops-bill-total:nth-child(1) strong { color: #0369a1; }
.ops-bill-summary .ops-bill-total:nth-child(2) { background: #fffbeb; border-color: #fde68a; }
.ops-bill-summary .ops-bill-total:nth-child(2)::after { background: linear-gradient(180deg,#fbbf24,#f59e0b); }
.ops-bill-summary .ops-bill-total:nth-child(2) strong { color: #b45309; }
.ops-bill-summary .ops-bill-card:nth-child(3) { background: #fff1f2; border-color: #fecdd3; }
.ops-bill-summary .ops-bill-card:nth-child(3)::after { background: linear-gradient(180deg,#fb7185,#f43f5e); }
.ops-bill-summary .ops-bill-card:nth-child(3) strong { color: #be123c; }
.ops-bill-summary .ops-bill-card:nth-child(4) { background: #f0fdf4; border-color: #bbf7d0; }
.ops-bill-summary .ops-bill-card:nth-child(4)::after { background: linear-gradient(180deg,#34d399,#10b981); }
.ops-bill-summary .ops-bill-card:nth-child(4) strong { color: #047857; }

/* ===== 销售品看板 · 双列柔和主题 ===== */
.ops-list-caption {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  background: #f1f5f9;
  color: #475569;
  font-size: 12px; font-weight: 800;
  border: 1px solid #e2e8f0;
}
.ops-product-dual > div:nth-child(1) .ops-list-caption { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.ops-product-dual > div:nth-child(2) .ops-list-caption { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.ops-product-dual > div:nth-child(1) .ops-prod-bar span { background: linear-gradient(90deg,#a78bfa,#8b5cf6); }
.ops-product-dual > div:nth-child(2) .ops-prod-bar span { background: linear-gradient(90deg,#60a5fa,#3b82f6); }
.ops-product-dual > div:nth-child(1) .ops-rank-row:nth-child(-n+3) .idx { background: linear-gradient(135deg,#ede9fe,#ddd6fe); color: #6d28d9; }
.ops-product-dual > div:nth-child(2) .ops-rank-row:nth-child(-n+3) .idx { background: linear-gradient(135deg,#dbeafe,#bfdbfe); color: #1d4ed8; }

/* ===== 排名行 · 柔和左指示条 ===== */
.ops-rank-list .ops-rank-row { position: relative; }
.ops-rank-list .ops-rank-row::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
  border-radius: 999px;
  background: linear-gradient(180deg,#cbd5e1,#e2e8f0);
  opacity: .8;
}
.ops-rank-list .ops-rank-row:nth-child(1)::before { background: linear-gradient(180deg,#fbbf24,#f59e0b); }
.ops-rank-list .ops-rank-row:nth-child(2)::before { background: linear-gradient(180deg,#cbd5e1,#94a3b8); }
.ops-rank-list .ops-rank-row:nth-child(3)::before { background: linear-gradient(180deg,#fcd34d,#d97706); }
/* ===== 二次精修：渐变底、彩色辉光、进度条流光 ===== */
.ops-order-metric-list .ops-order-mini,
.ops-bill-summary .ops-bill-total,
.ops-bill-summary .ops-bill-card {
  border-width: 1px;
  background-blend-mode: normal;
}
.ops-order-metric-list .ops-order-mini:nth-child(1) { background: linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 60%,#f7fefa 100%); }
.ops-order-metric-list .ops-order-mini:nth-child(2) { background: linear-gradient(135deg,#eef2ff 0%,#f3f1ff 60%,#f8f7ff 100%); }
.ops-order-metric-list .ops-order-mini:nth-child(3) { background: linear-gradient(135deg,#fff1f2 0%,#fff5f6 60%,#fffafb 100%); }
.ops-bill-summary .ops-bill-total:nth-child(1) { background: linear-gradient(135deg,#f0f9ff 0%,#eff8ff 60%,#f7fbff 100%); }
.ops-bill-summary .ops-bill-total:nth-child(2) { background: linear-gradient(135deg,#fffbeb 0%,#fffaf0 60%,#fffdf5 100%); }
.ops-bill-summary .ops-bill-card:nth-child(3) { background: linear-gradient(135deg,#fff1f2 0%,#fff5f6 60%,#fffafb 100%); }
.ops-bill-summary .ops-bill-card:nth-child(4) { background: linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 60%,#f7fefa 100%); }

.ops-order-metric-list .ops-order-mini:nth-child(1):hover { box-shadow: 0 10px 22px rgba(16,185,129,.16); border-color:#6ee7b7; }
.ops-order-metric-list .ops-order-mini:nth-child(2):hover { box-shadow: 0 10px 22px rgba(99,102,241,.16); border-color:#a5b4fc; }
.ops-order-metric-list .ops-order-mini:nth-child(3):hover { box-shadow: 0 10px 22px rgba(244,63,94,.16); border-color:#fda4af; }
.ops-bill-summary .ops-bill-total:nth-child(1):hover { box-shadow: 0 10px 22px rgba(14,165,233,.16); border-color:#7dd3fc; }
.ops-bill-summary .ops-bill-total:nth-child(2):hover { box-shadow: 0 10px 22px rgba(245,158,11,.16); border-color:#fcd34d; }
.ops-bill-summary .ops-bill-card:nth-child(3):hover { box-shadow: 0 10px 22px rgba(244,63,94,.16); border-color:#fda4af; }
.ops-bill-summary .ops-bill-card:nth-child(4):hover { box-shadow: 0 10px 22px rgba(16,185,129,.16); border-color:#6ee7b7; }

.ops-order-mini strong,
.ops-bill-total strong,
.ops-bill-card strong,
.ops-rank-row .amt { font-feature-settings: "tnum"; letter-spacing: .3px; }

/* 进度条流光 */
.ops-prod-bar { height: 6px; border-radius: 999px; background: #eef1f6; }
.ops-prod-bar span { position: relative; overflow: hidden; }
.ops-prod-bar span::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  transform: translateX(-100%);
  animation: opsBarShimmer 2.6s ease-in-out infinite;
}
@keyframes opsBarShimmer { 0%{transform:translateX(-100%)} 60%,100%{transform:translateX(220%)} }

/* 前三名徽章 · 质感 */
.ops-rank-row .idx { box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
.ops-rank-list .ops-rank-row:nth-child(1) .idx { background: linear-gradient(135deg,#fde68a,#f59e0b); color:#7c2d12; box-shadow:0 3px 10px rgba(245,158,11,.4),inset 0 1px 0 rgba(255,255,255,.6); }
.ops-rank-list .ops-rank-row:nth-child(2) .idx { background: linear-gradient(135deg,#e2e8f0,#94a3b8); color:#334155; box-shadow:0 3px 10px rgba(148,163,184,.4),inset 0 1px 0 rgba(255,255,255,.6); }
.ops-rank-list .ops-rank-row:nth-child(3) .idx { background: linear-gradient(135deg,#fcd9b6,#d97706); color:#7c2d12; box-shadow:0 3px 10px rgba(217,119,6,.38),inset 0 1px 0 rgba(255,255,255,.6); }

/* 区块标题 · 渐变下划线 */
.ops-section-title { position: relative; }
.ops-section-title::after {
  content: ""; position: absolute; left: 0; bottom: -3px; height: 2px; width: 26px;
  border-radius: 999px; background: linear-gradient(90deg,#818cf8,#6366f1);
}

.ops-metric-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.ops-metric {
  padding: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  text-align: center;
}
.ops-metric span { display: block; color: #64748b; font-size: 12px; font-weight: 700; }
.ops-metric strong { display: block; margin-top: 6px; color: #0f172a; font-size: 17px; }


.panel-header {
  height: 44px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.panel-title { font-size: 13px; font-weight: 600; }
.panel-body { padding: 12px 14px; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.input, .select {
  height: 30px; border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 0 10px; font-size: 12px; background: #fff; color: var(--text);
  min-width: 160px; outline: none;
}
.input:focus, .select:focus { border-color: var(--primary); }
.search { position: relative; }
.search .input { padding-left: 28px; }
.search i, .search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); }

.table-wrap { overflow: auto; border-top: 1px solid var(--border); }
table.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th, .table td {
  padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table th { background: var(--panel-2); font-weight: 600; color: var(--text-2); position: sticky; top: 0; z-index: 1; }
.table tbody tr:hover { background: #fafbff; }
.table .actions { display: inline-flex; gap: 12px; align-items: center; }
.table .actions .link-btn {
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--primary); font-size: 12px; line-height: 1; height: auto;
  display: inline-flex; align-items: center; gap: 4px;
}
.table .actions .link-btn:hover { color: #1d3fbf; text-decoration: underline; }
.table .actions .link-btn.link-danger { color: var(--danger); }
.table .actions .link-btn.link-danger:hover { color: #a41818; }
.table .actions .link-btn[disabled] { color: var(--text-3); cursor: not-allowed; }
.table .actions .link-btn[disabled]:hover { text-decoration: none; }
.table .actions .divider { width: 1px; height: 12px; background: var(--border); }
.table .row-id { color: var(--text-3); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
#content .table-wrap > table.table th:last-child,
#content .table-wrap > table.table td:last-child {
  position: sticky;
  right: 0;
  box-shadow: -10px 0 16px rgba(15, 23, 42, 0.06);
}
#content .table-wrap > table.table th:last-child {
  z-index: 4;
  background: var(--panel-2);
}
#content .table-wrap > table.table td:last-child {
  z-index: 2;
  background: #fff;
}
#content .table-wrap > table.table tbody tr:hover td:last-child { background: #fafbff; }

/* 批量创建销售品·明细表 */
.batch-rows-table th, .batch-rows-table td { padding: 8px 10px; vertical-align: middle; white-space: normal; }
.batch-rows-table tbody tr:nth-child(even) { background: #fafbfc; }
.batch-rows-table .input { height: 30px; font-size: 12px; }
.batch-rows-table .row-stock,
.batch-rows-table .row-duration {
  padding: 0 6px;
  text-align: center;
  font-size: 11px;
}
.batch-rows-table .meta { line-height: 1.4; }

.empty { padding: 40px 0; text-align: center; color: var(--text-3); font-size: 12px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 8px; border-radius: 10px;
  font-size: 11px; line-height: 1; font-style: normal;
  background: #eef0f5; color: var(--text-2);
  border: 1px solid #e3e6ee;
}
.tag-primary { background: #ecf0ff; color: var(--primary); border-color: #d6deff; }

.product-push-mark {

.form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 4px; }
.field .required::after { content: "*"; color: var(--danger); margin-left: 2px; }
.field .hint { font-size: 11px; color: var(--text-3); }
.field .input, .field .select, .field textarea {

.field textarea { height: 72px; padding: 8px 10px; resize: vertical; font-family: inherit; }
.checkbox-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; user-select: none; }
.checkbox input { accent-color: var(--primary); }
.suffix-input { position: relative; display: flex; align-items: center; }
.suffix-input .input { padding-right: 38px; width: 100%; }

.modal-mask, .drawer-mask {
  position: fixed; inset: 0; background: rgba(15, 18, 32, 0.42);

}
.modal-mask.show, .drawer-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 16px; width: 640px; max-width: calc(100vw - 40px);

}
.modal-footer {

.modal-footer .btn {

  padding: 0 18px;

}

  background: #fff;
  border-color: #dbe3ef;
  color: #475569;
}
.modal-footer .btn-ghost:hover {
  border-color: #94a3b8;
  background: #f8fafc;
  color: #0f172a;
}
.modal-footer .btn-primary {
  box-shadow: 0 10px 22px rgba(46, 75, 232, 0.18);
}
.modal-title {

  gap: 10px;
  color: #0f172a;
  font-size: 16px;

}
.modal-title::before {
  content: "";

  border-radius: 999px;

}

  border-color: #e2e8f0;
  background: #fff;
  color: #64748b;
}
.modal-header .icon-btn:hover {
  border-color: #cbd5e1;
  background: #f8fafc;
  color: #0f172a;
}
.modal-body { padding: 16px; overflow: auto; }

.drawer-mask { justify-content: flex-end; }
.drawer {
  background: #fff; width: 520px; max-width: 92vw; height: 100vh;
  display: flex; flex-direction: column;
  box-shadow: -16px 0 40px rgba(20, 24, 40, 0.15);
}
.drawer-header {
  height: 52px; padding: 0 16px;

}
.drawer-title { font-size: 14px; font-weight: 600; }
.drawer-body { padding: 16px; overflow: auto; flex: 1; }
/* detail drawer styles */
.detail-section { margin-bottom: 16px; }
.detail-section-title {
  font-size: 12px; font-weight: 600; color: var(--text);
  padding-bottom: 6px; margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.kv-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px 16px;
}
.kv-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 4px 0;
}
.kv-key {
  font-size: 12px; color: var(--text-3);

}
.kv-val {
  font-size: 12.5px; color: var(--text);

}
.table.table-compact { font-size: 12px; }
.table.table-compact th { padding: 6px 8px; }
.table.table-compact td { padding: 6px 8px; }

.toast {
  position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
  background: #1f2330; color: #fff;
  padding: 8px 14px; border-radius: 6px;
  font-size: 12px; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
.toast.success { background: #136f3d; }
.toast.error { background: #b91c1c; }

.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 12px; }
.kv .k { color: var(--text-3); }
.kv .v { color: var(--text); word-break: break-all; }

.bundle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bundle-card {
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.pagination {
  display: flex; align-items: center; justify-content: space-between;

.pagination .pager { display: inline-flex; gap: 4px; }
.pagination .pager .btn { padding: 0 10px; height: 26px; }

#content .panel:has(> .pagination) {

#content .panel:has(> .pagination) > .table-wrap {

#content .panel:has(> .pagination) > .pagination {

  flex: 1 1 auto;

.btn-xs { height: 22px; padding: 0 6px; font-size: 11px; }

.provider-region-panel-head { height: 34px; padding: 0 12px; display:flex; align-items:center; justify-content:space-between; color:#64748b; font-size:12px; font-weight:800; border-bottom:1px solid #e2e8f0; background:#f8fafc; }

.ledger-resource-edit-card {

.ledger-resource-edit-head {

.ledger-resource-edit-title {

/* 规格管理 / 销售品管理 */
.commerce-page {

.commerce-breadcrumb,
.module-breadcrumb {

.module-topline {

/* 全链路追踪 */
.trace-page {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 10px 8px 24px;
}
.trace-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: end;
  padding: 18px;
  border: 1px solid #dbe7f6;
  border-radius: 16px;
  background: linear-gradient(135deg, #fff, #f5f9ff);
  box-shadow: 0 14px 32px rgba(15, 23, 42, .06);
}
.trace-title {
  color: #0f172a;
  font-size: 24px;
  font-weight: 900;
}
.trace-desc {
  margin-top: 8px;
  color: #64748b;
  font-size: 13px;
  line-height: 1.7;
}
.trace-search {
  display: flex;
  gap: 10px;
  align-items: center;
}
.trace-search .input {
  width: 320px;
  height: 38px;
}
.trace-date-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.trace-date-label {
  color: var(--text-2);
  font-size: 12px;
  font-weight: 700;
}
.trace-date-input {
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}
.trace-date-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(47, 84, 235, .12);
}
.trace-date-tip {
  color: var(--text-3);
  font-size: 12px;
  font-weight: 500;
}
.trace-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.trace-kpi {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border: 1px solid #dbe7f6;
  border-radius: 16px;
  background: linear-gradient(135deg, #f7faff, #fff);
  box-shadow: 0 10px 24px rgba(15,23,42,.04);
  overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
}
.trace-kpi:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 30px rgba(37,99,235,.1);
}
.trace-kpi::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg, #2563eb, #60a5fa);
}
.trace-kpi-icon {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: #e8f0fe;
  color: #2563eb;
  box-shadow: inset 0 0 0 1px rgba(37,99,235,.08);
}
.trace-kpi-icon i { width: 21px; height: 21px; }
.trace-kpi-text { min-width: 0; }
.trace-kpi-text span {
  display: block;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .02em;
}
.trace-kpi-text strong {
  display: block;
  margin-top: 5px;
  color: #1d4ed8;
  font-size: 22px;
  font-weight: 950;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.trace-kpi-text strong.trace-kpi-stage {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.6;
}
.trace-kpi-text small {
  display: block;
  margin-top: 4px;
  color: #94a3b8;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.trace-kpi.danger {
  border-color: #f9d4d4;
  background: linear-gradient(135deg, #fff8f8, #fff);
}
.trace-kpi.danger::after { background: linear-gradient(90deg, #dc2626, #f87171); }
.trace-kpi.danger .trace-kpi-icon { background: #fee2e2; color: #dc2626; box-shadow: inset 0 0 0 1px rgba(220,38,38,.08); }
.trace-kpi.danger .trace-kpi-text strong { color: #dc2626; }
.trace-kpi.danger:hover { box-shadow: 0 14px 30px rgba(220,38,38,.12); }
.trace-kpi.warning {
  border-color: #f7e3c4;
  background: linear-gradient(135deg, #fffcf4, #fff);
}
.trace-kpi.warning::after { background: linear-gradient(90deg, #d97706, #fbbf24); }
.trace-kpi.warning .trace-kpi-icon { background: #fef3c7; color: #d97706; box-shadow: inset 0 0 0 1px rgba(217,119,6,.1); }
.trace-kpi.warning .trace-kpi-text strong { color: #b45309; }
.trace-kpi.warning:hover { box-shadow: 0 14px 30px rgba(217,119,6,.12); }
.trace-board {
  border: 1px solid #dfe7f3;
  border-radius: 16px;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 12px 26px rgba(15,23,42,.05);
}
.trace-board-head {
  min-height: 52px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  row-gap: 10px;
  gap: 12px;
  border-bottom: 1px solid #e8eef7;
  background: linear-gradient(180deg, #f8fbff, #fff);
}
.trace-board-title {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #334155;
  font-size: 15px;
  font-weight: 900;
}
.trace-board-title i {
  width: 17px;
  height: 17px;
  color: #2563eb;
}
.trace-board-body {
  padding: 16px;
}
.trace-timeline {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
  position: relative;
}
.trace-step {
  position: relative;
  min-height: 150px;
  padding: 14px;
  border: 1px solid #dbe7f6;
  border-radius: 14px;
  background: linear-gradient(135deg, #fff, #f8fbff);
  cursor: pointer;
}
.trace-step::after {
  content: "";
  position: absolute;
  left: calc(100% + 1px);
  top: 42px;
  width: 14px;
  height: 2px;
  background: #bdd2f0;
}
.trace-step:last-child::after {
  display: none;
}
.trace-step.warn {
  border-color: #fecaca;
  background: linear-gradient(135deg, #fff, #fff7f7);
}
.trace-step.pending {
  border-color: #e5e7eb;
  background: #f8fafc;
  color: #94a3b8;
}
.trace-step.pending::after {
  background: #e2e8f0;
}
.trace-step.pending .trace-step-name,
.trace-step.pending .trace-step-meta,
.trace-step.pending .trace-flow {
  color: #94a3b8;
}
.trace-step-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.trace-step-name {
  color: #0f172a;
  font-size: 15px;
  font-weight: 950;
}
.trace-step-status {
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  background: #dcfce7;
  color: #15803d;
  font-size: 11px;
  font-weight: 900;
}
.trace-step.warn .trace-step-status {
  background: #fee2e2;
  color: #dc2626;
}
.trace-step.pending .trace-step-status {
  background: #e5e7eb;
  color: #64748b;
}
.trace-step-meta {
  margin-top: 12px;
  color: #64748b;
  font-size: 12px;
  line-height: 1.8;
  font-weight: 700;
}
.trace-step-reason {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: #fff1f2;
  color: #dc2626;
  font-size: 12px;
  line-height: 1.5;
  font-weight: 900;
}
.trace-step-flow {
  margin-top: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #eff6ff;
  color: #2563eb;
  font-size: 12px;
  font-weight: 900;
}
.trace-step.pending .trace-step-flow {
  background: #e5e7eb;
  color: #64748b;
}
.trace-step.warn .trace-step-flow {
  background: #fee2e2;
  color: #dc2626;
}
.trace-flow { display: none; }
.trace-timeline-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  row-gap: 10px;
  padding: 14px 20px;
  margin-bottom: 14px;
  border: 1px solid #dbe7f6;
  border-radius: 12px;
  background: linear-gradient(180deg, #f8fbff, #fff);
}
.trace-summary-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0 22px;
  border-left: 1px solid #e2e8f0;
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
  white-space: nowrap;
}
.trace-summary-item:first-child {
  border-left: none;
  padding-left: 0;
}
.trace-summary-item span {
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
  flex-shrink: 0;
}
.trace-summary-item strong {
  color: rgba(15, 23, 42, 0.75);
  font-size: 14px;
  font-weight: 950;
  overflow: hidden;
  text-overflow: ellipsis;
}
.trace-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 14px;
}
.trace-cascade {
  position: relative;
  display: grid;
  gap: 12px;
  padding: 14px;
  border: 1px solid #bfd7ff;
  border-radius: 18px;
  background: linear-gradient(180deg, #f8fbff 0%, #fff 100%);
  box-shadow: 0 12px 30px rgba(37, 99, 235, .08);
}
.trace-cascade-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #334155;
  font-size: 13px;
  font-weight: 900;
}
.trace-cascade .trace-step { cursor: default; }
.trace-cascade-head strong {
  color: #1d4ed8;
  font-size: 14px;
}
.trace-cascade .trace-board {
  position: relative;
  margin: 0;
  box-shadow: none;
}
.trace-cascade .trace-board + .trace-board::before {
  content: "";
  position: absolute;
  top: -13px;
  left: 34px;
  width: 2px;
  height: 13px;
  background: #bfdbfe;
}
.trace-step-index {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-right: 8px;
  border-radius: 999px;
  background: #eaf2ff;
  color: #2563eb;
  font-size: 12px;
  font-weight: 950;
}
.trace-tabs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.trace-tab {
  height: 36px;
  border: 1px solid #dbe7f6;
  border-radius: 10px;
  background: #fff;
  color: #64748b;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
}
.trace-tab.active {
  color: #2454d6;
  background: #edf4ff;
  border-color: #bdd2ff;
}
.trace-detail-table {
  width: 100%;
  border-collapse: collapse;
}
.trace-detail-table th,
.trace-detail-table td {
  padding: 11px 12px;
  border-bottom: 1px solid #edf1f7;
  text-align: left;
  color: #334155;
  font-size: 13px;
}
.trace-detail-table th {
  color: #64748b;
  background: #f8fafc;
  font-weight: 900;
}
.trace-alert-list,
.trace-audit-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.trace-alert,
.trace-audit {
  padding: 12px;
  border: 1px solid #e7ecf5;
  border-radius: 12px;
  background: #fff;
}
.trace-alert.open {
  border-color: #fecaca;
  background: #fff7f7;
}
.trace-alert strong,
.trace-audit strong {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #0f172a;
  font-size: 13px;
}
.trace-alert p,
.trace-audit p {
  margin: 7px 0 0;
  color: #64748b;
  font-size: 12px;
  line-height: 1.6;
}
.trace-reconcile {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}
.trace-reconcile-card {
  padding: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  background: #f8fbff;
}
.trace-reconcile-card span {
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}
.trace-reconcile-card strong {
  display: block;
  margin-top: 7px;
  color: #1d4ed8;
  font-size: 18px;
  font-weight: 950;
}
.trace-user-layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 14px;
}
.trace-user-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.trace-user-card {
  padding: 14px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  background: #fff;
  cursor: pointer;
}
.trace-user-card.active {
  border-color: #93c5fd;
  background: #f0f7ff;
  box-shadow: inset 3px 0 0 #2563eb;
}
.trace-user-card strong {
  display: block;
  color: #0f172a;
  font-size: 14px;
  font-weight: 950;
}
.trace-user-card span {
  display: block;
  margin-top: 5px;
  color: #64748b;
  font-size: 12px;
  font-weight: 800;
}
.trace-business-scroll {
  max-height: 286px;
  overflow: auto;
  border: 1px solid #edf1f7;
  border-radius: 16px;
  background: #fff;
}
.trace-business-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.trace-business-scroll::-webkit-scrollbar-track { background: #f8fafc; border-radius: 0 16px 16px 0; }
.trace-business-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #cbd5e1, #94a3b8);
  border-radius: 999px;
  border: 2px solid #f8fafc;
}
.trace-business-scroll::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #94a3b8, #64748b); }
/* 异常定位表格增强 */
.trace-business-table {
  width: 100%;
  min-width: 1180px;
  border-collapse: collapse;
}
.trace-business-table th {
  padding: 13px 14px;
  border-bottom: 1px solid var(--border-strong);
  color: var(--text-2);
  background: var(--panel-2);
  font-size: 12px;
  font-weight: 800;
  text-align: left;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
  letter-spacing: 0.02em;
}
.trace-business-table td {
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  font-size: 13px;
  text-align: left;
  white-space: nowrap;
  transition: background 0.15s ease;
}
.trace-business-table tbody tr {
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.trace-business-table tbody tr:nth-child(even) {
  background: #fafbfd;
}
.trace-business-table tbody tr:hover {
  background: #eef0f5 !important;
}
.trace-business-table tbody tr.active {
  background: var(--primary-soft) !important;
  box-shadow: inset 3px 0 0 var(--primary);
}
.trace-business-table tbody tr.severe {
  background: #fdf7f7 !important;
}
.trace-business-table tbody tr.severe td:first-child::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ef4444;
  margin-right: 8px;
  vertical-align: middle;
}
.trace-business-table th:last-child,
.trace-business-table td:last-child {
  position: sticky;
  right: 0;
  min-width: 96px;

.ops-ticket-hero {
  position: relative;
  overflow: hidden;

  border-radius: 16px;
  background: linear-gradient(135deg, #f8fbff 0%, #eef6ff 100%);
}
.ops-ticket-hero::after {
  content: "";
  position: absolute;
  right: -42px;
  top: -62px;
  width: 180px;
  height: 180px;
  border-radius: 999px;
  background: rgba(59, 130, 246, .08);
}
.ops-ticket-hero-main {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

}
.ops-ticket-hero-title {

}
.ops-ticket-hero-title strong {

.ops-ticket-hero-sub {

}
.ops-ticket-hero-metrics {

}
.ops-ticket-hero-metric {

}
.ops-ticket-hero-metric span {
  display: block;
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
}
.ops-ticket-hero-metric strong {
  display: block;
  margin-top: 4px;
  color: #0f172a;
  font-size: 13px;
  line-height: 1.4;
  word-break: break-all;
}
.ops-ticket-hero-metric strong.truncate {

  text-overflow: ellipsis;
  white-space: nowrap;
  word-break: normal;
}
.ops-ticket-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 16px 22px 8px;

  font-weight: 800;
}
.ops-ticket-section-title i {
  width: 16px;
  height: 16px;
  color: #2563eb;
}
.ops-detail .ticket-resource-table .table-wrap {

}
.ops-detail .ticket-resource-table .table {

}
.ops-detail .ticket-resource-table .table th {
  background: #f8fafc;
}
@media (max-width: 900px) {

  .ops-ticket-hero-metrics {
    grid-template-columns: 1fr;
  }
  .ops-ticket-hero-main {
    flex-direction: column;
  }
}
.ops-product-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ops-product-cell strong {
  line-height: 1.35;
}
.ops-org-cell {
  color: #64748b;
  line-height: 1.45;
}
.console-form,
.ops-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

}
.console-form::before,
.ops-form::before {

  display: none;
}
.console-form .field,
.ops-form .field {
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
}
.console-form .field.full,
.ops-form .field.full { grid-column: 1 / -1; }
.console-form .field label,
.ops-form .field label {

  font-size: 12px;

}
.console-form .input,
.console-form .select,
.console-form textarea,
.ops-form .input,
.ops-form .select,
.ops-form textarea {

}
.console-form .input,
.console-form .select,
.ops-form .input,
.ops-form .select { height: 38px; }
.console-form .input:focus,
.console-form .select:focus,
.console-form textarea:focus,
.ops-form .input:focus,
.ops-form .select:focus,
.ops-form textarea:focus {

.modal.console-modal,

.modal.console-modal .modal-title,
.modal.ops-modal .modal-title {

  font-weight: 800;
}
.modal.console-modal .modal-body,
.modal.ops-modal .modal-body { padding: 16px; }
.modal.console-modal .modal-footer,
.modal.ops-modal .modal-footer {

}
.console-binder {

  gap: 16px;
}
.console-binder-section {

}
.console-binder-head {

.console-binder-title {

}
.console-binder-table {

.console-binder-empty {

.drawer.console-drawer .drawer-header,
.drawer.ops-drawer .drawer-header {

}

.console-detail,
