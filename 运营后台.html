/* 资源开通页：完全复用 cloud-order.html 样式 */
#pvRoot{
  --pv-bg:#eef2f7;--pv-panel:#fff;--pv-ink:#1f2733;--pv-ink-2:#5a6678;--pv-ink-3:#8a94a6;
  --pv-line:#e4e9f0;--pv-line-2:#eef1f6;--pv-brand:#1677ff;--pv-brand-soft:#e8f1ff;
  --pv-brand-deep:#0e5fd8;--pv-warn:#ff7a18;--pv-ok:#12b886;--pv-danger:#fa5252;
  --pv-shadow:0 1px 2px rgba(16,32,64,.04),0 6px 24px rgba(16,32,64,.06);
  background:var(--pv-bg);min-height:100vh;padding:0 0 40px;
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--pv-ink);font-size:14px;line-height:1.55;
}
#pvRoot *{box-sizing:border-box}
#pvRoot .pv-wrap{max-width:1240px;margin:0 auto;padding:0 24px}
#pvRoot .pv-page-head{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 0 18px;flex-wrap:wrap;gap:12px}
#pvRoot .pv-page-head h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--pv-ink)}
#pvRoot .pv-page-head h1 i{width:22px;height:22px;color:var(--pv-brand)}
#pvRoot .pv-page-head .sub{color:var(--pv-ink-3);font-size:13px;margin-top:4px}
#pvRoot .pv-ghost-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--pv-line);border-radius:8px;background:#fff;color:var(--pv-ink-2);font-size:13px;font-weight:500;cursor:pointer}
#pvRoot .pv-ghost-btn:hover{border-color:var(--pv-brand);color:var(--pv-brand)}
#pvRoot .pv-ghost-btn i{width:15px;height:15px}
#pvRoot .pv-ticket-strip{background:linear-gradient(135deg,#fafcff 0%,#f5f8fe 100%);border:1px solid var(--pv-line);border-radius:12px;box-shadow:var(--pv-shadow);margin-bottom:16px;overflow:hidden}
#pvRoot .pv-ticket-strip .strip-head{height:46px;padding:0 20px;border-bottom:1px solid var(--pv-line-2);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(90deg,#e8f1ff,#f5f8fe)}
#pvRoot .pv-ticket-strip .strip-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--pv-brand-deep)}
#pvRoot .pv-ticket-strip .strip-title i{width:16px;height:16px;color:var(--pv-brand)}
#pvRoot .pv-ticket-strip .strip-body{padding:16px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px}
#pvRoot .pv-ticket-item{display:flex;flex-direction:column;gap:5px}
#pvRoot .pv-ticket-item .pv-ticket-k{color:var(--pv-ink-3);font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.3px}
#pvRoot .pv-ticket-item .pv-ticket-k i{width:13px;height:13px;color:var(--pv-brand);opacity:.7}
#pvRoot .pv-ticket-item .pv-ticket-v{font-size:13.5px;font-weight:600;color:var(--pv-ink);word-break:break-all;line-height:1.4}
#pvRoot .pv-ticket-item .pv-ticket-v.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
#pvRoot .pv-ticket-item .pv-ticket-v.accent{color:var(--pv-brand-deep)}
#pvRoot .pv-ticket-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--pv-brand-soft);color:var(--pv-brand-deep)}
#pvRoot .pv-ticket-tag i{width:13px;height:13px}
#pvRoot .pv-tag-blue{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;background:var(--pv-brand-soft);color:var(--pv-brand-deep);font-size:12px;font-weight:600}
#pvRoot .pv-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
#pvRoot .pv-config{display:flex;flex-direction:column;gap:14px;min-width:0}
#pvRoot .pv-card{background:#fff;border:1px solid var(--pv-line);border-radius:10px;box-shadow:var(--pv-shadow);overflow:hidden}
#pvRoot .pv-card-head{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--pv-line-2)}
#pvRoot .pv-step-num{width:22px;height:22px;border-radius:50%;background:var(--pv-brand-soft);color:var(--pv-brand);font-size:12.5px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
#pvRoot .pv-card-head h2{font-size:15px;font-weight:600;color:var(--pv-ink);margin:0}
#pvRoot .pv-card-head .pv-tip{color:var(--pv-ink-3);font-size:12.5px;margin-left:4px}
#pvRoot .pv-card-head .pv-right{margin-left:auto;color:var(--pv-ink-3);font-size:12.5px;display:flex;align-items:center;gap:6px}
#pvRoot .pv-card-head .pv-right b{color:var(--pv-ink);font-weight:600;margin-left:3px}
#pvRoot .pv-card-body{padding:16px 18px}
#pvRoot .pv-row{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px dashed var(--pv-line-2)}
#pvRoot .pv-row:last-child{border-bottom:none}
#pvRoot .pv-row .pv-label{width:96px;flex-shrink:0;color:var(--pv-ink-2);font-size:13.5px;padding-top:6px;font-weight:500}
#pvRoot .pv-row .pv-label .pv-req{color:var(--pv-danger);margin-right:3px}
#pvRoot .pv-row .pv-control{flex:1;min-width:0}
#pvRoot .pv-field-note{color:var(--pv-ink-3);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px}
#pvRoot .pv-field-note i{width:9px;height:9px;flex:0 0 auto}
#pvRoot .pv-seg{display:inline-flex;background:var(--pv-line-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
#pvRoot .pv-seg button{padding:7px 16px;border-radius:7px;font-size:13px;color:var(--pv-ink-2);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer}
#pvRoot .pv-seg button:hover{color:var(--pv-ink)}
#pvRoot .pv-seg button.active{background:#fff;color:var(--pv-brand);box-shadow:0 1px 3px rgba(16,32,64,.08);font-weight:600}
#pvRoot .pv-chips{display:flex;flex-wrap:wrap;gap:7px}
#pvRoot .pv-chip{padding:6px 12px;border:1px solid var(--pv-line);border-radius:7px;font-size:13px;color:var(--pv-ink-2);background:#fff;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer}
#pvRoot .pv-chip:hover{border-color:#b6c8df;color:var(--pv-ink)}

#pvRoot .pv-input-text{width:100%;max-width:360px;padding:8px 12px;border:1px solid var(--pv-line);border-radius:8px;font-size:13px;outline:none;background:#fff;color:var(--pv-ink)}
#pvRoot .pv-input-text:focus{border-color:var(--pv-brand)}
#pvRoot .pv-select{padding:8px 12px;border:1px solid var(--pv-line);border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer;color:var(--pv-ink)}
#pvRoot .pv-select:focus{border-color:var(--pv-brand)}
#pvRoot .pv-select-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#pvRoot .pv-select-line select{flex:1;min-width:180px;max-width:400px;padding:8px 12px;border:1px solid var(--pv-line);border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer;color:var(--pv-ink)}
#pvRoot .pv-select-line select:focus{border-color:var(--pv-brand)}
#pvRoot .pv-link-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border:1px dashed var(--pv-line);border-radius:8px;color:var(--pv-brand);background:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer}
#pvRoot .pv-link-btn:hover{border-color:var(--pv-brand);background:var(--pv-brand-soft)}

#pvRoot .pv-sg-picker{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
#pvRoot .pv-sg-tags{display:flex;flex-direction:column;gap:6px;width:100%}

/* ===== 算力数据概览 ===== */
.compute-data-page {
  gap: 12px;
  padding-top: 0;
}
.compute-data-page .ops-overview-desc {
  max-width: 760px;
  margin-top: 6px;
}
.compute-data-page .ops-kpi-grid.compute-five {
  grid-template-columns: repeat(5, minmax(150px, 1fr));
}
.compute-kpi-section {
  padding: 0;
  border: 1px solid #e5edf8;
  border-radius: 16px;
  background: rgba(255,255,255,.72);
  box-shadow: 0 10px 26px rgba(15, 23, 42, .05);
  overflow: hidden;
}
.compute-kpi-section + .compute-kpi-section {
  margin-top: 12px;
}
.compute-kpi-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 48px;
  margin: 0;
  padding: 0 16px;
  border-bottom: 1px solid #edf2f7;
  background: linear-gradient(180deg, rgba(248,251,255,.94), rgba(244,248,255,.8));
  color: #26364f;
  font-size: 15px;
  font-weight: 900;
}
.compute-kpi-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
}
.compute-kpi-section-head i,
.compute-kpi-section-head svg {
  width: 18px;
  height: 18px;
  color: #2563eb;
}
.compute-kpi-section .ops-kpi-grid {
  padding: 14px;
}
.compute-kpi-section.resource .ops-kpi-card {
  min-height: 108px;
  padding: 14px 16px;
  border-radius: 14px;
}
.compute-kpi-section.resource .ops-kpi-card::after {
  width: 92px;
  height: 92px;
  top: -30px;
  right: -22px;
}
.compute-kpi-section.resource .ops-kpi-value {
  margin-top: 9px;
  font-size: 20px;
}
.compute-kpi-section.resource .ops-kpi-sub {
  margin-top: 4px;
}
.compute-kpi-section.ops {
  background:
    linear-gradient(135deg, rgba(255,255,255,.94), rgba(248,251,255,.9)),
    radial-gradient(circle at 94% 12%, rgba(59,130,246,.12), transparent 28%);
}
.compute-kpi-section.ops .compute-kpi-section-head {
  background: rgba(248,251,255,.86);
}
.compute-ops-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 0;
}
.compute-ops-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 112px;
  padding: 16px 18px 15px;
  border-right: 1px solid #edf2f7;
  background: rgba(255,255,255,.62);
}
.compute-ops-tile:last-child {
  border-right: 0;
}
.compute-ops-tile::before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  bottom: 18px;
  width: 3px;
  border-radius: 999px;
  background: linear-gradient(180deg, #60a5fa, #2dd4bf);
  opacity: .88;
}
.compute-ops-tile:nth-child(2)::before {
  background: linear-gradient(180deg, #fb923c, #facc15);
}
.compute-ops-tile:nth-child(3)::before {
  background: linear-gradient(180deg, #8b5cf6, #60a5fa);
}
.compute-ops-tile:nth-child(4)::before {
  background: linear-gradient(180deg, #14b8a6, #22c55e);

// ===== 工具：DOM / 存储 / 通用渲染 =====
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const Store = {
  load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  save(key, value) { localStorage.setItem(key, JSON.stringify(value)); },
};

// 数据结构升级时提升此版本号即可丢弃旧的本地缓存，避免老字段污染新表单。
const SCHEMA_VERSION = "2026-07-15-v02";
if (typeof localStorage !== "undefined" && localStorage.getItem("scn.schemaVersion") !== SCHEMA_VERSION) {
  ["scn.systemDisk", "scn.dataDisk", "scn.bandwidth", "scn.compute", "scn.product", "scn.productTemplate", "scn.productStockRequest", "scn.deviceInventory", "scn.provider", "scn.ticket", "scn.vpc", "scn.subnet", "scn.securityGroup", "scn.cloudDisk", "scn.computeInstance", "scn.ledger", "scn.billing"].forEach(k => localStorage.removeItem(k));
  localStorage.setItem("scn.schemaVersion", SCHEMA_VERSION);
}

const uid = (prefix = "") => prefix + Math.random().toString(36).slice(2, 9);
const nowStr = () => new Date().toISOString().slice(0, 19).replace("T", " ");

const LEDGER_PRODUCT_OPTIONS = [
  { value: "910C", label: "910C", monthlyPrice: 4800 },

];
const RENEW_PERIOD_OPTIONS = [

const PRODUCT_SHAPE_CODE = { "裸金属": "BM", "容器": "CON", "云主机": "VM", "GPU云主机": "VM" };

  "4090": "NG49",

};

// 当前登录运营（演示用，直接读取顶栏；后端实际由会话提供）
const getCurrentOperator = () => {
  if (typeof document === "undefined") return "运营管理员";
  const el = document.querySelector(".user-name");
  return (el && el.textContent.trim()) || "运营管理员";
};
// 创建人脱敏：中文姓 + *；英文/数字保留首位
const maskCreator = (name) => {
  const s = String(name || "");
  if (!s) return "—";
  if (/^[\u4e00-\u9fa5]+$/.test(s)) {
    return s.length === 1 ? s : s[0] + "*".repeat(Math.max(1, s.length - 1));
  }
  return s[0] + "*".repeat(Math.max(1, s.length - 1));
};
const escapeHtml = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function toast(msg, kind = "") {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + kind;
  setTimeout(() => { t.className = "toast"; }, 1800);
}

function statusTag(status) {
  const map = {
    active: ["已上架", "tag-success"],
    pending: ["待发布", "tag-warning"],
    inactive: ["已下架", "tag-muted"],
    reviewing: ["审核中", "tag-primary"],
  };
  const [text, cls] = map[status] || ["未知", "tag-muted"];
  return `<span class="tag ${cls}">${text}</span>`;
}

function listedTag(listed) {
  return listed
    ? `<span class="tag tag-success">已上架</span>`
    : `<span class="tag tag-muted">未上架</span>`;
}

function normalizeGpuModelText(value) {
  return String(value || "").toUpperCase().replace(/NVIDIA|GEFORCE|显卡|GPU/g, " ").replace(/\s+/g, " ").trim();
}
function deriveGpuPublicCode(model, originType = "foreign") {
  const raw = String(model || "").trim();
  const normalized = normalizeGpuModelText(raw);
  if (!raw) return "";
  if (originType === "domestic") {

}

  function paintAreaOptions() {
    const provinces = Array.from(new Set(portalRows.map(p => p.province))).filter(Boolean);
    areaFilters.querySelector(".portal-province").innerHTML = optionsHtml(provinces, "全部省份");

    areaFilters.querySelector(".portal-city").innerHTML = optionsHtml(cities, "全部城市");
    areaFilters.querySelector(".portal-city").value = areaState.city;
    const districtRows = areaState.city ? cityRows.filter(p => p.city === areaState.city) : cityRows;
    const districts = Array.from(new Set(districtRows.map(p => p.district))).filter(Boolean);
    areaFilters.querySelector(".portal-district").innerHTML = optionsHtml(districts, "全部区县");
    areaFilters.querySelector(".portal-district").value = areaState.district;
  }
  function paint() {
    const kw = (toolbar.querySelector(".portal-search").value || "").trim().toLowerCase();
    listBox.innerHTML = "";
    const visible = portalRows.filter(p => {
      if (areaState.province && p.province !== areaState.province) return false;

      </label>`);
      lab.querySelector("input").addEventListener("change", (e) => {

      });
      listBox.appendChild(lab);
    });
    if (window.lucide) window.lucide.createIcons();
  }
  areaFilters.querySelector(".portal-province").addEventListener("change", e => {

    areaState.city = "";
    areaState.district = "";
    paintAreaOptions();
    paint();
  });
  areaFilters.querySelector(".portal-city").addEventListener("change", e => {
    areaState.city = e.target.value;
    areaState.district = "";
    paintAreaOptions();
    paint();
  });
  areaFilters.querySelector(".portal-district").addEventListener("change", e => {
    areaState.district = e.target.value;
    paint();
  });
  toolbar.querySelector(".portal-search").addEventListener("input", paint);
  toolbar.querySelector(".portal-all").addEventListener("click", () => {

    toolbar.querySelector(".portal-count").textContent = `已选 ${sel.size} 个`;
  });
  paintAreaOptions();
  wrap.appendChild(areaFilters);
  wrap.appendChild(toolbar);
  wrap.appendChild(listBox);
  // 暴露给外部读取
  wrap.getSelected = () => Array.from(sel);
  paint();
  return wrap;
}

function getProductChargeModes(p) {
  const specs = [];

function renderComputeSpecText(compute, opts = {}) {

function resolveProductComputes(product) {

function genSpecCode(type) {
  const prefixMap = {
    systemDisk: "SYS", dataDisk: "DATA", cloudDisk: "CDS", storage: "STOR", bandwidth: "BW", compute: "CVM",
    product: "PKG", productTemplate: "PT", provider: "PV"
  };

  const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
  return `${prefix}-${rand}`;
}

  const prefix = el.dataset.prefix || "";
  const suffix = el.dataset.suffix || "";
  const decimals = parseInt(el.dataset.decimals || "0", 10);

  el.classList.add("counting");
  function frame(now) {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = target * eased;
    el.textContent = prefix + val.toLocaleString("zh-CN", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix;
    if (p < 1) requestAnimationFrame(frame);
    else { el.textContent = prefix + target.toLocaleString("zh-CN", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }) + suffix; el.classList.remove("counting"); }

  const ringLooksMainland = ring => {
    const pts = (ring || []).filter(p => Array.isArray(p) && Number.isFinite(Number(p[0])) && Number.isFinite(Number(p[1])));
    if (!pts.length) return false;
    const lngs = pts.map(p => Number(p[0]));
    const lats = pts.map(p => Number(p[1]));
    const minLat = Math.min(...lats);
    const maxLat = Math.max(...lats);
    const minLng = Math.min(...lngs);
    const maxLng = Math.max(...lngs);
    if (maxLat < 18) return false;
    if (minLng > 105 && maxLng < 125 && maxLat < 24) return false;
    return true;
  };
  const clipMainlandGeometry = geometry => {
    if (!geometry) return geometry;
    if (geometry.type === "Polygon") {
      const coordinates = (geometry.coordinates || []).filter(ringLooksMainland);
      return coordinates.length ? { ...geometry, coordinates } : null;
    }
    if (geometry.type === "MultiPolygon") {
      const coordinates = (geometry.coordinates || []).map(poly => (poly || []).filter(ringLooksMainland)).filter(poly => poly.length);
      return coordinates.length ? { ...geometry, coordinates } : null;
    }
    return geometry;

        }
      }));
      const maxValue = Math.max(1, ...rows.map(r => r[2]));
      computeGeoChart.setOption({
        tooltip: {
          trigger: "item",
          confine: true,
          backgroundColor: "rgba(255,255,255,.96)",
          borderColor: "#dbe8fb",
          borderWidth: 1,
          padding: 0,
          extraCssText: "border-radius:12px;box-shadow:0 12px 28px rgba(15,23,42,.14);overflow:hidden;",
          formatter: p => {
            const d = p.data || {};
            const tags = (d.cardTypes || []).slice(0, 4).map(v => `<span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#edf4ff;color:#2454d6;font-size:10px;font-weight:900;">${escapeHtml(v)}</span>`).join("");
            const more = (d.cardTypes || []).length > 4 ? `<span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:10px;font-weight:900;">+${(d.cardTypes || []).length - 4}</span>` : "";
            return `<div style="min-width:200px;padding:10px 11px 11px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:13px;margin-bottom:8px;">
                <strong style="color:#1e293b;font-size:13px;">${escapeHtml(shortName(p.name))}</strong>
                <span style="color:#2454d6;font-size:14px;font-weight:900;">${d.pflops || 0} PFLOPS</span>

const Modal = {
  open({ title, body, onConfirm, confirmText = "确定", showFooter = true, wide = false }) {
    $("#modalTitle").textContent = title;
    $("#modalBody").innerHTML = "";
    $("#modalBody").appendChild(body);
    $("#modalMask .modal").classList.remove("ledger-modal", "commerce-modal", "console-modal", "ops-modal");
    if (body.matches?.(".ledger-form-shell") || body.querySelector?.(".ledger-form-shell")) $("#modalMask .modal").classList.add("ledger-modal");
    if (body.matches?.(".commerce-form") || body.querySelector?.(".commerce-form") || body.matches?.(".commerce-batch-form") || body.querySelector?.(".commerce-batch-form")) $("#modalMask .modal").classList.add("commerce-modal");
    if (body.matches?.(".console-form") || body.querySelector?.(".console-form") || body.matches?.(".console-binder") || body.querySelector?.(".console-binder") || body.matches?.(".net-form-shell") || body.querySelector?.(".net-form-shell")) $("#modalMask .modal").classList.add("console-modal");
    if (body.matches?.(".ops-form") || body.querySelector?.(".ops-form") || body.matches?.(".ops-detail") || body.querySelector?.(".ops-detail")) $("#modalMask .modal").classList.add("ops-modal");
    $("#modalConfirm").textContent = confirmText;
    $("#modalConfirm").className = "btn btn-primary";
    $("#modalConfirm").style.opacity = "";
    $("#modalConfirm").style.boxShadow = "";
    $("#modalConfirm").style.display = showFooter ? "" : "none";
    $("#modalCancel").textContent = "取消";
    $("#modalCancel").style.display = showFooter ? "" : "none";
    $("#modalMask").classList.add("show");
    if (wide) $("#modalMask .modal").style.width = "800px";
    else $("#modalMask .modal").style.width = "";
    Modal._onConfirm = onConfirm;
    if (window.lucide) window.lucide.createIcons();
  },
  close() {
    $("#modalMask").classList.remove("show");
    Modal._onConfirm = null;
  },
};
$("#modalClose").addEventListener("click", () => Modal.close());
$("#modalCancel").addEventListener("click", () => Modal.close());
$("#modalConfirm").addEventListener("click", () => {
  if (Modal._onConfirm) { const ok = Modal._onConfirm(); if (ok !== false) Modal.close(); }
});
$("#modalMask").addEventListener("click", (e) => { if (e.target === $("#modalMask")) Modal.close(); });

// ===== 表单构造工具 =====
function el(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}
function fieldWrap(labelText, control, opts = {}) {
  const wrap = el(`<div class="field ${opts.full ? "full" : ""}"></div>`);
  if (labelText) {
    const lab = el(`<label class="${opts.required ? "required" : ""}">${escapeHtml(labelText)}</label>`);
    wrap.appendChild(lab);
  }
  wrap.appendChild(control);
  if (opts.hint) wrap.appendChild(el(`<div class="hint">${escapeHtml(opts.hint)}</div>`));
  return wrap;
}

      { key: "_region", title: "地域", width: "120", render: r => { const p = State.provider.find(x => x.id === r.providerId); return p ? escapeHtml(p.region) : '<span class="tag tag-muted">-</span>'; } },

};

function renderSpecList(kind) {
  const schema = SpecSchema[kind];
  State.filters[kind] = State.filters[kind] || {};

  const html = `<div class="commerce-page">
    <div class="commerce-breadcrumb"><i data-lucide="map-pin"></i><span>规格管理</span><span class="separator">›</span><span class="current">${schema.label}</span></div>
    ${kind === "compute" ? renderSaleCodeRulePanel() : ""}
    <div class="panel commerce-panel"><div class="toolbar commerce-toolbar">
      <div class="toolbar-left">
        <div class="search"><i data-lucide="search"></i><input class="input" id="searchInput" placeholder="搜索编码/名称" /></div>
        <select class="select" id="filterListed"><option value="">全部上架状态</option><option value="1">已上架</option><option value="0">未上架</option></select>
      </div>
      <div class="toolbar-action-split">
        <div class="toolbar-action-group">${kind === "storage" ? '<button class="btn" id="btnExportStorageSpec">导出</button>' : ""}<button class="btn btn-primary" id="btnCreate">新增</button></div>
      <div class="toolbar-right filter-actions" style="grid-column:auto;">
        <span class="tag tag-muted" id="rowCount">共 0 条</span>
        <button class="btn btn-primary" id="specQuery">查询</button>
        <button class="btn" id="specReset">重置</button>
        <button class="btn refresh-only" id="specRefresh" title="刷新"><i data-lucide="refresh-cw"></i></button>
      </div>
      </div>
    </div>
    <div class="table-wrap commerce-table-wrap">
      <table class="table commerce-table" style="${kind === "compute" ? "min-width:1560px;" : kind === "storage" ? "min-width:1480px;" : ""}">
        <thead><tr>${schema.columns.map(c => `<th style="${c.width ? "width:" + c.width + "px" : ""}">${c.title}</th>`).join("")}<th style="width:200px">操作</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="specPager"></div>
    </div>
  </div>`;
  $("#content").innerHTML = html;
  if (kind === "compute") bindSaleCodeRulePanel($("#content"));

  let specPage = State.filters[kind].page || 1;
  const specPageSize = 10;
  const renderRows = () => {
    let rows = State[kind].slice();
    const kw = $("#searchInput").value.toLowerCase();
    if (kw) rows = rows.filter(r => {
      const provider = State.provider.find(p => p.id === r.providerId);
      return [r.code, r.name, r.fileSystemType, r.storageType, r.clusterId, r.regionId, r.zoneId, provider?.name, provider?.region].join(" ").toLowerCase().includes(kw);
    });
    const lf = $("#filterListed").value;
    if (lf !== "") rows = rows.filter(r => (lf === "1" ? !!r.listed : !r.listed));
    $("#rowCount").textContent = `共 ${rows.length} 条`;
    if (rows.length === 0) {
      $("#tableBody").innerHTML = `<tr><td colspan="${schema.columns.length + 1}"><div class="empty">暂无数据</div></td></tr>`;
      $("#specPager").innerHTML = `<span>共 0 条</span><span></span>`;
      return;
    }
    const total = rows.length;
    const pageCount = Math.max(1, Math.ceil(total / specPageSize));
    specPage = Math.min(Math.max(1, specPage), pageCount);
    State.filters[kind].page = specPage;
    const pageRows = rows.slice((specPage - 1) * specPageSize, specPage * specPageSize);
    $("#tableBody").innerHTML = pageRows.map(r => {
      const mainRow = `<tr data-id="${r.id}">
      ${schema.columns.map(c => `<td>${c.render ? c.render(r, kind) : escapeHtml(r[c.key])}</td>`).join("")}
      <td><div class="actions">
        <button class="link-btn" data-act="toggleListed">${r.listed ? "下架" : "上架"}</button>
        ${!r.listed ? `<span class="divider"></span><button class="link-btn" data-act="edit">编辑</button><span class="divider"></span><button class="link-btn link-danger" data-act="del">删除</button>` : ""}
      </div></td></tr>`;
      return mainRow;
    }).join("");
    $("#specPager").innerHTML = `
      <span>共 ${total} 条，每页 ${specPageSize} 条，第 ${specPage} / ${pageCount} 页</span>
      <span class="pager">
        <button class="btn" data-page="prev" ${specPage <= 1 ? "disabled" : ""}>上一页</button>
        <button class="btn" data-page="next" ${specPage >= pageCount ? "disabled" : ""}>下一页</button>
      </span>`;
    if (window.lucide) window.lucide.createIcons();
  };

  $("#searchInput").addEventListener("input", () => { specPage = 1; renderRows(); });
  $("#filterListed").addEventListener("change", () => { specPage = 1; renderRows(); });
  $("#btnCreate").addEventListener("click", () => openSpecForm(kind, null));
  $("#btnExportStorageSpec")?.addEventListener("click", () => toast("已生成存储服务规格导出任务", "success"));
  $("#specQuery").addEventListener("click", () => { specPage = 1; renderRows(); });
  $("#specReset").addEventListener("click", () => {
    $("#searchInput").value = "";
    $("#filterListed").value = "";
    specPage = 1;
    renderRows();
  });
  $("#specRefresh").addEventListener("click", () => renderRows());
  $("#specPager").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-page]");
    if (!btn || btn.disabled) return;
    specPage += btn.dataset.page === "next" ? 1 : -1;
    renderRows();
  });
  
  $("#tableBody").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const tr = e.target.closest("tr");
    const id = tr.dataset.id;
    const item = State[kind].find(x => x.id === id);
    if (!item) return;
    if (btn.dataset.act === "view") {
      openSpecDetail(kind, item);
    }
    if (btn.dataset.act === "edit" && !item.listed) openSpecForm(kind, item);
    if (btn.dataset.act === "del" && !item.listed) {
      if (!confirm("确认删除？")) return;
      State[kind] = State[kind].filter(x => x.id !== id);
      persist(kind);
      renderRows();
      toast("已删除", "success");
    }
    if (btn.dataset.act === "toggleListed") {
      item.listed = !item.listed;
      item.updatedAt = nowStr();
      persist(kind);
      renderRows();
      toast(item.listed ? "已上架" : "已下架", "success");
    }
  });
  renderRows();
  if (State._ticketDetailId) {
    const detailTicket = State.ticket.find(x => x.id === State._ticketDetailId);
    State._ticketDetailId = "";
    if (detailTicket) openTicketDetail(detailTicket);
  }
}

function getSpecDetailKv(kind, item) {
  const schema = SpecSchema[kind];
  const provider = State.provider.find(p => p.id === item.providerId);
  const kv = [];
  schema.columns.forEach(c => {
    if (c.key === "listed" || c.key === "createdBy") return;
    if (c.key === "_provider" || c.key === "_region" || c.key === "updatedAt" || c.key === "updatedBy") return;
    kv.push({ k: c.title, v: c.render ? c.render(item, kind) : String(item[c.key] ?? "") });
  });
  const unitOn = specPriceUnit(kind, "onDemand");
  const unitMo = specPriceUnit(kind, "monthly");
  const unitTag = (u) => u ? `<span style="color:#999;font-size:11px;margin-left:4px;">${u}</span>` : "";
  if (Array.isArray(item.chargeModes) && item.chargeModes.includes("onDemand")) {
    kv.push({ k: "按量 · 地市结算价", v: fmtMoney(item.onDemandCity) + unitTag(unitOn) });
    kv.push({ k: "按量 · 生态结算价", v: fmtMoney(item.onDemandEco) + unitTag(unitOn) });
  }
  if (Array.isArray(item.chargeModes) && item.chargeModes.includes("monthly")) {
    kv.push({ k: "包周期 · 地市结算价", v: fmtMoney(item.monthlyCity) + unitTag(unitMo) });
    kv.push({ k: "包周期 · 生态结算价", v: fmtMoney(item.monthlyEco) + unitTag(unitMo) });
  }
  kv.push({ k: "服务商", v: provider ? `${escapeHtml(provider.name)} · ${escapeHtml(provider.region)}` : "未绑定" });
  if (kind === "bandwidth" && item.tierEnabled && Array.isArray(item.tierPricing) && item.tierPricing.length) {
    const tierHtml = `<table class="table" style="margin-top:4px;"><thead><tr><th>起(Mbps)</th><th>止(Mbps)</th><th>地市结算价</th><th>生态结算价</th></tr></thead><tbody>${item.tierPricing.map(t => `<tr><td>${t.start}</td><td>${t.end}</td><td>${fmtMoney(t.cityPrice)}</td><td>${fmtMoney(t.ecoPrice)}</td></tr>`).join("")}</tbody></table>`;
    kv.push({ k: "阶梯定价", v: tierHtml });
  }
  kv.push({ k: "备注", v: item.remark || "无" });
  kv.push({ k: "创建人", v: escapeHtml(maskCreator(item.createdBy)) });
  kv.push({ k: "更新时间", v: item.updatedAt || "—" });
  return { kv, provider };
}

function renderSpecInlineDetail(kind, item) {
  const detail = getSpecDetailKv(kind, item);
  return `<div class="spec-inline-detail">
    <div class="spec-inline-detail-head">
      <strong>${escapeHtml(item.name || "")}</strong>
      <span>${escapeHtml(item.code || "")}${detail.provider ? " · " + escapeHtml(detail.provider.name) : ""}</span>
    </div>
    <div class="kv">${detail.kv.map(x => `<div class="k">${escapeHtml(x.k)}</div><div class="v">${x.v}</div>`).join("")}</div>
  </div>`;
}

    form.appendChild(fieldWrap("IP 版本", el(`<select class="select" name="ipVersion">${["IPv4", "IPv6", "IPv4 / IPv6"].map(o=>`<option ${o===data.ipVersion?"selected":""}>${o}</option>`).join("")}</select>`)));
    form.appendChild(fieldWrap("DDoS 防护", el(`<select class="select" name="antiDDoS">${["无", "基础防护", "高防 50Gbps", "高防 100Gbps"].map(o=>`<option ${o===data.antiDDoS?"selected":""}>${o}</option>`).join("")}</select>`)));
  }
  if (kind === "compute") {
    form.appendChild(fieldWrap("资源池", el(`<input class="input" name="poolName" value="${escapeHtml(data.poolName || "")}" placeholder="如：阿里云·华东1可用区B" />`), { required: true }));
    form.appendChild(fieldWrap("资源池地域", el(`<input class="input" name="poolRegion" value="${escapeHtml(data.poolRegion || "")}" placeholder="如：华东1（杭州）" />`), { required: true }));
    const computeForms = ["裸金属", "GPU云主机", "容器"];
    form.appendChild(fieldWrap("算力形态", el(`<select class="select" name="computeForm">${computeForms.map(o=>`<option ${o===data.computeForm?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`), { required: true }));
    form.appendChild(fieldWrap("实例系列", el(`<input class="input" name="instanceFamily" value="${escapeHtml(data.instanceFamily || "")}" placeholder="如：S2 / G6" />`)));
    form.appendChild(fieldWrap("架构", el(`<select class="select" name="architecture">${["x86", "ARM"].map(o=>`<option ${o===data.architecture?"selected":""}>${o}</option>`).join("")}</select>`), { required: true }));
    form.appendChild(fieldWrap("CPU(vCPU)", el(`<input class="input" type="number" name="vcpu" value="${data.vcpu}" />`), { required: true }));
    form.appendChild(fieldWrap("内存(GB)", el(`<input class="input" type="number" name="memoryGB" value="${data.memoryGB}" />`), { required: true }));
    form.appendChild(fieldWrap("CPU 型号", el(`<input class="input" name="cpuModel" value="${escapeHtml(data.cpuModel || "")}" placeholder="如：Intel Xeon 8369B / 鲲鹏 920" />`)));
    const gpuOpts = ["无", ...(State.userCardModel || []).map(m => m.displayName).filter(Boolean)];
    const currentGpu = data.gpuModel || "无";
    if (currentGpu && !gpuOpts.includes(currentGpu)) gpuOpts.push(currentGpu);
   form.appendChild(fieldWrap("GPU 型号", el(`<select class="select" name="gpuModel">${gpuOpts.map(o => `<option ${o === currentGpu ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}</select>`), { hint: "取值来源：卡型号配置" }));
   form.appendChild(fieldWrap("GPU 数量", el(`<input class="input" type="number" name="gpuCount" value="${data.gpuCount || 0}" />`)));
   const gpuMemInput = el(`<input class="input" type="number" name="gpuMemoryGB" value="${data.gpuMemoryGB || 0}" readonly style="background:#f1f5f9;cursor:not-allowed;" />`);
   const gpuMemMap = {};
   (State.userCardModel || []).forEach(m => { if (m.displayName) gpuMemMap[m.displayName] = Number(m.memoryGB) || 0; });
   function syncGpuMem() {
     const sel = form.querySelector('[name="gpuModel"]');
     if (sel && gpuMemMap[sel.value] != null) gpuMemInput.value = gpuMemMap[sel.value];
     else gpuMemInput.value = 0;
   }
  form.appendChild(fieldWrap("单卡显存(GB)", gpuMemInput, { hint: "根据选择的GPU型号自动回显" }));
  syncGpuMem();
  form.querySelector('[name="gpuModel"]').addEventListener("change", syncGpuMem);
    form.appendChild(fieldWrap("本地磁盘", el(`<input class="input" name="localDisk" value="${escapeHtml(data.localDisk || "无")}" placeholder="如：NVMe SSD 1TB / 无" />`)));
    const networkModes = ["VPC", "经典网络", "VPC + 弹性 RDMA", "专线接入"];
    form.appendChild(fieldWrap("组网方式", el(`<select class="select" name="networkMode">${networkModes.map(o=>`<option ${o===data.networkMode?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`), { required: true }));
    form.appendChild(fieldWrap("组网带宽(Gbps)", el(`<input class="input" type="number" name="networkBandwidthGbps" value="${data.networkBandwidthGbps || 0}" />`)));
    const domSelect = el(`<select class="select" name="domesticFlag"><option value="0" ${!data.domesticFlag?"selected":""}>非国产</option><option value="1" ${data.domesticFlag?"selected":""}>国产</option></select>`);
    form.appendChild(fieldWrap("国产标识", domSelect, { required: true }));
    const readComputeDraft = () => ({
      computeForm: form.querySelector("[name=computeForm]")?.value || data.computeForm,
      gpuModel: form.querySelector("[name=gpuModel]")?.value || data.gpuModel,
      gpuCount: Number(form.querySelector("[name=gpuCount]")?.value || 0),
      gpuMemoryGB: Number(form.querySelector("[name=gpuMemoryGB]")?.value || 0),
      vcpu: Number(form.querySelector("[name=vcpu]")?.value || 0),
      memoryGB: Number(form.querySelector("[name=memoryGB]")?.value || 0),
      domesticFlag: form.querySelector("[name=domesticFlag]")?.value === "1",
    });
    const syncComputeAutoName = () => {
      const input = form.querySelector("[name=_computeAutoName]");
      if (input) input.value = buildComputeSpecRuleName(readComputeDraft());
    };
    form._buildComputeSpecCode = () => buildComputeSpecRuleCode(readComputeDraft());
    form.querySelectorAll("[name=computeForm], [name=gpuModel], [name=gpuCount], [name=gpuMemoryGB], [name=vcpu], [name=memoryGB], [name=domesticFlag]").forEach(ctrl => {
      ctrl.addEventListener("input", syncComputeAutoName);
      ctrl.addEventListener("change", syncComputeAutoName);
    });
    syncComputeAutoName();
  }

  // 计费模式 + 结算价（勾选启用后才需维护该模式下的价格）
  const modes = Array.isArray(data.chargeModes) && data.chargeModes.length ? data.chargeModes : ["onDemand", "monthly"];
  data.chargeModes = modes.slice();
  const hasOnDemand = modes.includes("onDemand");
  const hasMonthly = modes.includes("monthly");
  const formUnitOn = specPriceUnit(kind, "onDemand");
  const formUnitMo = specPriceUnit(kind, "monthly");
  const uTag = (u) => u ? `<span style="color:#999;font-weight:400;font-size:11px;margin-left:4px;">${u}</span>` : "";
  const priceSection = el(`<div class="field full" id="priceSection" style="grid-column:1 / -1;">
    <label>计费模式</label>
    <div class="hint" style="margin-bottom:6px;">勾选启用的计费模式后，再维护对应的地市 / 生态结算价；未勾选的模式不可销售。</div>
    <div style="display:flex;gap:18px;margin-bottom:8px;">
      <label class="checkbox"><input type="checkbox" name="chargeModeOnDemand" ${hasOnDemand?"checked":""} /> 按量计费</label>
      <label class="checkbox"><input type="checkbox" name="chargeModeMonthly" ${hasMonthly?"checked":""} /> 包周期</label>
    </div>
    <div class="price-grid" id="priceGrid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;${kind === "bandwidth" && data.tierEnabled ? "display:none;" : ""}">
      <div data-charge-card="onDemand" style="border:1px solid var(--border);border-radius:6px;padding:10px;${hasOnDemand?"":"opacity:0.45;background:#fafbfd;"}">
        <div style="font-weight:600;font-size:12px;color:var(--text-2);margin-bottom:8px;">按量计费${uTag(formUnitOn)}</div>
        <div class="field"><label>地市结算价</label><input class="input" type="number" step="0.0001" name="onDemandCity" value="${data.onDemandCity ?? 0}" ${hasOnDemand?"":"disabled"} /></div>
        <div class="field"><label>生态结算价</label><input class="input" type="number" step="0.0001" name="onDemandEco" value="${data.onDemandEco ?? 0}" ${hasOnDemand?"":"disabled"} /></div>
      </div>
      <div data-charge-card="monthly" style="border:1px solid var(--border);border-radius:6px;padding:10px;${hasMonthly?"":"opacity:0.45;background:#fafbfd;"}">
        <div style="font-weight:600;font-size:12px;color:var(--text-2);margin-bottom:8px;">包周期计费${uTag(formUnitMo)}</div>
        <div class="field"><label>地市结算价</label><input class="input" type="number" step="0.01" name="monthlyCity" value="${data.monthlyCity ?? 0}" ${hasMonthly?"":"disabled"} /></div>
        <div class="field"><label>生态结算价</label><input class="input" type="number" step="0.01" name="monthlyEco" value="${data.monthlyEco ?? 0}" ${hasMonthly?"":"disabled"} /></div>
      </div>
    </div>
    ${kind === "bandwidth" ? `<div class="hint" id="tierHint" style="${data.tierEnabled ? "" : "display:none;"}margin-top:6px;color:var(--text-3);">已启用阶梯定价，单一结算价已隐藏，请在下方按阶梯维护按量 / 包周期价格。</div>` : ""}
  </div>`);
  form.appendChild(priceSection);

  const toggleChargeCard = (mode, on) => {
    const card = priceSection.querySelector(`[data-charge-card="${mode}"]`);
    if (!card) return;
    card.style.opacity = on ? "" : "0.45";
    card.style.background = on ? "" : "#fafbfd";
    card.querySelectorAll("input").forEach(i => i.disabled = !on);
    if (kind === "bandwidth" && typeof form._refreshTierColumns === "function") form._refreshTierColumns();
  };
  priceSection.querySelector("[name=chargeModeOnDemand]").addEventListener("change", e => toggleChargeCard("onDemand", e.target.checked));
  priceSection.querySelector("[name=chargeModeMonthly]").addEventListener("change", e => toggleChargeCard("monthly", e.target.checked));

  // 带宽专属：阶梯定价
  if (kind === "bandwidth") {
    const tierWrap = el(`<div class="field full" style="grid-column:1 / -1;">
      <label>阶梯定价</label>
      <div class="hint" style="margin-bottom:6px;">二选一：启用后按带宽区间维护多档结算价（同时支持按量 / 包周期）；不启用则使用下方的单一结算价。</div>
      <div style="display:flex;gap:18px;margin-bottom:8px;">
        <label class="radio"><input type="radio" name="tierEnabled" value="1" ${data.tierEnabled ? "checked" : ""} /> 启用阶梯定价</label>
        <label class="radio"><input type="radio" name="tierEnabled" value="0" ${data.tierEnabled ? "" : "checked"} /> 不启用</label>
      </div>
      <div id="tierTableWrap" style="${data.tierEnabled ? "" : "display:none;"}">
        <table class="table" style="margin-top:4px;">
          <thead id="tierHead">
            <tr id="tierHeadRow1">
              <th rowspan="2" style="width:90px;">起(Mbps)</th>
              <th rowspan="2" style="width:90px;">止(Mbps)</th>
              <th data-group="city" colspan="2" style="text-align:center;background:#f7f9fc;">地市结算价</th>
              <th data-group="eco" colspan="2" style="text-align:center;background:#f7f9fc;">生态结算价</th>
              <th rowspan="2" style="width:60px;"></th>
            </tr>
            <tr id="tierHeadRow2">
              <th data-mode="onDemand" data-group="city" style="font-weight:500;color:var(--text-2);">按量<span style="color:#999;font-weight:400;font-size:10px;display:block;">元/Mbps·小时</span></th>
              <th data-mode="monthly" data-group="city" style="font-weight:500;color:var(--text-2);">包周期<span style="color:#999;font-weight:400;font-size:10px;display:block;">元/Mbps·月</span></th>
              <th data-mode="onDemand" data-group="eco" style="font-weight:500;color:var(--text-2);">按量<span style="color:#999;font-weight:400;font-size:10px;display:block;">元/Mbps·小时</span></th>
              <th data-mode="monthly" data-group="eco" style="font-weight:500;color:var(--text-2);">包周期<span style="color:#999;font-weight:400;font-size:10px;display:block;">元/Mbps·月</span></th>
            </tr>
          </thead>
          <tbody id="tierBody"></tbody>
        </table>
        <button type="button" class="btn btn-xs" id="addTierBtn" style="margin-top:6px;"><i data-lucide="plus"></i> 添加阶梯</button>
      </div>
    </div>`);
    // 阶梯定价模块上移到「计费模式 + 结算价」之前
    form.insertBefore(tierWrap, priceSection);

    const renderTierRows = () => {
      const onDemandOn = !!form.querySelector("[name=chargeModeOnDemand]")?.checked;
      const monthlyOn = !!form.querySelector("[name=chargeModeMonthly]")?.checked;
      const body = tierWrap.querySelector("#tierBody");
      body.innerHTML = (data.tierPricing || []).map((t, idx) => `<tr data-idx="${idx}">
        <td><input class="input" type="number" data-key="start" value="${t.start ?? 1}" /></td>
        <td><input class="input" type="number" data-key="end" value="${t.end ?? 10}" /></td>
        <td data-mode="onDemand" data-group="city" style="${onDemandOn ? "" : "display:none;"}"><input class="input" type="number" step="0.0001" data-key="onDemandCity" value="${t.onDemandCity ?? t.cityPrice ?? 0}" placeholder="按量·地市" /></td>
        <td data-mode="monthly" data-group="city" style="${monthlyOn ? "" : "display:none;"}"><input class="input" type="number" step="0.01" data-key="monthlyCity" value="${t.monthlyCity ?? t.cityPrice ?? 0}" placeholder="包月·地市" /></td>
        <td data-mode="onDemand" data-group="eco" style="${onDemandOn ? "" : "display:none;"}"><input class="input" type="number" step="0.0001" data-key="onDemandEco" value="${t.onDemandEco ?? t.ecoPrice ?? 0}" placeholder="按量·生态" /></td>
        <td data-mode="monthly" data-group="eco" style="${monthlyOn ? "" : "display:none;"}"><input class="input" type="number" step="0.01" data-key="monthlyEco" value="${t.monthlyEco ?? t.ecoPrice ?? 0}" placeholder="包月·生态" /></td>
        <td><button type="button" class="btn btn-xs btn-danger" data-act="rm"><i data-lucide="trash-2"></i></button></td>
      </tr>`).join("");
      // 子表头按量 / 包周期 同步显隐
      tierWrap.querySelectorAll('#tierHeadRow2 [data-mode="onDemand"]').forEach(th => th.style.display = onDemandOn ? "" : "none");
      tierWrap.querySelectorAll('#tierHeadRow2 [data-mode="monthly"]').forEach(th => th.style.display = monthlyOn ? "" : "none");
      // 一级表头 colspan 跟随实际显示的子列数
      const colspan = (onDemandOn ? 1 : 0) + (monthlyOn ? 1 : 0);
      tierWrap.querySelectorAll('#tierHeadRow1 [data-group="city"], #tierHeadRow1 [data-group="eco"]').forEach(th => {
        if (colspan === 0) { th.style.display = "none"; }
        else { th.style.display = ""; th.setAttribute("colspan", colspan); }
      });
      if (window.lucide) window.lucide.createIcons();
    };
    const syncTiersFromUI = () => {
      const rows = tierWrap.querySelectorAll("#tierBody tr");
      data.tierPricing = Array.from(rows).map(tr => {
        const get = k => { const elx = tr.querySelector(`[data-key="${k}"]`); return elx ? elx.value : ""; };
        return {
          start: Number(get("start")) || 0,
          end: Number(get("end")) || 0,
          onDemandCity: Number(get("onDemandCity")) || 0,
          onDemandEco: Number(get("onDemandEco")) || 0,
          monthlyCity: Number(get("monthlyCity")) || 0,
          monthlyEco: Number(get("monthlyEco")) || 0,
        };
      });
    };
    data.tierPricing = Array.isArray(data.tierPricing) ? data.tierPricing.slice() : [];
    renderTierRows();
    // 暴露给 toggleChargeCard 调用，用于阶梯列联动显隐
    form._refreshTierColumns = renderTierRows;
    tierWrap.querySelectorAll("input[name=tierEnabled]").forEach(r => r.addEventListener("change", (e) => {
      data.tierEnabled = e.target.value === "1";
      tierWrap.querySelector("#tierTableWrap").style.display = data.tierEnabled ? "" : "none";
      // 启用阶梯时隐藏单一价模块，并显示提示；不启用则恢复单一价显示
      const priceGrid = form.querySelector("#priceGrid");
      const tierHint = form.querySelector("#tierHint");
      if (priceGrid) priceGrid.style.display = data.tierEnabled ? "none" : "grid";
      if (tierHint) tierHint.style.display = data.tierEnabled ? "" : "none";
      if (data.tierEnabled && data.tierPricing.length === 0) {
        data.tierPricing = [{ start: 1, end: 10, onDemandCity: 0, onDemandEco: 0, monthlyCity: 0, monthlyEco: 0 }];
        renderTierRows();
      }
    }));
    tierWrap.querySelector("#addTierBtn").addEventListener("click", () => {
      syncTiersFromUI();
      const last = data.tierPricing[data.tierPricing.length - 1];
      const start = last ? Number(last.end) + 1 : 1;
      data.tierPricing.push({ start, end: start + 9, onDemandCity: 0, onDemandEco: 0, monthlyCity: 0, monthlyEco: 0 });
      renderTierRows();
    });
    tierWrap.querySelector("#tierBody").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act=rm]");
      if (!btn) return;
      const idx = Number(btn.closest("tr").dataset.idx);
      syncTiersFromUI();
      data.tierPricing.splice(idx, 1);
      renderTierRows();
    });
    // 持久暴露给 onConfirm 的同步函数
    form._syncTiers = syncTiersFromUI;
  }

  if (kind === "storage") {
    form.appendChild(fieldWrap("备注", el(`<textarea name="remark" placeholder="请输入备注信息">${escapeHtml(data.remark || data.description || "")}</textarea>`), { full: true }));
  } else {
    form.appendChild(fieldWrap("备注", el(`<textarea name="remark" placeholder="可选备注信息">${escapeHtml(data.remark || "")}</textarea>`), { full: true }));
  }

  Modal.open({
    title: kind === "storage" ? (isEdit ? "编辑规格" : "新增规格") : (isEdit ? "编辑" : "新建") + SpecSchema[kind].label,
    body: form,
    confirmText: isEdit ? "保存" : "创建",
    wide: true,
    onConfirm: () => {
      const payload = {...data};
      // 阶梯定价：先把表格里的最新值同步回 data
      if (kind === "bandwidth" && typeof form._syncTiers === "function") form._syncTiers();
      const inputs = form.querySelectorAll("[name]");
      inputs.forEach(i => {
        const n = i.name;
        if (!n) return;
        // chargeMode / tierEnabled 单独处理
        if (n === "chargeModeOnDemand" || n === "chargeModeMonthly" || n === "tierEnabled" || n === "_providerName" || n === "_providerRegion" || n === "_computeAutoName") return;
        if (i.type === "checkbox") payload[n] = i.checked;
        else if (i.type === "number") payload[n] = i.value === "" ? null : Number(i.value);
        else payload[n] = i.value.trim();
      });
      // 计费模式：至少勾选一种
      const checkedModes = [];
      if (form.querySelector("[name=chargeModeOnDemand]")?.checked) checkedModes.push("onDemand");
      if (form.querySelector("[name=chargeModeMonthly]")?.checked) checkedModes.push("monthly");
      if (!checkedModes.length) { toast("请至少选择一种计费模式", "error"); return false; }
      payload.chargeModes = checkedModes;
      // 国产标识：select 返回字符串，转回布尔
      if (typeof payload.domesticFlag === "string") payload.domesticFlag = payload.domesticFlag === "1";
      // 未勾选的计费模式价格置零
      if (!checkedModes.includes("onDemand")) { payload.onDemandCity = 0; payload.onDemandEco = 0; }
      if (!checkedModes.includes("monthly")) { payload.monthlyCity = 0; payload.monthlyEco = 0; }
      // 阶梯定价数组单独写回
      if (kind === "bandwidth") {
        payload.tierEnabled = !!data.tierEnabled;
        payload.tierPricing = data.tierPricing || [];
        if (payload.tierEnabled) {
          // 阶梯定价开启时单一价不参与销售，置零防止误读
          payload.onDemandCity = 0; payload.onDemandEco = 0;
          payload.monthlyCity = 0; payload.monthlyEco = 0;
          if (!payload.tierPricing.length) { toast("启用阶梯定价后请至少添加一档阶梯", "error"); return false; }
        }
      }
      // 云硬盘：从服务商/地域解析 providerId
      if (kind === "cloudDisk") {
        const pName = form.querySelector("[name=_providerName]")?.value;
        const pRegion = form.querySelector("[name=_providerRegion]")?.value;
        const prov = State.provider.find(p => p.name === pName && p.region === pRegion);
        payload.providerId = prov ? prov.id : null;
        delete payload._providerName; delete payload._providerRegion;
      }
      if (kind === "storage") {
        const pName = form.querySelector("[name=_providerName]")?.value;
        const prov = State.provider.find(p => p.name === pName && p.region === payload.regionId);
        payload.providerId = prov ? prov.id : null;
        delete payload._providerName;
      }
      if (kind === "compute" && typeof form._buildComputeSpecCode === "function") {
        const autoCode = form._buildComputeSpecCode();
        payload.code = autoCode;
        payload.name = autoCode;
      }
      if (!payload.name) { toast("请输入规格名称", "error"); return false; }
      if (!payload.providerId) { toast(kind === "storage" ? "请选择服务商" : "请选择算力服务商", "error"); return false; }
      if (kind === "storage" && !payload.regionId) { toast("请选择地域", "error"); return false; }
      if (kind === "storage" && !payload.zoneId) { toast("请选择可用区", "error"); return false; }
      // 容量校验
      if ((kind === "systemDisk" || kind === "cloudDisk") ) {
        if ((payload.minGB ?? 0) > (payload.maxGB ?? 0)) { toast("最小容量不能大于最大容量", "error"); return false; }
      }
      // 创建人保留 / 默认
      payload.createdBy = isEdit ? (item.createdBy || data.createdBy) : (data.createdBy || getCurrentOperator());
      payload.updatedBy = getCurrentOperator();
      // 上架状态：新建默认未上架；编辑保留原值
      payload.listed = isEdit ? !!item.listed : false;
      // 兼容：去掉旧 status 字段，统一以 listed 为准
      payload.status = "active";
      payload.updatedAt = nowStr();
      if (isEdit) Object.assign(item, payload);
      else { payload.id = uid(kind + "_"); State[kind].unshift(payload); }
      persist(kind);
      setView(State.view);
      toast(isEdit ? "已保存" : "已创建", "success");
    }
  });
}

// ===== 规格详情 =====
function openSpecDetail(kind, item) {
  const schema = SpecSchema[kind];
  const provider = State.provider.find(p => p.id === item.providerId);
  const kv = [];
  schema.columns.forEach(c => {
    // 详情页不显示「上架状态」「创建人」（创建人在底部统一展示）
   if (c.key === "listed" || c.key === "createdBy") return;
    // 云硬盘详情：跳过服务商/地域/更新时间（底部统一展示，避免重复）
    if (c.key === "_provider" || c.key === "_region" || c.key === "updatedAt" || c.key === "updatedBy") return;
   // 详情页规格(CPU/内存/GPU)直接显示「规格」
    kv.push({ k: c.title, v: c.render ? c.render(item, kind) : String(item[c.key]) });
  });
  const unitOn = specPriceUnit(kind, "onDemand");
  const unitMo = specPriceUnit(kind, "monthly");
  const unitTag = (u) => u ? `<span style="color:#999;font-size:11px;margin-left:4px;">${u}</span>` : "";
  if (Array.isArray(item.chargeModes) && item.chargeModes.includes("onDemand")) {
    kv.push({ k: "按量 · 地市结算价", v: fmtMoney(item.onDemandCity) + unitTag(unitOn) });
    kv.push({ k: "按量 · 生态结算价", v: fmtMoney(item.onDemandEco) + unitTag(unitOn) });
  }
  if (Array.isArray(item.chargeModes) && item.chargeModes.includes("monthly")) {
    kv.push({ k: "包周期 · 地市结算价", v: fmtMoney(item.monthlyCity) + unitTag(unitMo) });
    kv.push({ k: "包周期 · 生态结算价", v: fmtMoney(item.monthlyEco) + unitTag(unitMo) });
  }
  kv.push({ k: "服务商", v: provider ? `${provider.name} · ${provider.region}` : "未绑定" });
  if (kind === "bandwidth" && item.tierEnabled && Array.isArray(item.tierPricing) && item.tierPricing.length) {
    const tierHtml = `<table class="table" style="margin-top:4px;"><thead><tr><th>起(Mbps)</th><th>止(Mbps)</th><th>地市结算价</th><th>生态结算价</th></tr></thead><tbody>${item.tierPricing.map(t => `<tr><td>${t.start}</td><td>${t.end}</td><td>${fmtMoney(t.cityPrice)}</td><td>${fmtMoney(t.ecoPrice)}</td></tr>`).join("")}</tbody></table>`;
    kv.push({ k: "阶梯定价", v: tierHtml });
  }
  kv.push({ k: "备注", v: item.remark || "无" });
  kv.push({ k: "创建人", v: escapeHtml(maskCreator(item.createdBy)) });
  kv.push({ k: "更新时间", v: item.updatedAt });

  const html = `<div class="detail-card" style="margin:0 0 12px 0;">
      <div class="label">${escapeHtml(item.code)}</div>
      <div class="value" style="font-size:18px;">${escapeHtml(item.name)}</div>
      <div class="stat-foot">创建人 ${escapeHtml(maskCreator(item.createdBy))}${provider ? " · " + escapeHtml(provider.name) : ""}</div>
    </div>
    <div class="panel">
      <div class="panel-header"><div class="panel-title">详细信息</div></div>
      <div class="panel-body">
        <div class="kv">${kv.map(x => `<div class="k">${x.k}</div><div class="v">${x.v}</div>`).join("")}</div>
      </div>
    </div>`;
  Drawer.open({ title: schema.label + "详情", body: el(`<div>${html}</div>`) });
}

// ===== 服务商管理 =====
function renderProviderList() {
  const html = `<div class="commerce-page">
    <div class="commerce-breadcrumb"><i data-lucide="map-pin"></i><span>资源管理</span><span class="separator">›</span><span class="current">服务商管理</span></div>
    <div class="panel commerce-panel">
      <div class="toolbar commerce-toolbar"><div class="toolbar-left">
        <div class="search"><i data-lucide="search"></i><input class="input" id="searchInput" placeholder="搜索服务商名称" /></div>
        <select class="select" id="filterType"><option value="">全部类型</option><option value="公有云">公有云</option><option value="专有云">专有云</option><option value="私有云">私有云</option><option value="生态">生态</option><option value="自有">自有</option></select>
      </div><div class="toolbar-action-split"><div class="toolbar-action-group"><button class="btn btn-primary" id="btnCreate">新增服务商</button></div><div class="toolbar-action-group"><span class="tag tag-muted" id="rowCount">共 0 个</span><button class="btn btn-primary" id="providerQuery">查询</button><button class="btn" id="providerReset">重置</button><button class="btn refresh-only" id="providerRefresh" title="刷新"><i data-lucide="refresh-cw"></i></button></div></div></div>
      <div class="table-wrap commerce-table-wrap">
        <table class="table commerce-table">
          <thead><tr>
            <th style="width:180px;">算力服务商</th>
            <th style="width:200px;">AK / SK</th>
            <th style="width:110px;">创建账号</th>
            <th style="width:150px;">更新时间</th>
            <th style="width:180px;">操作</th>
            <th style="width:40px;"></th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
  $("#content").innerHTML = html;

  const akMaskFn = (v) => v ? (v.length > 8 ? v.slice(0, 4) + "****" + v.slice(-4) : v.slice(0, 2) + "****") : "未设置";
  const skMaskFn = (v) => v ? "****" + (v.length > 4 ? v.slice(-4) : "") : "未设置";
  const copyText = (txt) => {
    if (!txt) { toast("尚未设置 AK/SK", "error"); return; }
    const done = () => toast("已复制到剪贴板", "success");
    const fallback = () => {
      try {
        const ta = document.createElement("textarea");
        ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) { toast("复制失败，请手动选择", "error"); }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else {
      fallback();
    }
  };
  const akSkCell = (latest) => {
    if (latest.type !== "公有云" && latest.type !== "专有云") return `<span class="tag tag-muted">仅公有云/专有云显示</span>`;
    return `<div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="color:#8a8f9e;width:18px;font-size:11px;">AK</span>
        <code style="flex:1;min-width:0;font-size:11px;color:#5b6275;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Menlo,Monaco,monospace;">${escapeHtml(akMaskFn(latest.ak))}</code>
        <button class="icon-btn" data-act="copy" data-target="ak" data-id="${latest.id}" title="复制 AK" style="border:none;background:transparent;padding:2px;color:#8a8f9e;"><i data-lucide="copy" style="width:14px;height:14px;"></i></button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="color:#8a8f9e;width:18px;font-size:11px;">SK</span>
        <code style="flex:1;min-width:0;font-size:11px;color:#5b6275;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Menlo,Monaco,monospace;">${escapeHtml(skMaskFn(latest.sk))}</code>
        <button class="icon-btn" data-act="copy" data-target="sk" data-id="${latest.id}" title="复制 SK" style="border:none;background:transparent;padding:2px;color:#8a8f9e;"><i data-lucide="copy" style="width:14px;height:14px;"></i></button>
      </div>
    </div>`;
  };

  // 服务商维度分组：以 name + type 为聚合键
  const renderRows = () => {
    let rows = State.provider.slice();
    const kw = $("#searchInput").value.toLowerCase();
    if (kw) rows = rows.filter(r => [r.name, r.region, r.contact, r.phone].join(" ").toLowerCase().includes(kw));
    const ft = $("#filterType").value;
    if (ft) rows = rows.filter(r => r.type === ft);

    const groups = {};
    rows.forEach(r => {
      const key = `${r.type || "未分类"}__${r.name || "未命名"}`;
      if (!groups[key]) groups[key] = { name: r.name || "未命名", type: r.type || "未分类", items: [] };
      groups[key].items.push(r);
    });
    const groupRows = Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));
    $("#rowCount").textContent = `共 ${groupRows.length} 个服务商 · ${rows.length} 个地域`;

    if (groupRows.length === 0) {
      $("#tableBody").innerHTML = `<tr><td colspan="6"><div class="empty">暂无服务商</div></td></tr>`;
      return;
    }
    $("#tableBody").innerHTML = groupRows.map((g, gi) => {
      const latest = g.items.slice().sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")))[0] || {};
      const creator = latest.createdBy || "—";
      const regionPreview = g.items.slice(0, 3).map(r => `${r.region || "未设置地域"}：${r.contact || r.phone || "未维护"}`).join(" / ");
      const regionItems = g.items.map(r => {
        return `<tr>
          <td style="width:180px;"><span class="tag tag-primary">${escapeHtml(r.region || "未设置地域")}</span></td>
          <td>${r.contact ? escapeHtml(r.contact) : '<span class="provider-region-empty">未维护对接人</span>'}</td>
          <td>${r.phone ? escapeHtml(r.phone) : '<span class="provider-region-empty">未维护手机号</span>'}</td>
          <td style="width:130px;">
            <div class="actions">
              <button class="link-btn" data-act="edit" data-id="${r.id}" data-region-edit="1">编辑</button>
              <span class="divider"></span>
              <button class="link-btn link-danger" data-act="del" data-id="${r.id}">删除</button>
            </div>
          </td>
        </tr>`;
      }).join("");
      const regionRows = `<tr class="provider-region-row" data-group="${gi}" style="display:none;">
        <td colspan="6">
          <div class="provider-region-panel">
            <div class="provider-region-panel-head">
              <span>地域与对接人明细</span>
              <span>${g.items.length > 8 ? `共 ${g.items.length} 个地域，支持滚动查看` : `共 ${g.items.length} 个地域`}</span>
            </div>
            <div class="provider-region-list">
              <table class="provider-region-table">
                <thead><tr><th>地域</th><th>对接人</th><th>手机号</th><th>操作</th></tr></thead>
                <tbody>${regionItems}</tbody>
              </table>
            </div>
          </div>
        </td>
      </tr>`;
      return `<tr class="provider-group-row" data-group="${gi}">
        <td>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="min-width:0;"><strong>${escapeHtml(g.name)}</strong><div style="margin-top:4px;display:flex;gap:5px;align-items:center;"><span class="tag tag-muted">${escapeHtml(g.type)}</span><span class="tag">${g.items.length} 个地域</span></div><div style="margin-top:6px;color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${escapeHtml(regionPreview)}">${escapeHtml(regionPreview)}${g.items.length > 3 ? " ..." : ""}</div></div>
          </div>
        </td>
        <td>${akSkCell(latest)}</td>
        <td style="color:#5b6275;">${escapeHtml(creator)}</td>
        <td style="font-size:11px;color:#8a8f9e;">${escapeHtml(latest.updatedAt || "")}</td>
        <td><div class="actions">
          <button class="provider-expand-btn" data-act="expand" data-group="${gi}" style="border:1px solid #dbeafe;background:#f8fbff;cursor:pointer;color:#2563eb;padding:4px 9px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;white-space:nowrap;"><i data-lucide="chevron-right" style="width:14px;height:14px;transition:transform .2s;"></i><span data-expand-text>展开地域</span></button>
          <span class="divider"></span>
          <button class="link-btn" data-act="add-region" data-name="${escapeHtml(g.name)}" data-type="${escapeHtml(g.type)}" data-ak="${escapeHtml(latest.ak || "")}" data-sk="${escapeHtml(latest.sk || "")}" data-created-by="${escapeHtml(latest.createdBy || "admin")}"><i data-lucide="plus" style="width:13px;height:13px;"></i> 新增地域</button>
        </div></td>
        <td></td>
      </tr>${regionRows}`;
    }).join("");
    if (window.lucide) window.lucide.createIcons();
  };

  $("#searchInput").addEventListener("input", renderRows);
  $("#filterType").addEventListener("change", renderRows);
  $("#providerQuery").addEventListener("click", renderRows);
  $("#providerReset").addEventListener("click", () => {
    $("#searchInput").value = "";
    $("#filterType").value = "";
    renderRows();
  });
  $("#providerRefresh").addEventListener("click", renderRows);
  $("#btnCreate").addEventListener("click", () => openProviderForm(null));
  $("#tableBody").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "expand") {
      const gi = btn.dataset.group;
      const rows = Array.from(document.querySelectorAll(`#tableBody .provider-region-row[data-group="${gi}"]`));
      const icon = btn.querySelector("i");
      const text = btn.querySelector("[data-expand-text]");
      const isExpanded = rows.some(r => r.style.display !== "none");
      rows.forEach(r => r.style.display = isExpanded ? "none" : "");
      if (icon) icon.style.transform = isExpanded ? "" : "rotate(90deg)";
      if (text) text.textContent = isExpanded ? "展开地域" : "收起地域";
      return;
    }
    if (act === "add-region") {
      openProviderForm(null, { name: btn.dataset.name || "", type: btn.dataset.type || "公有云", ak: btn.dataset.ak || "", sk: btn.dataset.sk || "", createdBy: btn.dataset.createdBy || "admin", regionOnly: true });
      return;
    }
    const id = btn.dataset.id;
    const item = State.provider.find(x => x.id === id);
    if (!item) return;
    if (act === "copy") {
      const field = btn.dataset.target;
      copyText(item[field]);
      return;
    }
    if (act === "edit") openProviderForm(item, { regionOnly: btn.dataset.regionEdit === "1" });
    if (act === "del") {
      if (!confirm("确认删除该地域记录？")) return;
      State.provider = State.provider.filter(x => x.id !== id);
      persist("provider");
      renderRows();
      toast("已删除", "success");
    }
  });
  renderRows();
}

function openProviderForm(item, preset = {}) {
  const isEdit = !!item;
  const isRegionOnly = !!preset.regionOnly;
  const data = item ? {...item} : { id: uid("pv_"), name: preset.name || "", type: preset.type || "公有云", region: "", ak: preset.ak || "", sk: preset.sk || "", contact: "", phone: "", createdBy: preset.createdBy || "admin", updatedAt: nowStr() };
  const form = el(`<div class="form"></div>`);
  const providerRegionOptions = Array.from(new Set([
    "华东1（杭州）", "华东2（上海）", "华北1（青岛）", "华北2（北京）", "华北3（张家口）", "华北5（呼和浩特）",
    "华南1（深圳）", "华南2（河源）", "华南3（广州）", "华中1（武汉）", "西南1（成都）", "中国香港",
    "深圳宝安", "南京", "苏州", "无锡", "常州", "南通", "徐州", "扬州", "泰州", "盐城", "镇江", "淮安", "连云港", "宿迁",
    ...State.provider.map(p => p.region).filter(Boolean),
    data.region
  ].filter(Boolean)));

  const typeField = fieldWrap("服务商类型", el(`<select class="select" name="type">${["公有云", "专有云", "私有云", "生态", "自有"].map(t => `<option ${t === data.type ? "selected" : ""}>${t}</option>`).join("")}</select>`), { required: true, hint: "选择服务商资源属性，决定是否需要维护 AK/SK" });
  form.appendChild(typeField);
  const providerNameOptions = Array.from(new Set(["阿里云", "华为云", "天翼云", "腾讯云", "火山引擎", "本地算力池", ...State.provider.map(p => p.name).filter(Boolean)]));
  const nameField = fieldWrap("服务商名称", el(`<select class="select" name="name"><option value="">-- 请选择 --</option>${providerNameOptions.map(n => `<option value="${escapeHtml(n)}" ${n === data.name ? "selected" : ""}>${escapeHtml(n)}</option>`).join("")}</select>`), { required: true });
  form.appendChild(nameField);

  // 仅 AccessKey Secret 需要点「校验」触发接口调用（模拟）
  const skConfirmState = { sk: false };
  const akInput = el(`<input class="input" name="ak" value="${escapeHtml(data.ak || "")}" placeholder="输入 AccessKey ID" />`);
  const skInput = el(`<input class="input" name="sk" value="${escapeHtml(data.sk || "")}" type="password" placeholder="输入 AccessKey Secret" />`);
  const skBtn = el(`<button type="button" class="btn btn-xs aksk-confirm" data-field="sk" style="white-space:nowrap;">校验</button>`);

  const akRow = el(`<div style="display:flex;gap:8px;align-items:center;">`);
  akRow.appendChild(akInput);
  const skRow = el(`<div style="display:flex;gap:8px;align-items:center;">`);
  skRow.appendChild(skInput); skRow.appendChild(skBtn);

  const akField = fieldWrap("AccessKey ID", akRow, { required: true, hint: "仅录入 AK，校验以 AccessKey Secret 为准" });
  const skField = fieldWrap("AccessKey Secret", skRow, { required: true, hint: "输入完成后点击「校验」验证" });
  akField.id = "akField";
  skField.id = "skField";
  form.appendChild(akField);
  form.appendChild(skField);
  const regionField = fieldWrap("地域信息", el(`<select class="select" name="region"><option value="">-- 请选择 --</option>${providerRegionOptions.map(r => `<option value="${escapeHtml(r)}" ${r === data.region ? "selected" : ""}>${escapeHtml(r)}</option>`).join("")}</select>`), { required: true });
  form.appendChild(regionField);

  // 如果已有 SK（编辑模式），标记为校验成功
  if (data.sk) { skConfirmState.sk = true; skBtn.classList.add("btn-primary"); skBtn.innerHTML = '<i data-lucide="check" style="width:13px;height:13px;"></i> 校验成功'; }
  if (isRegionOnly) {
    [typeField, nameField, akField, skField, ...(isEdit ? [regionField] : [])].forEach(field => {
      field.querySelectorAll("input,select,textarea").forEach(ctrl => {
        ctrl.disabled = true;
        ctrl.style.background = "#f8fafc";
        ctrl.style.color = "#64748b";
        ctrl.style.cursor = "not-allowed";
      });
    });
    skBtn.style.display = "none";
    skField.querySelector(".hint")?.remove();
    akField.querySelector(".hint")?.remove();
    form.insertAdjacentHTML("afterbegin", `<div class="field full" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;color:#64748b;font-size:12px;">已带入 ${escapeHtml(data.name)} 的服务商信息与 AK/SK，本次仅维护地域及对接人信息。</div>`);
  }

  // 输入时重置校验状态，提示需重新校验
  skInput.addEventListener("input", () => {
    if (skConfirmState.sk) { skConfirmState.sk = false; skBtn.classList.remove("btn-primary", "btn-danger"); skBtn.innerHTML = "校验"; }
    updateProviderConfirmState();
  });

  const confirmHandler = () => {
    const input = skInput;
    const btn = skBtn;
    const val = input.value.trim();
    if (!val) { toast("请先输入 AccessKey Secret", "error"); return; }
    // 模拟调用接口验证 SK
    btn.disabled = true; btn.textContent = "验证中...";
    setTimeout(() => {
      btn.disabled = false;
      const ok = val.length >= 4 && !/fail|error|错误|失败/i.test(val);
      skConfirmState.sk = ok;
      btn.classList.remove("btn-primary", "btn-danger");
      btn.classList.add(ok ? "btn-primary" : "btn-danger");
      btn.innerHTML = `<i data-lucide="${ok ? "check" : "x"}" style="width:13px;height:13px;"></i> ${ok ? "校验成功" : "校验失败"}`;
      if (window.lucide) window.lucide.createIcons();
      updateProviderConfirmState();
      toast("AccessKey Secret" + (ok ? " 校验成功" : " 校验失败"), ok ? "success" : "error");
    }, 600);
  };
  skBtn.addEventListener("click", confirmHandler);

  form.appendChild(fieldWrap("对接人姓名", el(`<input class="input" name="contact" value="${escapeHtml(data.contact || "")}" />`)));
  form.appendChild(fieldWrap("对接人手机号", el(`<input class="input" name="phone" value="${escapeHtml(data.phone || "")}" />`)));

  const toggleAkSk = () => {
    const t = form.querySelector("[name=type]").value;
    const show = t === "公有云" || t === "专有云";
    akField.style.display = show ? "" : "none";
    skField.style.display = show ? "" : "none";
    updateProviderConfirmState();
  };
  form.querySelector("[name=type]").addEventListener("change", toggleAkSk);
  toggleAkSk();

  function updateProviderConfirmState() {
    const confirmBtn = $("#modalConfirm");
    if (!confirmBtn) return;
    const t = form.querySelector("[name=type]")?.value;
    const needSkCheck = t === "公有云" || t === "专有云";
    const ok = isRegionOnly || !needSkCheck || skConfirmState.sk;
    confirmBtn.classList.toggle("btn-primary", ok);
    confirmBtn.style.opacity = ok ? "" : ".55";
    confirmBtn.style.boxShadow = ok ? "" : "none";
  }

  Modal.open({
    title: isRegionOnly ? (isEdit ? "编辑地域" : "新增地域") : (isEdit ? "编辑" : "新增") + "服务商",
    body: form,
    confirmText: isEdit ? "保存" : "创建",
    onConfirm: () => {
      const inputs = form.querySelectorAll("[name]");
      inputs.forEach(i => { data[i.name] = i.value.trim(); });
      if (isRegionOnly) {
        data.name = (isEdit ? item.name : preset.name) || data.name;
        data.type = (isEdit ? item.type : preset.type) || data.type;
        data.ak = (isEdit ? item.ak : preset.ak) || data.ak;
        data.sk = (isEdit ? item.sk : preset.sk) || data.sk;
        data.createdBy = (isEdit ? item.createdBy : preset.createdBy) || data.createdBy;
        if (isEdit) data.region = item.region || data.region;
      }
      if (!data.name) { toast("请选择服务商名称", "error"); return false; }
      if (!data.region) { toast("请输入地域信息", "error"); return false; }
      if (!isRegionOnly && (data.type === "公有云" || data.type === "专有云")) {
        if (!data.ak || !data.sk) { toast("公有云 / 专有云需要录入 AK · SK", "error"); return false; }
        if (!skConfirmState.sk) { toast("请完成 AccessKey Secret 校验", "error"); return false; }
      } else if (data.type !== "公有云" && data.type !== "专有云") {
        data.ak = "";
        data.sk = "";
      }

      data.updatedAt = nowStr();
      if (isEdit) Object.assign(item, data);
      else State.provider.unshift(data);
      persist("provider");
      setView("provider");

  $("#cardVendorFilter").addEventListener("change", () => { cardModelPage = 1; renderRows(); });
  $("#cardModelQuery").addEventListener("click", () => { cardModelPage = 1; renderRows(); });
  $("#cardModelReset").addEventListener("click", () => {
    $("#cardModelSearch").value = "";
    $("#cardCodeSearch").value = "";
    $("#cardVendorFilter").value = "";

  });

      State.userCardModel = State.userCardModel.filter(x => x.id !== id);
      persist("userCardModel");
      renderRows();
      toast("已删除", "success");
    }
  });
  renderRows();
}

function modelDictOptions(dict, current) {
  return Object.entries(dict).map(([value, label]) => `<option value="${value}" ${String(current) === value ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");

  return `<span class="tag tag-muted">${text}</span>`;
}

// ===== 销售品审核中心 =====
const PRODUCT_AUDIT_TYPES = ["销售品上架", "销售品下架", "销售品改价", "调整门户范围", "申请独占资源"];
function productStockRequests(productId, status = "approved") {
  return (State.productStockRequest || []).filter(r => {
    if (status && r.status !== status) return false;
    const ids = r.productIds || productAuditItems(r).map(item => item.productId);
    return ids.includes(productId) || r.productId === productId;
  });
}
function productSoldStock(product) {
  return Math.max(0, Number(product?.soldStock) || 0);
}
function productApprovedExclusive(productId, portalSiteId = "") {
  return (State.productStockRequest || []).reduce((sum, r) => {
    if (r.status !== "approved") return sum;
    if (r.type && r.type !== "申请独占资源") return sum;
    return sum + productAuditItems(r).reduce((itemSum, item) => {
      if (item.productId !== productId) return itemSum;
      if (portalSiteId && item.portalSiteId !== portalSiteId) return itemSum;
      return itemSum + (Number(item.exclusiveQty ?? item.qty) || 0);
    }, 0);
  }, 0);
}
function productSharedStock(product) {
  if (!product || Number(product.stock) < 0) return Infinity;
  const total = Math.max(0, Number(product.stock) || 0);
  return Math.max(0, total - productSoldStock(product) - productApprovedExclusive(product.id));
}
function productPortalSellable(product, portalSiteId) {
  if (!product || Number(product.stock) < 0) return Infinity;
  return productSharedStock(product) + productApprovedExclusive(product.id, portalSiteId);
}
function stockText(value) {
  return value === Infinity ? "无限" : String(Math.max(0, Number(value) || 0));
}
function stockRequestStatusTag(status) {
  if (status === "approved") return '<span class="tag tag-success">已通过</span>';
  if (status === "rejected") return '<span class="tag tag-muted">已驳回</span>';
  return '<span class="tag tag-warning">待审核</span>';
}
function inventorySourceLabel(source) {
  if (source === "api") return "接口同步";
  if (source === "device") return "设备编号获取";
  return "手动维护";
}
function inventorySourceTag(source) {
  if (source === "api") return '<span class="tag tag-primary">接口同步</span>';
  if (source === "device") return '<span class="tag tag-success">设备编号获取</span>';
  return '<span class="tag tag-warning">手动维护</span>';
}
function productAuditItems(req) {
  return Array.isArray(req.items) && req.items.length ? req.items : [{ productId: req.productId, portalSiteId: req.portalSiteId, exclusiveQty: req.qty, reason: req.reason }];
}
function productAuditRelatedCount(req) {
  return (req.productIds || []).length || productAuditItems(req).filter(item => item.productId).length || 0;
}
function auditProductName(id) {
  return State.product.find(p => p.id === id)?.name || "—";
}
function auditPortalName(id) {
  return PORTAL_SITES.find(p => p.id === id)?.name || id || "—";
}
function auditRequestDetail(req) {
  const items = productAuditItems(req);
  if (req.type === "申请独占资源") return items.map(item => `${auditProductName(item.productId)} / ${auditPortalName(item.portalSiteId)} / 独占 ${Number(item.exclusiveQty ?? item.qty) || 0}`).join("；");
  if (req.type === "销售品改价") return items.map(item => `${auditProductName(item.productId)}：按量 ${Number(item.sellOnDemand) || 0}，包周期 ${Number(item.sellMonthly) || 0}`).join("；");
  if (req.type === "调整门户范围") return items.map(item => `${auditProductName(item.productId)}：${(item.portalSiteIds || []).map(auditPortalName).join("、") || "无门户"}`).join("；");
  return items.map(item => auditProductName(item.productId)).join("、");
}
function applyProductAudit(req) {
  if (req.type === "申请独占资源") {
    const invalid = productAuditItems(req).some(item => {
      const product = State.product.find(p => p.id === item.productId);
      const qty = Number(item.exclusiveQty ?? item.qty) || 0;
      return product && product.productType !== "cloudDisk" && qty > productSharedStock(product);
    });
    if (invalid) {
      toast("共享库存不足，无法通过", "error");
      return false;
    }
  }
  productAuditItems(req).forEach(item => {
    const product = State.product.find(p => p.id === item.productId);
    if (!product) return;
    if (req.type === "销售品上架") product.status = "active";
    if (req.type === "销售品下架") product.status = "inactive";
    if (req.type === "销售品改价") {
      product.sellOnDemand = Number(item.sellOnDemand) || 0;
      product.sellMonthly = Number(item.sellMonthly) || 0;
      product.basePrice = product.sellMonthly || product.basePrice;
    }
    if (req.type === "调整门户范围") product.portalSiteIds = item.portalSiteIds || [];
    product.updatedAt = nowStr();
  });
  if (req.type !== "申请独占资源") persist("product");
  return true;
}
function fieldHtml(label, html, opts = {}) {
  return `<div class="field ${opts.full ? "full" : ""}"><label class="${opts.required ? "required" : ""}">${escapeHtml(label)}</label>${html}${opts.hint ? `<div class="hint">${escapeHtml(opts.hint)}</div>` : ""}</div>`;
}

function auditProductBundleInfo(product) {
  const computes = resolveProductComputes(product);
  const compute = computes[0];
  const cloudDisk = (product.cloudDiskIds || []).map(id => State.cloudDisk.find(d => d.id === id)).filter(Boolean)[0];
  const systemDisk = State.systemDisk.find(x => x.id === product.systemDiskId);
  const bandwidth = State.bandwidth.find(x => x.id === product.bandwidthId);
  const dataDisks = (product.dataDiskIds || []).map(id => State.dataDisk.find(d => d.id === id)).filter(Boolean);
  const providerId = compute?.providerId || cloudDisk?.providerId || systemDisk?.providerId || bandwidth?.providerId || dataDisks[0]?.providerId || product.providerId;
  const provider = State.provider.find(p => p.id === providerId);
  const region = provider?.region || compute?.poolRegion || product.region || "—";
  return { computes, compute, cloudDisk, systemDisk, bandwidth, dataDisks, provider, region };
}

function auditChargeModeText(product) {
  const modes = getProductChargeModes(product);
  const names = [];
  if (modes.includes("monthly")) names.push("包周期");
  if (modes.includes("onDemand")) names.push("按量");
  return names.join("、") || "—";
}
