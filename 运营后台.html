  ];
  const periodOptions = RENEW_PERIOD_OPTIONS.map(opt => `<option value="${opt.value}" ${Number(opt.value) === renewPeriod ? "selected" : ""}>${escapeHtml(opt.label)}</option>`).join("");
  const actionText = isRenew ? "续订后实例将延长服务周期，并保留原资源绑定关系。" : "⚠️ 退订后实例资源将立即释放，数据无法恢复，请确认已备份重要业务数据。";
  return el(`<div class="ops-detail" style="display:flex;flex-direction:column;gap:12px;">
    <div style="padding:12px 14px;border:1px solid ${isRenew ? "#e2e8f0" : "#fecaca"};border-radius:12px;background:${isRenew ? "#f8fafc" : "#fff1f2"};color:${isRenew ? "#475569" : "#be123c"};font-size:13px;line-height:1.7;font-weight:${isRenew ? "500" : "700"};">${escapeHtml(actionText)}</div>
    ${isRenew ? `<div class="form" style="grid-template-columns:1fr;margin:0;"><div class="field"><label class="required">续订周期</label><select class="select" name="renewPeriod">${periodOptions}</select><div class="hint">用户可选择本次续订周期，确认后写回工单。</div></div></div>` : ""}
    <div class="table-wrap">
      <table class="table" style="min-width:620px;">
        <thead><tr><th style="width:170px;">字段</th><th>内容</th></tr></thead>
        <tbody>
          ${rows.map(([k, v]) => `<tr><td style="color:#64748b;font-weight:700;">${escapeHtml(k)}</td><td>${escapeHtml(v || "—")}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`);
}

function openEcoTicketProvision(ticket, afterDone) {
  const qty = Math.max(1, Number(ticket.orderQty) || 1);
  const providers = ["并行科技", "腾讯云", "天翼云生态", "高校科研生态池", "工业制造生态池"];
  const savedResources = ticket.ecoResources || [];
  const resources = Array.from({ length: qty }, (_, i) => {
    const saved = savedResources[i] || {};
    return {
      resourceId: saved.resourceId || (ticket.resourceId && qty === 1 ? ticket.resourceId : ""),
      ip: saved.ip || ticket.instance?.ips?.[i] || "",
      ipReport: saved.ipReport || "报备中",
      region: saved.region || ticketOrgCity(ticket),
    };
  });
  const providerOptions = providers.map(p => `<option value="${escapeHtml(p)}" ${p === (ticket.ecoProviderName || "") ? "selected" : ""}>${escapeHtml(p)}</option>`).join("");
  const period = Number(ticket.duration || ticket.period || 12) || 12;
  const body = el(`<div class="ledger-form-shell">
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="cloud"></i><span>1. 生态服务商信息</span></div>
        <div class="ledger-form-section-sub">生态资源由服务商侧开通后回填资源信息</div>
      </div>
      <div class="ledger-form-grid">
        <div class="ledger-readonly-cell"><div class="k">工单 ID</div><div class="v mono">${escapeHtml(ticket.id)}</div></div>
        <div class="ledger-readonly-cell"><div class="k">订购信息</div><div class="v">${escapeHtml(ticketOrderInfo(ticket))}</div></div>
        <div class="ledger-readonly-cell"><div class="k">客户经理信息</div><div class="v">${escapeHtml(ticketManagerInfo(ticket))}</div></div>
        <div class="ledger-readonly-cell"><div class="k">用户信息</div><div class="v">${escapeHtml(ticketUserInfo(ticket))}</div></div>
        <div class="ledger-form-field"><label class="required">生态服务商</label><select class="select" name="ecoProviderName"><option value="">请选择服务商</option>${providerOptions}</select></div>
        <div class="ledger-form-field"><label class="required">服务商订单号</label><input class="input" name="externalOrderId" value="${escapeHtml(ticket.externalOrderId || "")}" placeholder="服务商侧订单号" /></div>
      </div>
    </div>
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="server"></i><span>2. 生态资源回填</span></div>
        <div class="ledger-form-section-sub">按订购数量回填 ${qty} 条；无需维护设备编号</div>
      </div>
      <div class="ledger-resource-editor" id="ecoTicketResources"></div>
    </div>
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="receipt-text"></i><span>3. 开通确认</span></div>
        <div class="ledger-form-section-sub">确认后生成订单号并同步工单状态</div>
      </div>
      <div class="ledger-form-grid">
        <div class="ledger-readonly-cell"><div class="k">服务商类型</div><div class="v">生态</div></div>
        <div class="ledger-readonly-cell"><div class="k">订购时长</div><div class="v">${escapeHtml(renewPeriodLabel(period))}</div></div>
        <div class="ledger-form-field full"><label>备注</label><textarea name="notes" placeholder="输入生态服务商交付说明、异常备注等...">${escapeHtml(ticket.ecoNotes || "")}</textarea></div>
      </div>
    </div>
  </div>`);
  const resBox = body.querySelector("#ecoTicketResources");
  function paintResources() {
    resBox.innerHTML = resources.map((r, i) => `
      <div class="ledger-resource-edit-card">
        <div class="ledger-resource-edit-head">
          <div class="ledger-resource-edit-title"><span class="dot">${i + 1}</span><span>资源行 ${i + 1}</span></div>
          <span class="tag tag-warning">生态资源</span>
        </div>
        <div class="ledger-resource-edit-grid" style="grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div class="ledger-form-field"><label>服务商资源 ID</label><input class="input" data-idx="${i}" data-field="resourceId" value="${escapeHtml(r.resourceId)}" placeholder="ECO-RES-0001" /></div>
          <div class="ledger-form-field"><label>IP 地址</label><input class="input" data-idx="${i}" data-field="ip" value="${escapeHtml(r.ip)}" placeholder="10.88.12.20" /></div>
          <div class="ledger-form-field"><label>部署地域</label><input class="input" data-idx="${i}" data-field="region" value="${escapeHtml(r.region)}" placeholder="南京" /></div>
          <div class="ledger-form-field"><label>IP 报备结果</label><select class="select" data-idx="${i}" data-field="ipReport">
            ${["报备中", "已报备", "待报备", "未报备"].map(s => `<option value="${s}" ${s === r.ipReport ? "selected" : ""}>${s}</option>`).join("")}
          </select></div>
        </div>
      </div>`).join("");
    resBox.querySelectorAll("[data-idx]").forEach(inp => {
      const eventName = inp.tagName === "SELECT" ? "change" : "input";
      inp.addEventListener(eventName, e => {
        const idx = Number(e.target.dataset.idx);
        resources[idx][e.target.dataset.field] = e.target.value;
      });
    });
    if (window.lucide) window.lucide.createIcons();
  }
  paintResources();
  Modal.open({
    title: "生态资源开通",
    body,
    wide: true,
    confirmText: "确认提交",
    onConfirm: () => {
      const ecoProviderName = body.querySelector("[name=ecoProviderName]").value.trim();
      const externalOrderId = body.querySelector("[name=externalOrderId]").value.trim();
      if (!ecoProviderName || !externalOrderId) {
        toast("请选择生态服务商并填写服务商订单号", "error");
        return false;
      }
      if (resources.some(r => !String(r.resourceId || "").trim() || !String(r.ip || "").trim())) {
        toast("请完整填写服务商资源 ID 和 IP 地址", "error");
        return false;
      }
      const orderId = ticket.orderId || ("ORD-" + ticket.id.replace(/^IDC-/, ""));
      ticket.providerType = "eco";
      ticket.ecoProviderName = ecoProviderName;
      ticket.externalOrderId = externalOrderId;
      ticket.ecoResources = resources.map(r => ({ ...r }));
      ticket.resourceIds = resources.map(r => r.resourceId);
      ticket.resourceId = resources[0]?.resourceId || "";
      ticket.bandwidth = ticket.bandwidth || 0;
      ticket.orderId = orderId;
      ticket.status = "done";
      ticket.ecoNotes = body.querySelector("[name=notes]").value.trim();
      ticket.instance = {
        ...(ticket.instance || {}),
        orderId,
        count: resources.length,
        ips: resources.map(r => r.ip),
        instanceName: ticket.resourceName || `${ticket.productName || "生态资源"}实例`,
      };
      ticket.updatedAt = nowStr();
      persist("ticket");
      toast("生态资源已开通", "success");
      if (typeof afterDone === "function") afterDone();
      return true;
    },
  });
}

function openManualTicketProvision(ticket) {
  const existed = (State.ledger || []).find(r => r.sourceTicketId === ticket.id);
  const storageTicket = isStorageTicket(ticket);
  const sku = storageTicket ? "STORAGE" : (String(ticket.productName || "").includes("910") ? "910C" : "4090");
  const product = storageTicket
    ? { value: "STORAGE", label: ticket.productName || "存储销售品", monthlyPrice: Number(ticket.monthlyPrice) || 9800 }
    : (LEDGER_PRODUCT_OPTIONS.find(p => p.value === sku) || LEDGER_PRODUCT_OPTIONS[1]);
  const cityFromOrg = (ticket.managerOrg || "").match(/南京|无锡|徐州|常州|苏州|南通|连云港|淮安|盐城|扬州|镇江|泰州|宿迁|战客中心/)?.[0] || "战客中心";
  const orderQty = Math.max(1, Number(ticket.orderQty) || 2);
  const storageTb = storageTicket ? storageTicketTb(ticket) : 0;
  const toDatetimeInput = (v) => String(v || "").replace(" ", "T").slice(0, 16);
  const currentDatetimeInput = () => {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const minOpenTime = currentDatetimeInput();
  const data = existed ? JSON.parse(JSON.stringify(existed)) : {
    id: "LED-" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + "-" + Math.floor(1000 + Math.random() * 9000),
    productSku: sku,
    productName: storageTicket ? (ticket.productName || "存储销售品") : "智算云 - 自建" + sku,
    sourceType: "idc",
    sourceTicketId: ticket.id,
    source: ticket.id,
    dcCode: "DC-" + ticket.id.slice(-4),
    enterpriseName: ticket.userName + "企业",
    clientName: ticket.userName,
    phone: ticket.userPhone,
    city: cityFromOrg,
    bandwidth: "",
    period: ticket.duration || ticket.renewPeriod || "",
    productMonthlyPrice: product.monthlyPrice,
    bandwidthMonthlyPrice: storageTicket ? 0 : LEDGER_BANDWIDTH_MONTHLY_PRICE,
    totalPrice: 0,
    notes: "",
    provisionTime: "",
    status: "bound",
    createdAt: nowStr(),
    updatedAt: nowStr(),
    resources: [],
  };
  const ledgerField = (label, controlHtml, opts = {}) => `
    <div class="ledger-form-field ${opts.full ? "full" : ""}">
      <label class="${opts.required ? "required" : ""}">${escapeHtml(label)}</label>
      ${controlHtml}
      ${opts.hint ? `<div class="hint">${escapeHtml(opts.hint)}</div>` : ""}
    </div>`;
  const savedResources = data.resources || [];
  const resList = Array.from({ length: orderQty }, (_, i) => {
    const r = savedResources[i] || {};
    const fallbackBandwidth = Number(data.bandwidth) > 0 ? Math.round((Number(data.bandwidth) / orderQty) * 100) / 100 : "";
    return {
      subTicketId: r.subTicketId || `${ticket.id}-SUB-${String(i + 1).padStart(2, "0")}`,
      deviceNo: r.deviceNo || r.resourceId || "",
      ip: r.ip || "",
      mountPoint: r.mountPoint || "",
      localMountDir: r.localMountDir || "",
      bandwidth: storageTicket ? "" : (r.bandwidth || fallbackBandwidth),
      note: r.note || ""
    };
  });
  const form = el(`<div class="ledger-form-shell">
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="file-check-2"></i><span>1. 工单信息</span></div>
        <div class="ledger-form-section-sub"><span class="tag tag-primary">主工单ID：${escapeHtml(ticket.id)}</span></div>
      </div>
      <div class="ledger-form-grid">
        <div class="ledger-readonly-cell"><div class="k">订购信息</div><div class="v">${escapeHtml(ticketOrderInfo(ticket))}</div></div>
        <div class="ledger-readonly-cell"><div class="k">业务归属地市</div><div class="v">${escapeHtml(data.city || "—")}</div><input type="hidden" name="city" value="${escapeHtml(data.city || "")}" /></div>
        <div class="ledger-readonly-cell"><div class="k">DC编码</div><div class="v">${escapeHtml(data.dcCode || "—")}</div><input type="hidden" name="dcCode" value="${escapeHtml(data.dcCode || "")}" /></div>
        <div class="ledger-readonly-cell"><div class="k">客户经理信息</div><div class="v">${escapeHtml(ticketManagerInfo(ticket))}</div></div>
        <div class="ledger-readonly-cell"><div class="k">企业名称</div><div class="v">${escapeHtml(data.enterpriseName || ticket.userName + "企业")}</div></div>
        <div class="ledger-readonly-cell"><div class="k">用户信息</div><div class="v">${escapeHtml(ticketUserInfo(ticket))}</div></div>
      </div>
    </div>
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="${storageTicket ? "hard-drive" : "server"}"></i><span>2. ${storageTicket ? "绑定存储资源与挂载信息" : "绑定机器资源及IP"}</span></div>
        <div class="ledger-form-section-sub">${storageTicket ? `资源容量由主工单订购数量同步：${storageTb}TB` : `子工单数量由主工单订购数量同步：${orderQty} 条`}</div>
      </div>
      <div class="ledger-resource-editor" id="manualTicketResources"></div>
    </div>
    <div class="ledger-form-section">
      <div class="ledger-form-section-head">
        <div class="ledger-form-section-title"><i data-lucide="receipt-text"></i><span>3. 计费与备注</span></div>
        <div class="ledger-form-section-sub">字段参照资源台账模块</div>
      </div>
      <div class="ledger-form-grid">
        ${ledgerField("包周期 (月)", `<input class="input" type="number" name="period" value="${data.period || ""}" placeholder="自动获取" readonly />`, { hint: "自动获取自对应工单契约信息" })}
        ${ledgerField("开通时间", `<input class="input" type="datetime-local" name="provisionTime" min="${minOpenTime}" value="${escapeHtml(toDatetimeInput(data.provisionTime || ""))}" />`, { hint: "开通时间不能小于系统当前时间" })}
        ${ledgerField("释放时间", `<input class="input" name="releaseTime" value="${escapeHtml(data.releaseTime || "")}" readonly placeholder="根据包周期与开通时间自动计算" />`, { hint: "系统自动计算 = 开通时间 + 包周期" })}
        <div class="ledger-price-box full" id="manualTicketPrice"></div>
        ${ledgerField("备注", `<textarea name="notes" placeholder="输入交付说明、计费口径或特殊事项...">${escapeHtml(data.notes || "")}</textarea>`, { full: true })}
      </div>
    </div>
  </div>`);
  const resBox = form.querySelector("#manualTicketResources");

  function paintResources() {
    resBox.innerHTML = resList.map((r, i) => `
      <div class="ledger-resource-edit-card">
        <div class="ledger-resource-edit-head">
          <div class="ledger-resource-edit-title"><span class="dot">${i + 1}</span><span>资源行 ${i + 1}</span></div>
          <div></div>
        </div>
        <div class="ledger-resource-edit-grid" style="grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div class="ledger-form-field"><label>${storageTicket ? "资源ID" : "设备编号"}</label>${storageTicket ? `<input class="input" data-idx="${i}" data-field="deviceNo" value="${escapeHtml(r.deviceNo)}" placeholder="请输入资源ID" />` : `<select class="select" data-idx="${i}" data-field="deviceNo">${deviceNoSelectOptions(r.deviceNo)}</select>`}</div>
          ${storageTicket ? `<div class="ledger-form-field"><label>挂载点</label><input class="input" data-idx="${i}" data-field="mountPoint" value="${escapeHtml(r.mountPoint)}" placeholder="如 10.0.12.8:/efs/data" /></div>` : ""}
          ${storageTicket ? `<div class="ledger-form-field"><label>本地挂载目录</label><input class="input" data-idx="${i}" data-field="localMountDir" value="${escapeHtml(r.localMountDir)}" placeholder="如 /mnt/efs/data" /></div>` : ""}
          ${storageTicket ? "" : `<div class="ledger-form-field"><label>资源IP</label><input class="input" data-idx="${i}" data-field="ip" value="${escapeHtml(r.ip)}" placeholder="10.10.20.31" /></div>`}
          ${storageTicket ? "" : `<div class="ledger-form-field"><label>子工单带宽 (Mbps)</label><input class="input" type="number" min="0" data-idx="${i}" data-field="bandwidth" value="${escapeHtml(r.bandwidth)}" placeholder="如 50" /></div>`}
          <div class="ledger-form-field"><label>备注</label><input class="input" data-idx="${i}" data-field="note" value="${escapeHtml(r.note)}" placeholder="节点用途" /></div>
        </div>
      </div>`).join("");
    resBox.querySelectorAll("[data-idx]").forEach(inp => {
      const eventName = inp.tagName === "SELECT" ? "change" : "input";
      inp.addEventListener(eventName, e => {
        const idx = Number(e.target.dataset.idx);
        resList[idx][e.target.dataset.field] = e.target.value;
        calcPrice();
      });
    });
    if (window.lucide) window.lucide.createIcons();
  }

  function calcPrice() {
    const machineCount = storageTicket ? storageTb : orderQty;
    const bandwidth = storageTicket ? 0 : resList.reduce((sum, r) => sum + (Number(r.bandwidth) || 0), 0);
    const period = Number(form.querySelector("[name=period]").value) || 0;
    const productFee = product.monthlyPrice * machineCount;
    const bandwidthFee = storageTicket ? 0 : bandwidth * LEDGER_BANDWIDTH_MONTHLY_PRICE;
    const total = (productFee + bandwidthFee) * period;
    // Auto-calculate release time = provisionTime + period months
    const ptVal = form.querySelector("[name=provisionTime]")?.value || "";
    const rtInput = form.querySelector("[name=releaseTime]");
    if (rtInput) {
      if (ptVal && period > 0) {
        const d = new Date(ptVal);
        d.setMonth(d.getMonth() + period);
        const pad = n => String(n).padStart(2, "0");
        rtInput.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } else {
        rtInput.value = "";
      }
    }
    form.querySelector("#manualTicketPrice").innerHTML = `
      <div class="ledger-price-title">结算费用</div>
      <div class="ledger-price-grid">
        <span>${storageTicket ? "存储费用" : "实例费用"}</span><strong>${storageTicket ? "" : escapeHtml(product.label) + " · "}${fmtMoney(product.monthlyPrice)} × ${machineCount} ${storageTicket ? "TB" : "台"}</strong>
        ${storageTicket ? "" : `<span>带宽费用</span><strong>${bandwidth} Mbps × ${fmtMoney(LEDGER_BANDWIDTH_MONTHLY_PRICE)}</strong>`}
        <span>包周期</span><strong>${period || 0} 个月</strong>
        <span>合计</span><strong class="price">${fmtMoney(total)}</strong>
      </div>`;
    data.totalPrice = total;
  }

  paintResources();
  calcPrice();
  form.querySelector("[name=period]").addEventListener("input", calcPrice);
  form.querySelector("[name=provisionTime]").addEventListener("input", calcPrice);

  Modal.open({
    title: "开通资源补录",
    body: form,
    wide: true,
    confirmText: "确认提交",
    onConfirm: () => {
      const cleanResources = resList.map(r => storageTicket
        ? { resourceId: r.deviceNo, deviceNo: r.deviceNo, mountPoint: r.mountPoint, localMountDir: r.localMountDir, note: r.note }
        : { ...r });
      if (!form.querySelector("[name=dcCode]").value.trim() || !form.querySelector("[name=city]").value.trim()) {
        toast("请填写 DC编码和业务归属地市", "error");
        return false;
      }
      if (!cleanResources.length || cleanResources.some(r => storageTicket ? (!r.deviceNo || !r.mountPoint || !r.localMountDir) : (!r.deviceNo || !r.ip))) {
        toast(storageTicket ? "请完整填写资源ID、挂载点和本地挂载目录" : "请完整填写设备编号和资源IP", "error");
        return false;
      }
      if (!storageTicket && cleanResources.some(r => !(Number(r.bandwidth) > 0))) {
        toast("请填写子工单带宽", "error");
        return false;
      }
      const provisionValue = form.querySelector("[name=provisionTime]").value;
      if (provisionValue && provisionValue < currentDatetimeInput()) {
        toast("开通时间不能小于系统当前时间", "error");
        return false;
      }
      calcPrice();
      const ledger = {
        ...data,
        orderId: ticket.orderId || ("ORD-" + ticket.id.replace(/^IDC-/, "")),
        productSku: product.value,
        productName: storageTicket ? (ticket.productName || product.label) : "智算云 - 自建" + product.value,
        sourceType: "idc",
        sourceTicketId: ticket.id,
        source: ticket.id,
        dcCode: form.querySelector("[name=dcCode]").value.trim(),
        enterpriseName: data.enterpriseName || ticket.userName + "企业",
        clientName: ticket.userName,
        phone: ticket.userPhone,
        city: form.querySelector("[name=city]").value.trim(),
        bandwidth: storageTicket ? 0 : cleanResources.reduce((sum, r) => sum + (Number(r.bandwidth) || 0), 0),
        period: form.querySelector("[name=period]").value ? Number(form.querySelector("[name=period]").value) : 0,
        provisionTime: provisionValue,
        releaseTime: form.querySelector("[name=releaseTime]")?.value || "",
        notes: form.querySelector("[name=notes]").value.trim(),
        resources: cleanResources,
        productMonthlyPrice: product.monthlyPrice,
        bandwidthMonthlyPrice: storageTicket ? 0 : LEDGER_BANDWIDTH_MONTHLY_PRICE,
        status: "bound",
        updatedAt: nowStr(),
      };
      const idx = State.ledger.findIndex(r => r.id === ledger.id || r.sourceTicketId === ticket.id);
      if (idx >= 0) State.ledger[idx] = ledger;
      else State.ledger.push(ledger);
      ticket.status = "done";
      ticket.orderId = ledger.orderId;
      ticket.updatedAt = nowStr();
      persist("ledger");
      persist("ticket");
      toast("资源已补录并开通", "success");
      setView("ticket");
    },
  });
}

function ticketLinkedLedger(ticket) {
  const sourceIds = [ticket.id, ticket.relatedTicketId, ticket.sourceTicketId].filter(Boolean);
  return (State.ledger || []).find(r => sourceIds.includes(r.sourceTicketId) || sourceIds.includes(r.source));
}
function ticketMatchedCompute(ticket) {
  const instance = ticket.instance || {};
  if (instance.computeId) {
    const matched = (State.compute || []).find(c => c.id === instance.computeId);
    if (matched) return matched;
  }
  const name = String(ticket.productName || "").replace(/续订|退订/g, "");
  return (State.compute || []).find(c => name && (name.includes(c.name) || c.name.includes(name) || name.includes(c.instanceFamily || ""))) || (State.compute || [])[0];
}
function ticketProviderName(compute) {
  const provider = (State.provider || []).find(p => p.id === compute?.providerId);
  if (provider) return provider.name;
  const poolName = compute?.poolName || "";
  return poolName.includes("·") ? poolName.split("·")[0] : (poolName || "—");
}
function ticketDetailResources(ticket, ledger, qty) {
  if (Array.isArray(ticket.ecoResources) && ticket.ecoResources.length) {
    return ticket.ecoResources.map((r, i) => ({
      resourceId: r.resourceId || `${ticket.id}-ECO-${String(i + 1).padStart(2, "0")}`,
      ip: r.ip || "—",
      ipReport: r.ipReport || "报备中",
    }));
  }
  if (ledger?.resources?.length) {
    return ledger.resources.map((r, i) => ({
      resourceId: r.resourceId || r.deviceNo || r.subTicketId || `${ticket.id}-RES-${String(i + 1).padStart(2, "0")}`,
      ip: r.ip || "—",
      ipReport: r.ipReport || r.reportResult || r.ipReportResult || (r.ip ? "已报备" : "未报备"),
    }));
  }
  const count = Math.max(1, Number(ticket.instance?.count || ticket.orderQty || qty) || 1);
  const hasProvisionedResource = Boolean(ticket.instance || ticket.resourceId || ticket.instanceId);
  if (!hasProvisionedResource) {
    return Array.from({ length: count }, () => ({
      resourceId: "待分配",
      ip: "待分配",
      ipReport: "待报备",
    }));
  }
  const base = ticket.resourceId || ticket.instanceId || ticket.id.replace(/^IDC-/, "RES-");
  return Array.from({ length: count }, (_, i) => ({
    resourceId: `${base}-${String(i + 1).padStart(2, "0")}`,
    ip: ticket.instance?.ips?.[i] || `172.16.${10 + Math.floor(i / 50)}.${10 + (i % 50)}`,
    ipReport: ticket.status === "done" ? "已报备" : "未报备",
  }));
}
function ticketRelatedResourceIds(ticket, ledger, resources) {
  const ids = [];
  const pushId = v => {
    const text = String(v || "").trim();
    if (text && text !== "待分配" && !ids.includes(text)) ids.push(text);
  };
  if (Array.isArray(ticket.resourceIds)) ticket.resourceIds.forEach(pushId);
  pushId(ticket.resourceId);
  pushId(ticket.instanceId);
  (ledger?.resources || []).forEach(r => pushId(r.resourceId || r.deviceNo || r.subTicketId));
  (resources || []).forEach(r => pushId(r.resourceId));
  return ids;
}
function ticketResourceMetricHtml(resourceIds) {
  if (!resourceIds.length) return `<strong>—</strong>`;
  const full = resourceIds.join("、");
  const label = resourceIds.length > 2 ? `共 ${resourceIds.length} 个 · ${resourceIds.slice(0, 2).join("、")} 等` : full;
  return `<strong class="truncate" title="${escapeHtml(full)}">${escapeHtml(label)}</strong>`;
}

// ===== 资源台账 =====
function renderLedgerList() {
 const rows = State.ledger || [];
 const productTabs = ["全部", "自建4090", "自建910C"];
 let activeTab = State.filters?.ledgerTab || "全部";
let searchDc = State.filters?.ledgerSearchDc || "";
let searchEnt = State.filters?.ledgerSearchEnt || "";
 let searchTicketId = State.filters?.ledgerSearchTicketId || "";
 let searchUser = State.filters?.ledgerSearchUser || "";
let searchPhone = State.filters?.ledgerSearchPhone || "";
let selectedIds = new Set(State.filters?.ledgerSelectedIds || []);
let ledgerPage = State.filters?.ledgerPage || 1;
const ledgerPageSize = 10;

function buildRows() {
  let filtered = rows.slice();
  if (activeTab !== "全部") filtered = filtered.filter(r => r.productName && r.productName.includes(activeTab));
  if (searchDc.trim()) filtered = filtered.filter(r => (r.dcCode || "").toLowerCase().includes(searchDc.trim().toLowerCase()));
  if (searchTicketId.trim()) filtered = filtered.filter(r => (r.sourceTicketId || r.source || r.id || "").toLowerCase().includes(searchTicketId.trim().toLowerCase()));
  if (searchEnt.trim()) filtered = filtered.filter(r => (r.enterpriseName || r.companyName || "").toLowerCase().includes(searchEnt.trim().toLowerCase()));
  if (searchUser.trim()) filtered = filtered.filter(r => (r.clientName || "").toLowerCase().includes(searchUser.trim().toLowerCase()));
  if (searchPhone.trim()) filtered = filtered.filter(r => (r.phone || "").toLowerCase().includes(searchPhone.trim().toLowerCase()));
  return filtered;
 }

 function exportLedgerRows() {
   const filtered = buildRows();
   if (!filtered.length) {
     toast("当前筛选条件下暂无可导出台账", "warning");
     return;
   }
   const headers = [
     "DC编码", "企业名称", "客户名称", "手机号", "业务归属地市", "销售品",
     "订购数量", "总带宽(Mbps)", "包周期(月)", "预估总价", "开通时间",
     "关联来源", "状态", "资源明细"
   ];
   const csvCell = (value) => `"${String(value ?? "").replace(/"/g, '""')}"`;
   const lines = [headers.map(csvCell).join(",")].concat(filtered.map(r => {
     const resourceDetails = (r.resources || []).map((res, index) => {
       const parts = [`资源${index + 1}`];
       if (res.deviceNo) parts.push(`设备编号:${res.deviceNo}`);
       if (res.ip) parts.push(`IP:${res.ip}`);
       if (res.bandwidth) parts.push(`带宽:${res.bandwidth}Mbps`);
       return parts.join("/");
     }).join("；");
     return [
       r.dcCode || "",
       r.enterpriseName || r.companyName || "",
       r.clientName || "",
       r.phone || "",
       r.city || "",
       r.productName || "",
       (r.resources || []).length,
       r.bandwidth || "",
       r.period || "",
       r.totalPrice || "",
       r.provisionTime || "",
       r.sourceTicketId || r.source || "线下录入",
       r.status === "bound" ? "已绑定" : (r.status === "released" ? "已释放" : (r.status || "")),
       resourceDetails
     ].map(csvCell).join(",");
   }));
   const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
   const url = URL.createObjectURL(blob);
   const a = document.createElement("a");
   a.href = url;
   a.download = `资源台账_${new Date().toISOString().slice(0, 10)}.csv`;
   document.body.appendChild(a);
   a.click();
   a.remove();
   URL.revokeObjectURL(url);
   toast(`已导出 ${filtered.length} 条台账`, "success");
 }

  function statusTag(status) {
    if (status === "bound") return '<span class="tag tag-success">已绑定</span>';
    if (status === "released") return '<span class="tag tag-muted">已释放</span>';
    return '<span class="tag">' + escapeHtml(status || "—") + '</span>';
  }

  function sourceBadge(r) {
    if (r.sourceType === "idc" || r.sourceTicketId) return '<span class="tag tag-primary">工单：' + escapeHtml(r.sourceTicketId || r.source || "—") + '</span>';
    return '<span class="tag tag-muted">线下录入</span>';
  }

  function renderTable() {
    const filtered = buildRows();
    const tbody = $("#ledgerBody");
    if (!tbody) return;
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty">暂无台账数据</div></td></tr>';

      updateBillSelection();
      return;
    }
    const total = filtered.length;
    const pageCount = Math.max(1, Math.ceil(total / ledgerPageSize));
    ledgerPage = Math.min(Math.max(1, ledgerPage), pageCount);
    State.filters.ledgerPage = ledgerPage;
    const pageRows = filtered.slice((ledgerPage - 1) * ledgerPageSize, ledgerPage * ledgerPageSize);
    tbody.innerHTML = pageRows.map(r => {
      const resourceCount = (r.resources || []).length;
      return `<tr>
        <td><div class="ledger-mono">${escapeHtml(r.dcCode || "—")}</div></td>
        <td><strong>${escapeHtml(r.enterpriseName || r.companyName || "—")}</strong></td>

        <td><span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;">${escapeHtml(r.phone || "—")}</span></td>

             : `<button class="btn btn-sm" data-act="edit" data-id="${r.id}">编辑</button><button class="btn btn-sm btn-danger" data-act="delete" data-id="${r.id}">删除</button>`}

        </td>
      </tr>`;
    }).join("");
    const pager = $("#ledgerPager");
    if (pager) {
      pager.innerHTML = `
        <span>共 ${total} 条，每页 ${ledgerPageSize} 条，第 ${ledgerPage} / ${pageCount} 页</span>
        <span class="pager">
          <button class="btn" data-page="prev" ${ledgerPage <= 1 ? "disabled" : ""}>上一页</button>
          <button class="btn" data-page="next" ${ledgerPage >= pageCount ? "disabled" : ""}>下一页</button>
        </span>`;
    }
    if (window.lucide) window.lucide.createIcons();
    bindActions();
    bindSelection();
  }

  function bindActions() {
    $("#ledgerBody").querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = e.currentTarget.dataset.id;
        const act = e.currentTarget.dataset.act;
        const r = rows.find(x => x.id === id);
        if (!r) return;
        if (act === "detail") openLedgerDetail(r);
        if (act === "edit") openLedgerForm(r);
        if (act === "delete") {
          Modal.open({
            title: "删除台账",
            body: el(`<div style="text-align:center;padding:12px 0;">确认删除线下录入台账 <b>${escapeHtml(r.dcCode || r.id)}</b> 吗？</div>`),
            onConfirm: () => {
              const idx = State.ledger.findIndex(x => x.id === id);
              if (idx >= 0) State.ledger.splice(idx, 1);
              persist("ledger");
              render();
              toast("已删除", "success");
            }
          });
        }
      });
    });
  }

  function bindSelection() {
    const visibleIds = buildRows().filter(r => r.status === "bound" && getLedgerMonthInfo(r).unbilledMonths.length > 0).map(r => r.id);
    const allBox = $("#ledgerCheckAll");
    if (allBox) {
      const visibleSelected = visibleIds.filter(id => selectedIds.has(id));
      allBox.checked = visibleIds.length > 0 && visibleSelected.length === visibleIds.length;
      allBox.indeterminate = visibleSelected.length > 0 && visibleSelected.length < visibleIds.length;
      allBox.onchange = (e) => {
        visibleIds.forEach(id => e.target.checked ? selectedIds.add(id) : selectedIds.delete(id));
        State.filters.ledgerSelectedIds = Array.from(selectedIds);
        renderTable();
      };
    }
    $$("#ledgerBody .ledger-row-check").forEach(cb => {
      cb.addEventListener("change", (e) => {
        if (e.target.checked) selectedIds.add(e.target.value);
        else selectedIds.delete(e.target.value);
        State.filters.ledgerSelectedIds = Array.from(selectedIds);
        updateBillSelection();
        if (allBox) {
          const visibleSelected = visibleIds.filter(id => selectedIds.has(id));
          allBox.checked = visibleIds.length > 0 && visibleSelected.length === visibleIds.length;
          allBox.indeterminate = visibleSelected.length > 0 && visibleSelected.length < visibleIds.length;
        }
      });
    });
    updateBillSelection();

    resBox.innerHTML = resList.map((r, i) => `

  function calcLedgerPrice() {
    const productSel = form.querySelector("[name=productSku]");
    const selected = LEDGER_PRODUCT_OPTIONS.find(p => p.value === productSel.value) || LEDGER_PRODUCT_OPTIONS[0];

function monthKeyFromDate(value) {
  const s = String(value || "").trim();
  const m = s.match(/^(\d{4})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}`;
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function addMonths(monthKey, offset) {
  const [y, m] = String(monthKey || monthKeyFromDate()).split("-").map(Number);
  const d = new Date(y || new Date().getFullYear(), (m || 1) - 1 + Number(offset || 0), 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function getMonthRange(startMonth, endMonth) {
  const start = monthKeyFromDate(startMonth);
  const end = monthKeyFromDate(endMonth || startMonth);
  if (start > end) return [];
  const out = [];
  let cur = start;
  while (cur <= end && out.length < 120) {
    out.push(cur);
    cur = addMonths(cur, 1);
  }
  return out;
}

function monthLabel(monthKey) {
  const [y, m] = String(monthKey || "").split("-");
  return y && m ? `${Number(m)}月` : "—";
}

function compactMonthLabels(months, limit = 3) {
  const arr = Array.from(new Set(months || [])).sort();
  if (!arr.length) return "—";
  const labels = arr.slice(0, limit).map(monthLabel).join("、");
  return arr.length > limit ? `${labels} 等${arr.length}个月` : labels;
}

function fullMonthLabels(months) {
  const arr = Array.from(new Set(months || [])).sort();
  return arr.length ? arr.join(" / ") : "无";
}

function normalizeBillMonths(bill) {
  if (Array.isArray(bill.months) && bill.months.length) return Array.from(new Set(bill.months)).sort();
  const start = bill.billStartMonth || bill.billStart;
  const end = bill.billEndMonth || bill.billEnd || (bill.billMonths ? addMonths(monthKeyFromDate(start), Number(bill.billMonths) - 1) : start);
  return getMonthRange(start, end);
}

function getLedgerContractMonths(r) {
  const start = monthKeyFromDate(r.provisionTime || r.createdAt || nowStr());
  const period = Number(r.period) || 0;
  if (period > 0) return getMonthRange(start, addMonths(start, period - 1));
  const current = monthKeyFromDate(nowStr());
  return getMonthRange(start, current);
}

function getLedgerBilledMonths(ledgerId) {
  const months = new Set();
  (State.billing || []).forEach(bill => {
    const billMonths = normalizeBillMonths(bill);
    (bill.ledgerRefs || []).forEach(ref => {
      if (ref.id !== ledgerId) return;
      (ref.billedMonths && ref.billedMonths.length ? ref.billedMonths : billMonths).forEach(m => months.add(m));
    });
  });
  return Array.from(months).sort();
}

function getLedgerMonthInfo(r) {
  const contractMonths = getLedgerContractMonths(r);
  const billed = getLedgerBilledMonths(r.id);
  const contractSet = new Set(contractMonths);
  const billedInContract = billed.filter(m => contractSet.has(m));
  const unbilled = contractMonths.filter(m => !billed.includes(m));
  return { contractMonths, billedMonths: billedInContract, unbilledMonths: unbilled };
}

function ledgerBillingCell(r) {
  const info = getLedgerMonthInfo(r);
  if (r.status !== "bound") return `<div class="ledger-bill-months"><span class="tag tag-muted">无需出账</span><div class="ledger-month-detail">资源已释放</div></div>`;
  return `<div class="ledger-bill-months">
    <div class="ledger-month-line done"><span class="dot"></span><span>已出账 <strong>${info.billedMonths.length}</strong> 月</span></div>
    <div class="ledger-month-detail">${compactMonthLabels(info.billedMonths)}</div>
    <div class="ledger-month-line todo"><span class="dot"></span><span>未出账 <strong>${info.unbilledMonths.length}</strong> 月</span></div>
    <div class="ledger-month-detail">${compactMonthLabels(info.unbilledMonths)}</div>
  </div>`;
}

function calcLedgerMonthlyAmount(r) {
  const machineCount = Math.max(1, (r.resources || []).length || 1);
  const productMonthly = Number(r.productMonthlyPrice) || (LEDGER_PRODUCT_OPTIONS.find(p => p.value === (r.productSku || (String(r.productName || "").includes("910C") ? "910C" : "4090")))?.monthlyPrice || 0);
  const bandwidthMonthly = Number(r.bandwidthMonthlyPrice) || LEDGER_BANDWIDTH_MONTHLY_PRICE;
  const bandwidth = Number(r.bandwidth) || 0;
  return (productMonthly * machineCount) + (bandwidthMonthly * bandwidth);
}

function billStatusTag(status) {
  const map = {
    generated: ["已生成", "tag-primary"],
    pending: ["已生成", "tag-primary"],
    submitted: ["线下已提交", "tag-muted"],
    paid: ["已出账", "tag-success"],
  };
  const [text, cls] = map[status] || ["已生成", "tag-primary"];
  return `<span class="tag ${cls}">${text}</span>`;
}

function renderBillingList() {
 let searchBillId = State.filters?.billingSearchBillId || "";
 let searchDc = State.filters?.billingSearchDc || "";
 let searchEnt = State.filters?.billingSearchEnt || "";
 let selectedBillingCities = Array.isArray(State.filters?.billingSearchCities)
   ? State.filters.billingSearchCities.slice()
   : (State.filters?.billingSearchCity ? [State.filters.billingSearchCity] : []);
 let billingPage = State.filters?.billingPage || 1;
 const billingPageSize = 10;
 const billCycleMonth = addMonths(monthKeyFromDate(nowStr()), -1);
  let startMonthFilter = State.filters?.billingStartMonth || State.filters?.billingMonth || billCycleMonth;
  let endMonthFilter = State.filters?.billingEndMonth || State.filters?.billingMonth || startMonthFilter;
  const rows = State.billing || [];

  function buildMonthlyRows() {
    return rows.flatMap(bill => (bill.ledgerRefs || []).flatMap(ref => {
      const months = ref.billedMonths && ref.billedMonths.length ? ref.billedMonths : normalizeBillMonths(bill);
      return months.map(month => ({
        month,
        bill,
        ref,
        rowId: `${bill.id}_${ref.id}_${month}`,
        amount: Number(ref.monthlyAmount || 0),
      }));
    })).sort((a, b) => b.month.localeCompare(a.month) || String(b.bill.createdAt || "").localeCompare(String(a.bill.createdAt || "")));
  }

  const monthlyRows = buildMonthlyRows();
  const totalAmount = monthlyRows.reduce((sum, r) => sum + r.amount, 0);
  const cycleAmount = monthlyRows.filter(r => r.month === billCycleMonth).reduce((sum, r) => sum + r.amount, 0);

  function activeRangeMonths() {
    return getMonthRange(startMonthFilter, endMonthFilter);
  }

  function filteredMonthlyRows() {
    const range = activeRangeMonths();
   let arr = monthlyRows.filter(r => range.includes(r.month));
   if (searchBillId.trim()) arr = arr.filter(r => (r.bill.id || "").toLowerCase().includes(searchBillId.trim().toLowerCase()));
   if (searchDc.trim()) arr = arr.filter(r => (r.ref.dcCode || "").toLowerCase().includes(searchDc.trim().toLowerCase()));
   if (searchEnt.trim()) arr = arr.filter(r => ((r.ref.enterpriseName || "") + (r.ref.clientName || "")).toLowerCase().includes(searchEnt.trim().toLowerCase()));
   if (selectedBillingCities.length) arr = arr.filter(r => selectedBillingCities.includes(r.ref.city || ""));
   return arr;

  }

        row.ref.clientName || "",
        row.ref.city || "",
        row.bill.status || "",
        row.bill.createdBy || "",

          <button class="btn" data-page="next" ${billingPage >= pageCount ? "disabled" : ""}>下一页</button>
        </span>`;
    }
    if (window.lucide) window.lucide.createIcons();
  }

  function monthRangeLabel() {
    if (startMonthFilter && endMonthFilter) return `${startMonthFilter} 至 ${endMonthFilter}`;
    if (startMonthFilter) return `${startMonthFilter} 起`;
    if (endMonthFilter) return `截至 ${endMonthFilter}`;

  function cityMultiLabel() {
    if (!selectedBillingCities.length) return "业务归属地市";

  }
  const cityOptionHtml = JIANGSU_CITIES.map(city => `

function ticketOrgCity(ticket) {

}
function isStorageTicket(ticket) {
  return ticket?.provisionKind === "storage" || ticket?.productType === "storage" || /存储|EFS|文件系统/i.test(String(ticket?.productName || ""));
}
function storageTicketTb(ticket) {
  const explicit = Number(ticket?.storageTb || ticket?.storageTB);
  if (explicit > 0) return explicit;
  return Math.max(1, Number(ticket?.orderQty) || 1) * 2;
}
function ticketOrderInfo(ticket) {
  return `${ticket.productName || "—"} × ${isStorageTicket(ticket) ? storageTicketTb(ticket) + "TB" : Math.max(1, Number(ticket.orderQty) || 1) + " 台"}`;
}
function ticketPhonePlain(phone, fallback = "—") {
  const text = String(phone || "").trim();
  if (!text) return fallback;
  return text.replace(/^(\d{3})\*{4}(\d{4})$/, "$10000$2");
}
function ticketManagerInfo(ticket) {
  const name = ticket.managerName || "客户经理";
  const phone = ticketPhonePlain(ticket.managerPhone, "13800000000");
  const email = ticket.managerEmail || "manager@example.com";
  return `${name} · ${phone} · ${email}`;
}
function ticketUserInfo(ticket) {
  return `${ticket.userName || "—"} · ${ticketPhonePlain(ticket.userPhone)} · ${ticket.userEmail || "—"}`;
}
function randomNetSuffix() {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

  function priceBreakdown() {
    let total = 0; const rows = [];

      const p = state.chargeMode === "monthly" ? c.monthlyEco : c.onDemandEco;

      const u = state.chargeMode === "monthly" ? "/月" : "/小时";
      rows.push(["实例规格（" + (c.computeForm || "") + "）", "¥" + Number(p).toFixed(2) + u]);
    }
    const sd = State.systemDisk.find(x => x.listed !== false);
    if (sd) {
      const up = state.chargeMode === "monthly" ? sd.monthlyEco : sd.onDemandEco;
      const p = up * state.sysDiskGB;
      total += p * state.qty;
      const u = state.chargeMode === "monthly" ? "/月" : "/小时";
      rows.push(["系统盘 ESSD " + state.sysDiskGB + " GiB", "¥" + Number(p).toFixed(2) + u]);
    }
    state.dataDisks.forEach((d, i) => {
      const dd = State.dataDisk.find(x => x.id === d.id);
      if (dd) {
        const up = state.chargeMode === "monthly" ? dd.monthlyEco : dd.onDemandEco;
        const p = up * d.sizeGB;
        total += p * state.qty;
        const u = state.chargeMode === "monthly" ? "/月" : "/小时";

      const u = state.bwType === "by-traffic" ? "/小时" : "/月";

      const { total, unit } = priceBreakdown();

        ["系统盘", "ESSD " + state.sysDiskGB + " GB"],

// ===== 网络控制台：云服务器实例绑定 =====
function instStatusTag(s) {
  if (s === "running") return '<span class="tag tag-success">运行中</span>';
  if (s === "stopped") return '<span class="tag tag-muted">已停止</span>';
  if (s === "starting") return '<span class="tag tag-primary">启动中</span>';
  return '<span class="tag">' + escapeHtml(s) + '</span>';
}
function getInstancesForVpc(vpcId) {
  return State.computeInstance.filter(i => i.vpcId === vpcId);
}
function getInstancesForSubnet(subnetId) {
  return State.computeInstance.filter(i => i.subnetId === subnetId);
}
function getInstancesForSg(sgId) {
  return State.computeInstance.filter(i => (i.sgIds || []).includes(sgId));
}
function instSpecLabel(inst) {
  const c = State.compute.find(x => x.id === inst.computeSpecId);
  if (!c) return '<span class="tag tag-muted">未绑定规格</span>';
  return '<span style="font-size:11.5px;">' + escapeHtml(c.name) + ' · ' + c.vcpu + 'vCPU/' + c.memoryGB + 'GB' + (c.gpuCount > 0 ? ' · GPU×' + c.gpuCount : '') + '</span>';
}

function openInstanceBinder(kind, resource) {
  // kind: "vpc" | "subnet" | "securityGroup"
  const labelMap = { vpc: "VPC", subnet: "子网", securityGroup: "安全组" };
  const resLabel = labelMap[kind] || "";

  const getBound = () => {
    if (kind === "vpc") return getInstancesForVpc(resource.id);
    if (kind === "subnet") return getInstancesForSubnet(resource.id);
    return getInstancesForSg(resource.id);
  };
  const getAvailable = () => {
    if (kind === "vpc") return State.computeInstance.filter(i => i.vpcId !== resource.id);
    if (kind === "subnet") return State.computeInstance.filter(i => i.subnetId !== resource.id && i.vpcId === resource.vpcId);
    return State.computeInstance.filter(i => !(i.sgIds || []).includes(resource.id));
  };
  const instRow = (i, isBound) => {
    const vpc = State.vpc.find(v => v.id === i.vpcId);
    const subnet = State.subnet.find(s => s.id === i.subnetId);
    return '<tr data-inst-id="' + i.id + '">' +
      '<td><code style="font-size:11px;">' + escapeHtml(i.id) + '</code></td>' +
      '<td><strong>' + escapeHtml(i.name) + '</strong></td>' +
      '<td style="font-size:11px;">' + escapeHtml(getProviderName(i.providerId)) + '</td>' +
      '<td>' + escapeHtml(maskCreator(i.ownerName || "—")) + '</td>' +
      '<td>' + instSpecLabel(i) + '</td>' +
      '<td>' + instStatusTag(i.status) + '</td>' +
      '<td><code style="font-size:11px;color:var(--text-2);">' + escapeHtml(i.privateIp || "—") + '</code></td>' +
      '<td style="font-size:11px;color:#999;">' + (vpc ? escapeHtml(vpc.name) : "—") + (subnet ? " / " + escapeHtml(subnet.name) : "") + '</td>' +
      '<td style="text-align:center;width:70px;">' + (isBound
        ? '<button class="link-btn link-danger" data-act="unbind"><i data-lucide="unlink" style="width:14px;height:14px;"></i> 解绑</button>'
        : '<button class="link-btn" data-act="bind"><i data-lucide="link" style="width:14px;height:14px;"></i> 绑定</button>') + '</td>' +
    '</tr>';
  };

  const form = el('<div class="console-binder"></div>');
  const paint = () => {
    const bound = getBound();
    const avail = getAvailable();
    form.innerHTML =
      '<div class="console-binder-section">' +
        '<div class="console-binder-head"><span class="console-binder-title">已关联云服务器</span><span class="tag tag-success">' + bound.length + ' 台</span></div>' +
        (bound.length ? '<div class="table-wrap console-binder-table"><table class="table table-compact console-table"><thead><tr><th style="width:90px;">实例ID</th><th>名称</th><th style="width:110px;">服务商</th><th style="width:70px;">所属用户</th><th style="width:120px;">规格</th><th style="width:60px;">状态</th><th style="width:85px;">内网IP</th><th>VPC/子网</th><th style="width:70px;">操作</th></tr></thead><tbody>' + bound.map(i => instRow(i, true)).join("") + '</tbody></table></div>'
        : '<div class="console-binder-empty">暂无关联的云服务器</div>') +
      '</div>' +
      '<div class="console-binder-section">' +
        '<div class="console-binder-head"><span class="console-binder-title">可关联的云服务器</span><span class="tag tag-muted">' + avail.length + ' 台</span></div>' +
        (avail.length ? '<div class="table-wrap console-binder-table"><table class="table table-compact console-table"><thead><tr><th style="width:90px;">实例ID</th><th>名称</th><th style="width:110px;">服务商</th><th style="width:70px;">所属用户</th><th style="width:120px;">规格</th><th style="width:60px;">状态</th><th style="width:85px;">内网IP</th><th>VPC/子网</th><th style="width:70px;">操作</th></tr></thead><tbody>' + avail.map(i => instRow(i, false)).join("") + '</tbody></table></div>'
        : '<div class="console-binder-empty">暂无可关联的云服务器</div>') +
      '</div>';
    if (window.lucide) window.lucide.createIcons();
  };
  paint();

  form.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const tr = e.target.closest("tr[data-inst-id]");
    if (!tr) return;
    const inst = State.computeInstance.find(i => i.id === tr.dataset.instId);
    if (!inst) return;
    if (btn.dataset.act === "bind") {
      if (kind === "vpc") {
        inst.vpcId = resource.id;
        // 切换 VPC 后子网不再匹配，清空
        inst.subnetId = null;
      } else if (kind === "subnet") {
        inst.subnetId = resource.id;
        inst.vpcId = resource.vpcId;
      } else {
        inst.sgIds = inst.sgIds || [];
        if (!inst.sgIds.includes(resource.id)) inst.sgIds.push(resource.id);
      }
      persist("computeInstance");
      toast("已关联：" + inst.name, "success");
    } else {
      if (kind === "vpc") {
        inst.vpcId = null;
        inst.subnetId = null;
      } else if (kind === "subnet") {
        inst.subnetId = null;
      } else {
        inst.sgIds = (inst.sgIds || []).filter(id => id !== resource.id);
      }
      persist("computeInstance");
      toast("已解绑：" + inst.name, "success");
    }
    paint();
  });

  Modal.open({
    title: "管理云服务器 · " + resLabel + " " + resource.name,
    body: form,
    confirmText: "完成",
    wide: true,
    onConfirm: () => {
      setView(State.view);
    },
  });
}

// ===== 网络控制台：VPC 管理 =====

  const instanceTotal = State.vpc.reduce((sum, v) => sum + (getInstancesForVpc(v.id).length || v.resourceCount || 0), 0);
  const html = `<div class="console-page">

    </div>
    <div class="panel console-panel">
      <div class="toolbar console-toolbar"><div class="toolbar-left">
        <div class="search"><i data-lucide="search"></i><input class="input" id="searchInput" placeholder="搜索 VPC 名称 / ID / 网段" /></div>
        <select class="select" id="filterProvider"><option value="">全部服务商</option></select>
        <select class="select" id="filterRegion"><option value="">全部地域</option></select>
        <select class="select" id="filterStatus"><option value="">全部状态</option><option value="available">可用</option><option value="unavailable">不可用</option></select>

      <div class="table-wrap console-table-wrap">
        <table class="table console-table">

            <th style="width:110px;">服务商</th><th style="width:80px;">所属用户</th>
            <th style="width:100px;">地域</th><th style="width:60px;">类型</th>
            <th style="width:50px;">子网</th><th style="width:50px;">云资源</th>
            <th style="width:100px;">状态</th>

          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
  $("#content").innerHTML = html;

  const regions = [...new Set(State.vpc.map(v => v.region))];
  $("#filterRegion").innerHTML = `<option value="">全部地域</option>` + regions.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");
  const provSet = new Map();
  State.vpc.forEach(v => { if (v.providerId && !provSet.has(v.providerId)) provSet.set(v.providerId, getProviderName(v.providerId)); });
  $("#filterProvider").innerHTML = `<option value="">全部服务商</option>` + [...provSet.entries()].map(([id, label]) => `<option value="${id}">${escapeHtml(label)}</option>`).join("");

  const vpcStatusTag = (s) => s === "available" ? '<span class="tag tag-success">可用</span>' : '<span class="tag tag-muted">不可用</span>';

  const renderRows = () => {
    let rows = State.vpc.slice();
    const kw = $("#searchInput").value.toLowerCase();
    if (kw) rows = rows.filter(r => (r.name + r.id + r.cidr).toLowerCase().includes(kw));
    const fp = $("#filterProvider").value;
    if (fp) rows = rows.filter(r => r.providerId === fp);
    const fr = $("#filterRegion").value;
    if (fr) rows = rows.filter(r => r.region === fr);
    const fs = $("#filterStatus").value;
    if (fs) rows = rows.filter(r => r.status === fs);
    const fo = $("#filterOwner").value.toLowerCase();
    if (fo) rows = rows.filter(r => (r.ownerName || "").toLowerCase().includes(fo));
    $("#rowCount").textContent = `共 ${rows.length} 个`;
    if (rows.length === 0) {
      $("#tableBody").innerHTML = `<tr><td colspan="13"><div class="empty">暂无 VPC</div></td></tr>`;
      return;
    }
    $("#tableBody").innerHTML = rows.map(r => `<tr data-id="${r.id}">
        <td><code style="font-family:ui-monospace;font-size:11.5px;">${escapeHtml(r.id)}</code></td>
        <td><strong>${escapeHtml(r.name)}</strong>${(r.tags||[]).map(t=>`<span class="tag tag-muted" style="margin-left:3px;font-size:10px;padding:0 4px;">${escapeHtml(t)}</span>`).join("")}</td>
        <td><code style="font-size:12px;color:var(--text-2);">${escapeHtml(r.cidr)}</code></td>
        <td style="font-size:11.5px;">${escapeHtml(getProviderName(r.providerId))}</td>
        <td>${escapeHtml(maskCreator(r.ownerName || "—"))}</td>
        <td>${escapeHtml(r.region)}</td>
        <td><span class="tag">${escapeHtml(r.vpcType || "自定义")}</span></td>
        <td>${r.subnetCount || State.subnet.filter(s => s.vpcId === r.id).length}</td>
        <td>${getInstancesForVpc(r.id).length || r.resourceCount || 0}</td>
        <td>${vpcStatusTag(r.status)}</td>
        <td style="font-size:11px;color:#999;">${escapeHtml(r.createdAt)}</td>
        <td><div class="actions">
          <button class="link-btn" data-act="detail">详情</button>
          <span class="divider"></span>
          <button class="link-btn" data-act="edit">编辑</button>
          <span class="divider"></span>
          <button class="link-btn" data-act="instances">管理云服务器</button>
          <span class="divider"></span>
          <button class="link-btn link-danger" data-act="del">删除</button>
        </div></td>
      </tr>`).join("");
    if (window.lucide) window.lucide.createIcons();
  };

  $("#searchInput").addEventListener("input", renderRows);
  $("#filterProvider").addEventListener("change", renderRows);
  $("#filterRegion").addEventListener("change", renderRows);
  $("#filterStatus").addEventListener("change", renderRows);
  $("#filterOwner").addEventListener("input", renderRows);
  $("#vpcQuery").addEventListener("click", renderRows);
  $("#vpcReset").addEventListener("click", () => {
    $("#searchInput").value = "";
    $("#filterProvider").value = "";
    $("#filterRegion").value = "";
    $("#filterStatus").value = "";
    $("#filterOwner").value = "";
    renderRows();
  });
  $("#vpcRefresh").addEventListener("click", renderRows);
  $("#btnCreate").addEventListener("click", () => openVpcForm(null));
  $("#tableBody").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const tr = e.target.closest("tr");
    if (!tr) return;
    const id = tr.dataset.id;
    const item = State.vpc.find(x => x.id === id);
    if (!item) return;
    const act = btn.dataset.act;
    if (act === "detail") showVpcDetail(item);
    if (act === "edit") openVpcForm(item);
    if (act === "instances") openInstanceBinder("vpc", item);
    if (act === "del") {
      const linked = State.subnet.filter(s => s.vpcId === id);
      if (linked.length) { toast(`该 VPC 下仍有 ${linked.length} 个子网，无法删除`, "error"); return; }
      if (!confirm("确认删除该 VPC？")) return;
      State.vpc = State.vpc.filter(x => x.id !== id);
      persist("vpc");
      renderRows();
      toast("已删除", "success");
    }
  });
  renderRows();
}

    <div class="detail-section"><div class="detail-section-title">基本信息</div>
      <div class="kv-grid">
        ${kv("VPC ID", v.id)}
        ${kv("VPC名称", v.name)}
        ${kv("IPv4网段", v.cidr)}

        ${kv("地域", v.region)}

        ${kv("服务商", getProviderName(v.providerId))}
        ${kv("所属用户", maskCreator(v.ownerName || "—"))}

        <tbody>${subnets.map(s => `<tr><td><code style="font-size:11px;">${escapeHtml(s.id)}</code></td><td>${escapeHtml(s.name)}</td><td><code style="font-size:11px;color:var(--text-2);">${escapeHtml(s.cidr)}</code></td><td>${escapeHtml(s.az)}</td><td>${s.availableIPs}/${s.totalIPs}</td></tr>`).join("")}</tbody>
      </table></div>` : ""}
    ${(function() {
      const insts = getInstancesForVpc(v.id);

        '<table class="table table-compact" style="margin-top:6px;"><thead><tr><th>实例ID</th><th>名称</th><th>服务商</th><th>所属用户</th><th>规格</th><th>状态</th><th>内网IP</th><th>子网</th></tr></thead>' +
        '<tbody>' + insts.map(i => { const sub = State.subnet.find(s => s.id === i.subnetId); return '<tr><td><code style="font-size:11px;">' + escapeHtml(i.id) + '</code></td><td>' + escapeHtml(i.name) + '</td><td style="font-size:11px;">' + escapeHtml(getProviderName(i.providerId)) + '</td><td>' + escapeHtml(maskCreator(i.ownerName || "—")) + '</td><td>' + instSpecLabel(i) + '</td><td>' + instStatusTag(i.status) + '</td><td><code style="font-size:11px;">' + escapeHtml(i.privateIp || "—") + '</code></td><td>' + (sub ? escapeHtml(sub.name) : "—") + '</td></tr>'; }).join("") + '</tbody></table></div>';

function openVpcForm(item) {
  const isEdit = !!item;
  const data = item ? { ...item } : { id: "vpc-bp" + Math.random().toString(36).slice(2, 6), name: "", cidr: "", ipv6Cidr: "", region: "", providerId: "", ownerName: "", vpcType: "自定义", routeTable: "", networkAcl: "", dhcpOptions: "默认 DHCP 选项集", resourceCount: 0, subnetCount: 0, status: "available", description: "", tags: [], createdBy: getCurrentOperator(), createdAt: nowStr(), updatedAt: nowStr() };
  const form = el(`<div class="form console-form" data-form-title="${isEdit ? "编辑 VPC" : "新建 VPC"}"></div>`);
  form.appendChild(fieldWrap("VPC名称", el(`<input class="input" name="name" value="${escapeHtml(data.name)}" placeholder="如：生产网 VPC" />`), { required: true }));
  form.appendChild(fieldWrap("服务商", el(`<select class="select" name="providerId"><option value="">-- 请选择 --</option>${getProviderOptions().map(o => `<option value="${o.value}" ${data.providerId === o.value ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`), { required: true }));
  form.appendChild(fieldWrap("所属用户", el(`<select class="select" name="ownerName">${ownerOptions(data.ownerName || "")}</select>`), { required: true }));
  form.appendChild(fieldWrap("IPv4网段", el(`<input class="input" name="cidr" value="${escapeHtml(data.cidr)}" placeholder="如：10.0.0.0/16" />`), { required: true, hint: "CIDR 格式，可用范围 /16 ~ /28" }));
  if (!isEdit) {
    form.appendChild(fieldWrap("默认子网名称", el(`<input class="input" name="_subnetName" value="${defaultSubnetName()}" />`), { required: true }));
    form.appendChild(fieldWrap("默认子网网段", el(`<input class="input" name="_subnetCidr" value="10.0.1.0/24" />`), { required: true, hint: "创建 VPC 时同步创建默认子网" }));
  }
  form.appendChild(fieldWrap("IPv6网段", el(`<input class="input" name="ipv6Cidr" value="${escapeHtml(data.ipv6Cidr || "")}" placeholder="如：2408:4008::/64（选填）" />`)));
  const regions = [...new Set(State.provider.map(p => p.region))];
  form.appendChild(fieldWrap("地域", el(`<select class="select" name="region">${regions.length ? regions.map(r => `<option ${r === data.region ? "selected" : ""}>${escapeHtml(r)}</option>`).join("") : '<option value="">请先在服务商管理中添加地域</option>'}</select>`), { required: true }));
  form.appendChild(fieldWrap("VPC类型", el(`<select class="select" name="vpcType"><option value="自定义" ${data.vpcType === "自定义" ? "selected" : ""}>自定义</option><option value="默认" ${data.vpcType === "默认" ? "selected" : ""}>默认</option></select>`)));
  form.appendChild(fieldWrap("路由表", el(`<input class="input" name="routeTable" value="${escapeHtml(data.routeTable || "")}" placeholder="关联路由表名称" />`)));
  form.appendChild(fieldWrap("网络ACL", el(`<input class="input" name="networkAcl" value="${escapeHtml(data.networkAcl || "")}" placeholder="关联网络 ACL 名称" />`)));
  if (isEdit) {
    form.appendChild(fieldWrap("状态", el(`<select class="select" name="status"><option value="available" ${data.status === "available" ? "selected" : ""}>可用</option><option value="unavailable" ${data.status === "unavailable" ? "selected" : ""}>不可用</option></select>`)));
  }
  form.appendChild(fieldWrap("描述", el(`<input class="input" name="description" value="${escapeHtml(data.description || "")}" placeholder="VPC用途说明（选填）" />`)));
  Modal.open({
    title: (isEdit ? "编辑" : "新建") + " VPC",
    body: form, confirmText: isEdit ? "保存" : "创建",
    onConfirm: () => {
      const inputs = form.querySelectorAll("[name]");
      inputs.forEach(i => { data[i.name] = i.value.trim(); });
      if (!data.name) { toast("请输入 VPC 名称", "error"); return false; }
      if (!data.cidr) { toast("请输入 IPv4 网段", "error"); return false; }
      if (!data.region) { toast("请选择地域", "error"); return false; }
      if (!data.providerId) { toast("请选择服务商", "error"); return false; }
      if (!data.ownerName) { toast("请填写所属用户", "error"); return false; }
      if (!isEdit && (!data._subnetName || !data._subnetCidr)) { toast("请补充默认子网信息", "error"); return false; }
      const defaultSubnetNameValue = data._subnetName;
      const defaultSubnetCidrValue = data._subnetCidr;
      delete data._subnetName;
      delete data._subnetCidr;
      data.updatedAt = nowStr();
      if (isEdit) {
        const idx = State.vpc.findIndex(x => x.id === data.id);
        if (idx >= 0) State.vpc[idx] = data;
      } else {
        State.vpc.push(data);
        State.subnet.push({
          id: "sub-bp" + Math.random().toString(36).slice(2, 6),
          name: defaultSubnetNameValue,
          cidr: defaultSubnetCidrValue,
          ipv6Cidr: "",
          az: data.region ? data.region.replace(/[（）]/g, "-") + "可用区B" : "",
          vpcId: data.id,
          providerId: data.providerId,
          ownerName: data.ownerName,
          routeTable: data.routeTable || "系统路由表",
          networkAcl: data.networkAcl || "",
          gateway: "",
          totalIPs: 256,
          availableIPs: 251,
          resourceCount: 0,
          status: "available",
          createdBy: getCurrentOperator(),
          createdAt: nowStr(),
          updatedAt: nowStr()
        });
        persist("subnet");
      }
      persist("vpc");
      setView("vpc");
      toast(isEdit ? "已保存" : "VPC 已创建", "success");
    },
  });
}

// ===== 网络控制台：子网管理 =====
function renderSubnetList() {

      <div class="kv-grid">
        ${kv("创建人", maskCreator(s.createdBy))}
        ${kv("创建时间", s.createdAt)}
        ${kv("更新时间", s.updatedAt)}

function openSubnetForm(item) {
  const isEdit = !!item;
  const data = item ? { ...item } : { id: "sub-bp" + Math.random().toString(36).slice(2, 6), name: "", cidr: "", ipv6Cidr: "", az: "", vpcId: "", providerId: "", ownerName: "", routeTable: "", networkAcl: "", gateway: "", totalIPs: 256, availableIPs: 251, resourceCount: 0, status: "available", createdBy: getCurrentOperator(), createdAt: nowStr(), updatedAt: nowStr() };
  if (!State.vpc.length) { toast("请先创建 VPC", "error"); return; }
  const form = el(`<div class="form console-form" data-form-title="${isEdit ? "编辑子网" : "新建子网"}"></div>`);
  form.appendChild(fieldWrap("所属VPC", el(`<select class="select" name="vpcId">${State.vpc.map(v => `<option value="${v.id}" ${v.id === data.vpcId ? "selected" : ""}>${escapeHtml(v.name)} (${escapeHtml(v.cidr)})</option>`).join("")}</select>`), { required: true }));
  form.appendChild(fieldWrap("服务商", el(`<select class="select" name="providerId"><option value="">-- 请选择 --</option>${getProviderOptions().map(o => `<option value="${o.value}" ${data.providerId === o.value ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`), { required: true }));
  form.appendChild(fieldWrap("所属用户", el(`<select class="select" name="ownerName">${ownerOptions(data.ownerName || "")}</select>`), { required: true }));
  form.appendChild(fieldWrap("子网名称", el(`<input class="input" name="name" value="${escapeHtml(data.name)}" placeholder="如：Web 子网-A" />`), { required: true }));
  form.appendChild(fieldWrap("IPv4网段", el(`<input class="input" name="cidr" value="${escapeHtml(data.cidr)}" placeholder="如：10.0.1.0/24" />`), { required: true, hint: "需在所属 VPC 网段范围内" }));
  form.appendChild(fieldWrap("IPv6网段", el(`<input class="input" name="ipv6Cidr" value="${escapeHtml(data.ipv6Cidr || "")}" placeholder="如：2408:4008:0:1::/64（选填）" />`)));
  form.appendChild(fieldWrap("可用区", el(`<input class="input" name="az" value="${escapeHtml(data.az)}" placeholder="如：华东1-可用区B" />`), { required: true }));
  form.appendChild(fieldWrap("网关", el(`<input class="input" name="gateway" value="${escapeHtml(data.gateway || "")}" placeholder="如：10.0.1.253" />`)));
  form.appendChild(fieldWrap("路由表", el(`<input class="input" name="routeTable" value="${escapeHtml(data.routeTable || "")}" placeholder="关联路由表（选填）" />`)));
  form.appendChild(fieldWrap("网络ACL", el(`<input class="input" name="networkAcl" value="${escapeHtml(data.networkAcl || "")}" placeholder="关联网络 ACL（选填）" />`)));
  Modal.open({
    title: (isEdit ? "编辑" : "新建") + "子网",
    body: form, confirmText: isEdit ? "保存" : "创建",
    onConfirm: () => {
      const inputs = form.querySelectorAll("[name]");
      inputs.forEach(i => { data[i.name] = i.value.trim(); });
      if (!data.name) { toast("请输入子网名称", "error"); return false; }
      if (!data.cidr) { toast("请输入 IPv4 网段", "error"); return false; }
      if (!data.az) { toast("请输入可用区", "error"); return false; }
      if (!data.vpcId) { toast("请选择所属 VPC", "error"); return false; }
      if (!data.providerId) { toast("请选择服务商", "error"); return false; }
      if (!data.ownerName) { toast("请填写所属用户", "error"); return false; }
      data.updatedAt = nowStr();
      if (isEdit) {
        const idx = State.subnet.findIndex(x => x.id === data.id);
        if (idx >= 0) State.subnet[idx] = data;
      } else {
        State.subnet.push(data);
      }
      persist("subnet");
      setView("subnet");
      toast(isEdit ? "已保存" : "子网已创建", "success");
    },
  });
}

  const body = el(`<div class="console-detail">
    <div class="detail-section"><div class="detail-section-title">基本信息</div>
      <div class="kv-grid">
        ${kv("安全组ID", sg.id)}
        ${kv("安全组名称", sg.name)}
        ${kv("类型", sg.sgType || "普通安全组")}
        ${kv("服务商", getProviderName(sg.providerId))}
        ${kv("所属用户", maskCreator(sg.ownerName || "—"))}
        ${kv("所属VPC", vpc ? vpc.name : "经典网络")}
        ${kv("描述", sg.description || "—")}
        ${kv("关联实例数", sg.instanceCount || 0)}
        ${kv("创建人", maskCreator(sg.createdBy))}
        ${kv("创建时间", sg.createdAt)}
        ${kv("更新时间", sg.updatedAt)}
      </div>
    </div>
    ${rules.length ? `<div class="detail-section"><div class="detail-section-title">访问规则（${sg.inboundRules || rules.filter(r=>r.dir==="入方向").length} 条入 / ${sg.outboundRules || rules.filter(r=>r.dir==="出方向").length} 条出）</div>
      <table class="table table-compact" style="margin-top:6px;">
        <thead><tr><th style="width:70px;">方向</th><th style="width:60px;">策略</th><th style="width:60px;">协议</th><th style="width:120px;">端口范围</th><th>授权对象</th><th>描述</th></tr></thead>
        <tbody>${rules.map(r => `<tr>
          <td>${r.dir === "入方向" ? '<span class="tag tag-success" style="font-size:10px;">入</span>' : '<span class="tag tag-muted" style="font-size:10px;">出</span>'}</td>
          <td>${r.action === "允许" ? '<span style="color:var(--success);">允许</span>' : '<span style="color:var(--danger);">拒绝</span>'}</td>
          <td>${escapeHtml(r.proto)}</td>
          <td><code style="font-size:11px;">${escapeHtml(r.port)}</code></td>
          <td><code style="font-size:11px;color:var(--text-2);">${escapeHtml(r.source)}</code></td>
          <td style="color:var(--text-2);">${escapeHtml(r.desc)}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : `<div class="detail-section"><div class="detail-section-title">访问规则</div><div style="color:var(--text-3);padding:8px 0;">暂无规则</div></div>`}
    ${(function() {
      const insts = getInstancesForSg(sg.id);
      if (!insts.length) return "";
      return '<div class="detail-section"><div class="detail-section-title">关联云服务器（' + insts.length + ' 台）</div>' +
        '<table class="table table-compact" style="margin-top:6px;"><thead><tr><th>实例ID</th><th>名称</th><th>服务商</th><th>所属用户</th><th>规格</th><th>状态</th><th>内网IP</th></tr></thead>' +

    })()}

function openSecurityGroupForm(item) {
  const isEdit = !!item;
  const data = item ? { ...item } : { id: "sg-bp" + Math.random().toString(36).slice(2, 6), name: "", sgType: "普通安全组", vpcId: null, providerId: "", ownerName: "", securityGroupType: "web", inboundRules: 0, outboundRules: 0, instanceCount: 0, description: "", createdBy: getCurrentOperator(), createdAt: nowStr(), updatedAt: nowStr() };
  const form = el(`<div class="form console-form" data-form-title="${isEdit ? "编辑安全组" : "新建安全组"}"></div>`);
  form.appendChild(fieldWrap("安全组名称", el(`<input class="input" name="name" value="${escapeHtml(data.name)}" placeholder="如：Web 服务安全组" />`), { required: true }));
  form.appendChild(fieldWrap("安全组类型", el(`<select class="select" name="sgType"><option value="普通安全组" ${data.sgType === "普通安全组" ? "selected" : ""}>普通安全组</option><option value="企业安全组" ${data.sgType === "企业安全组" ? "selected" : ""}>企业安全组</option></select>`)));
  form.appendChild(fieldWrap("服务商", el(`<select class="select" name="providerId"><option value="">-- 请选择 --</option>${getProviderOptions().map(o => `<option value="${o.value}" ${data.providerId === o.value ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}</select>`), { required: true }));
  form.appendChild(fieldWrap("所属用户", el(`<select class="select" name="ownerName">${ownerOptions(data.ownerName || "")}</select>`), { required: true }));
  form.appendChild(fieldWrap("所属VPC", el(`<select class="select" name="vpcId"><option value="">经典网络（不绑定VPC）</option>${State.vpc.map(v => `<option value="${v.id}" ${v.id === data.vpcId ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select>`)));
  form.appendChild(fieldWrap("规则模板", el(`<select class="select" name="securityGroupType">
    <option value="web" ${data.securityGroupType === "web" ? "selected" : ""}>Web 服务（80/443）</option>
    <option value="db" ${data.securityGroupType === "db" ? "selected" : ""}>数据库（3306/5432）</option>
    <option value="ops" ${data.securityGroupType === "ops" ? "selected" : ""}>运维 SSH/RDP（22/3389）</option>
    <option value="gpu" ${data.securityGroupType === "gpu" ? "selected" : ""}>GPU 训练（RDMA）</option>
    <option value="dmz" ${data.securityGroupType === "dmz" ? "selected" : ""}>DMZ 严格入站</option>
  </select>`), { hint: "选择后将自动填充对应的入方向 / 出方向规则" }));
  form.appendChild(fieldWrap("描述", el(`<input class="input" name="description" value="${escapeHtml(data.description || "")}" placeholder="安全组用途说明" />`)));
  const preview = el(`<div class="net-form-section" style="grid-column:1 / -1;">
    <div class="net-form-head"><div class="net-form-title"><i data-lucide="list-checks"></i>模板规则预览</div><div class="net-form-sub">默认规则</div></div>
    ${sgRulePreviewHtml(data.securityGroupType || "web")}
  </div>`);
  form.appendChild(preview);
  form.querySelector("[name=securityGroupType]").addEventListener("change", e => {
    preview.querySelector("[data-rule-body]").innerHTML = sgRuleRowsHtml(e.target.value);
  });
  Modal.open({
    title: (isEdit ? "编辑" : "新建") + "安全组",
    body: form, confirmText: isEdit ? "保存" : "创建",
    onConfirm: () => {
      const inputs = form.querySelectorAll("[name]");
      inputs.forEach(i => { data[i.name] = i.value.trim(); });
      if (!data.name) { toast("请输入安全组名称", "error"); return false; }
      if (!data.providerId) { toast("请选择服务商", "error"); return false; }
      if (!data.ownerName) { toast("请填写所属用户", "error"); return false; }
      const rules = SG_RULE_TEMPLATES[data.securityGroupType] || [];
      data.inboundRules = rules.filter(r => r.dir === "入方向").length;
      data.outboundRules = rules.filter(r => r.dir === "出方向").length;
      data.updatedAt = nowStr();
      if (isEdit) {
        const idx = State.securityGroup.findIndex(x => x.id === data.id);
        if (idx >= 0) State.securityGroup[idx] = data;
      } else {
        State.securityGroup.push(data);
      }
      persist("securityGroup");
      setView("securityGroup");
      toast(isEdit ? "已保存" : "安全组已创建", "success");
    },
  });
}

      <div class="trace-board"><div class="trace-board-head"><div class="trace-board-title"><span class="trace-step-index">2</span><i data-lucide="crosshair"></i>全部数据</div><div class="trace-search-group"><select class="trace-status-select" id="traceStatusSelect"></select><div class="trace-search-divider"></div><div class="trace-search-wrap"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><input class="input" id="traceNoSearch" placeholder="输入单号 / 关联单号 / 用户" /></div><button class="trace-search-btn" id="traceNoSearchBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>搜索</button><div class="trace-search-divider"></div><span class="tag tag-danger" id="traceExceptionCount">定位记录 0 条</span></div></div><div class="trace-board-body"><div class="trace-business-scroll"><table class="trace-business-table"><thead><tr id="traceRecordHead"></tr></thead><tbody id="traceRecordBody"></tbody></table></div></div></div>
      <div class="trace-board"><div class="trace-board-head"><div class="trace-board-title"><span class="trace-step-index">3</span><i data-lucide="git-commit-horizontal"></i>选中链路流程细分</div></div><div class="trace-board-body"><div class="trace-timeline-summary" id="traceTimelineSummary"></div><div class="trace-timeline" id="traceTimeline"></div></div></div>
    </div>
  </div>`;
  paint();
  $("#traceNoSearchBtn").addEventListener("click", () => {
    keyword = ($("#traceNoSearch")?.value || "").trim();
    paint();
    toast("已按单号/用户筛选定位记录", "success");
  });
  const statusSelectEl = $("#traceStatusSelect");
  if (statusSelectEl) statusSelectEl.addEventListener("change", e => {
    activeStatus = e.target.value;
    paint();
  });
  $("#traceNoSearch").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    keyword = e.target.value.trim();
    paint();
  });
}


document.querySelectorAll(".nav-item").forEach(el => {
  el.addEventListener("click", () => setView(el.dataset.view));
});
// collapsible nav groups
document.querySelectorAll(".nav-group-header").forEach(hdr => {
  hdr.addEventListener("click", () => {
    const grp = hdr.closest(".nav-group");
    if (grp) grp.classList.toggle("collapsed");
    if (window.lucide) window.lucide.createIcons();
  });
});
if (window.lucide) window.lucide.createIcons();
setView("computeDataOverview");

  </script>
</body>
